<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#142033">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Java Бариста">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<script src="config.js"></script>
<title>Java Бариста</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Unbounded:wght@600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* Layout: one phone-width column. Home = summary card + zigzag lesson path; lesson = full-screen exercise with a fixed action bar. */
:root{
  --display:'Unbounded','Onest',system-ui,sans-serif;
  --body:'Onest',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;

  --bg:#ECEFF4; --surface:#FFFFFF; --ink:#142033; --muted:#566377; --line:#D3DAE6; --line-edge:#BAC3D2;
  --primary:#2556D8; --primary-edge:#173C9E; --on-primary:#FFFFFF;
  --good:#169B66; --good-edge:#0F7A50; --good-bg:#DDF5E9; --on-good:#FFFFFF; --good-ink:#0B5C3B;
  --bad:#D63A41; --bad-edge:#A32A30; --bad-bg:#FDE4E5; --on-bad:#FFFFFF; --bad-ink:#8E2227;
  --warm:#D98200;
  --code-bg:#F2F5FA; --code-ink:#1B2740; --con-bg:#162033; --con-ink:#DCE6F7; --gold:#D99A00;
  --kw:#A1308F; --str:#1A7F4B; --num:#B85600; --com:#76839A; --ty:#1B5FC4;
  --u1:#2556D8; --u2:#0B7F8A; --u3:#6A3FCF; --u4:#B35F00; --u5:#C23A60; --u6:#1F8A4C; --on-u:#FFFFFF;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E141D; --surface:#171F2C; --ink:#E7ECF4; --muted:#93A0B4; --line:#29344A; --line-edge:#1F2838;
    --primary:#6D98FF; --primary-edge:#3E67CF; --on-primary:#0B1220;
    --good:#3DCB8C; --good-edge:#23996A; --good-bg:#12362A; --on-good:#062015; --good-ink:#8FE8BF;
    --bad:#FF7479; --bad-edge:#C94950; --bad-bg:#3A1A1E; --on-bad:#2A0A0C; --bad-ink:#FFA5A8;
    --warm:#FFB32E;
    --code-bg:#0B1019; --code-ink:#DCE4F2; --con-bg:#05080E; --con-ink:#DCE6F7; --gold:#FFC857;
    --kw:#E58BDD; --str:#7FDDA6; --num:#FFB066; --com:#7D8BA3; --ty:#7DB2FF;
    --u1:#7BA0FF; --u2:#4CC9D6; --u3:#A98BFF; --u4:#FFB347; --u5:#FF8FAA; --u6:#5FD38E; --on-u:#0B1220;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E141D; --surface:#171F2C; --ink:#E7ECF4; --muted:#93A0B4; --line:#29344A; --line-edge:#1F2838;
  --primary:#6D98FF; --primary-edge:#3E67CF; --on-primary:#0B1220;
  --good:#3DCB8C; --good-edge:#23996A; --good-bg:#12362A; --on-good:#062015; --good-ink:#8FE8BF;
  --bad:#FF7479; --bad-edge:#C94950; --bad-bg:#3A1A1E; --on-bad:#2A0A0C; --bad-ink:#FFA5A8;
  --warm:#FFB32E;
  --code-bg:#0B1019; --code-ink:#DCE4F2; --con-bg:#05080E; --con-ink:#DCE6F7; --gold:#FFC857;
  --kw:#E58BDD; --str:#7FDDA6; --num:#FFB066; --com:#7D8BA3; --ty:#7DB2FF;
  --u1:#7BA0FF; --u2:#4CC9D6; --u3:#A98BFF; --u4:#FFB347; --u5:#FF8FAA; --u6:#5FD38E; --on-u:#0B1220;
  color-scheme:dark;
}

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent}
*,*::before,*::after{box-sizing:border-box}
button{font-family:inherit;color:inherit}
:focus-visible{outline:3px solid var(--primary);outline-offset:2px}
svg{display:block}
.ico{width:1.2em;height:1.2em;fill:currentColor}
.ico.stroke{fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}

.app{max-width:560px;margin:0 auto;padding-inline:16px;min-height:100%}
.app > *{min-width:0}

/* ---------- header ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px}
.brand{font-family:var(--display);font-weight:700;font-size:18px;letter-spacing:-.01em}
.brand span{color:var(--primary)}
.stats{display:flex;gap:8px}
.stat{display:flex;align-items:center;gap:6px;font-weight:700;font-size:15px;padding:6px 12px;border-radius:999px;background:var(--surface);border:2px solid var(--line);font-variant-numeric:tabular-nums}
.stat.streak .ico{color:var(--warm)}
.stat.xp .ico{color:var(--primary)}
.stat.off .ico{color:var(--muted)}

/* ---------- home ---------- */
.next{background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:18px;display:grid;gap:14px;margin-top:4px}
.kicker{margin:0;font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.next h1{margin:0;font-family:var(--display);font-weight:700;font-size:20px;line-height:1.25;text-wrap:balance}
.next .sub{margin:0;color:var(--muted);font-size:14px}
.meter{display:flex;align-items:center;gap:12px;font-size:13px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
.track{flex:1;height:12px;border-radius:999px;background:var(--line);overflow:hidden}
.fill{height:100%;border-radius:999px;background:var(--primary);transition:width .75s cubic-bezier(.2,.8,.2,1)}
.unit{margin-top:28px;background:var(--uc);color:var(--on-u);border-radius:16px;padding:14px 16px;box-shadow:0 4px 0 color-mix(in srgb,var(--uc) 70%,#000);display:grid;gap:2px}
.unit .kicker{color:inherit;opacity:.85}
.unit h2{margin:0;font-family:var(--display);font-weight:700;font-size:16px;line-height:1.3}
.unit p{margin:0;font-size:13px;opacity:.9}
.path{display:flex;flex-direction:column;align-items:center;gap:20px;padding-block:22px 4px}
.nodewrap{display:flex;flex-direction:column;align-items:center;gap:10px;translate:calc(var(--k) * min(1vw,5.2px)) 0}
.bubble{background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:4px 12px;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--uc);position:relative}
.bubble::after{content:"";position:absolute;left:50%;bottom:-7px;width:10px;height:10px;background:var(--surface);border-right:2px solid var(--line);border-bottom:2px solid var(--line);transform:translateX(-50%) rotate(45deg)}
.node{width:76px;height:76px;border-radius:50%;border:0;background:var(--uc);color:var(--on-u);display:grid;place-items:center;cursor:pointer;box-shadow:0 6px 0 color-mix(in srgb,var(--uc) 70%,#000);font-size:28px}
.node:active:not(:disabled){transform:translateY(4px);box-shadow:0 2px 0 color-mix(in srgb,var(--uc) 70%,#000)}
.node:disabled{background:var(--line);color:var(--muted);box-shadow:0 6px 0 var(--line-edge);cursor:not-allowed}
.nlabel{font-weight:600;font-size:14px;text-align:center;max-width:180px;line-height:1.3}
.nlabel small{display:block;font-weight:500;color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.foot{margin-block:36px 24px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;color:var(--muted);font-size:13px}
.linkbtn{background:none;border:0;padding:6px 0;font-size:13px;font-weight:600;color:var(--muted);text-decoration:underline;cursor:pointer}
.linkbtn.danger{color:var(--bad)}

/* ---------- buttons ---------- */
.btn{display:block;width:100%;font-weight:700;font-size:15px;letter-spacing:.05em;text-transform:uppercase;border:0;border-radius:14px;padding:15px 20px;cursor:pointer;background:var(--primary);color:var(--on-primary);box-shadow:0 4px 0 var(--primary-edge);text-align:center}
.btn:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--primary-edge)}
.btn:disabled{background:var(--line);color:var(--muted);box-shadow:0 4px 0 var(--line-edge);cursor:not-allowed}
.btn.good{background:var(--good);color:var(--on-good);box-shadow:0 4px 0 var(--good-edge)}
.btn.bad{background:var(--bad);color:var(--on-bad);box-shadow:0 4px 0 var(--bad-edge)}
.btn.ghost{background:transparent;color:var(--primary);border:2px solid var(--line);box-shadow:0 3px 0 var(--line)}

/* ---------- lesson ---------- */
.lesson{display:flex;flex-direction:column;min-height:100%;padding-bottom:230px}
.lhead{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:14px;padding-block:14px}
.x{flex:none;width:36px;height:36px;border-radius:10px;border:0;background:transparent;color:var(--muted);display:grid;place-items:center;cursor:pointer;font-size:22px}
.x:hover{background:var(--line)}
.lives{flex:none;display:flex;align-items:center;gap:1px;color:var(--bad);font-size:17px}
.hrt{display:grid}
.hrt.lost{color:var(--line)}
.stage{display:grid;gap:18px;padding-top:10px}
.q{margin:0;font-family:var(--display);font-weight:600;font-size:19px;line-height:1.35;text-wrap:balance}
.code{margin:0;background:var(--code-bg);color:var(--code-ink);border:1px solid var(--line);border-radius:14px;padding:14px 16px;font:400 13.5px/1.7 var(--mono);overflow-x:auto;white-space:pre;tab-size:4}
.t-kw{color:var(--kw);font-weight:500}.t-str{color:var(--str)}.t-num{color:var(--num)}.t-com{color:var(--com);font-style:italic}.t-ty{color:var(--ty)}
.opts{display:grid;gap:12px}
.opt{display:block;width:100%;text-align:left;font-size:16px;padding:14px 16px;border:2px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);box-shadow:0 3px 0 var(--line);cursor:pointer;min-width:0;overflow-wrap:anywhere}
.opt.mono{font-family:var(--mono);font-size:13.5px;white-space:pre-wrap}
.opt:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.opt.sel{border-color:var(--primary);box-shadow:0 3px 0 var(--primary);background:color-mix(in srgb,var(--primary) 10%,var(--surface))}
.opt.good{border-color:var(--good);box-shadow:0 3px 0 var(--good);background:var(--good-bg);color:var(--good-ink)}
.opt.bad{border-color:var(--bad);box-shadow:0 3px 0 var(--bad);background:var(--bad-bg);color:var(--bad-ink)}
.opt:disabled{cursor:default}
.blank{display:inline-block;min-width:6ch;padding:0 8px;margin:0 2px;border:0;border-bottom:2px solid var(--primary);border-radius:6px 6px 0 0;background:color-mix(in srgb,var(--primary) 12%,transparent);color:var(--code-ink);font:inherit;line-height:1.45;cursor:pointer;text-align:center;vertical-align:baseline}
.blank.good{border-color:var(--good);background:var(--good-bg);color:var(--good-ink)}
.blank.bad{border-color:var(--bad);background:var(--bad-bg);color:var(--bad-ink)}
.bank{display:flex;flex-wrap:wrap;gap:10px}
.chip{font:600 14px var(--mono);padding:10px 14px;border:2px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);box-shadow:0 3px 0 var(--line);cursor:pointer}
.chip:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.chip:disabled{opacity:.3;box-shadow:none;cursor:default}
.build{min-height:64px;border:2px dashed var(--line);border-radius:14px;padding:10px;display:grid;gap:8px;background:var(--surface);align-content:start}
.build.good{border:2px solid var(--good);background:var(--good-bg)}
.build.bad{border:2px solid var(--bad);background:var(--bad-bg)}
.hint{margin:0;color:var(--muted);font-size:14px;padding:6px 4px}
.lines{display:grid;gap:8px}
.line{width:100%;text-align:left;font:500 13px/1.5 var(--mono);white-space:pre-wrap;overflow-wrap:anywhere;padding:10px 12px;border:2px solid var(--line);border-radius:12px;background:var(--code-bg);color:var(--code-ink);box-shadow:0 3px 0 var(--line);cursor:pointer;min-width:0}
.line:disabled{cursor:default}
.line:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.line.ghost{opacity:.3;box-shadow:none}

.bar{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--surface);border-top:2px solid var(--line);padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px))}
.bar.good{background:var(--good-bg);border-top-color:var(--good)}
.bar.bad{background:var(--bad-bg);border-top-color:var(--bad)}
.bar-in{max-width:560px;margin:0 auto;display:grid;gap:12px}
.fb{display:flex;gap:12px;align-items:flex-start}
.fb .badge{flex:none;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-size:20px}
.good .badge{background:var(--good);color:var(--on-good)}
.bad .badge{background:var(--bad);color:var(--on-bad)}
.fb h3{margin:0;font-family:var(--display);font-weight:700;font-size:16px}
.good .fb h3{color:var(--good-ink)}.bad .fb h3{color:var(--bad-ink)}
.fb p{margin:4px 0 0;font-size:14.5px;line-height:1.45;overflow-wrap:anywhere}
.good .fb p{color:var(--good-ink)}.bad .fb p{color:var(--bad-ink)}
.fb .ans{display:block;margin-top:6px;font:500 13px/1.5 var(--mono);white-space:pre-wrap;overflow-wrap:anywhere}
.fb-text{min-width:0;max-height:36vh;overflow-y:auto}

/* ---------- result ---------- */
.result{display:grid;gap:22px;padding-block:48px 32px;text-align:center;justify-items:center}
.result h1{margin:0;font-family:var(--display);font-weight:700;font-size:26px;line-height:1.2;text-wrap:balance}
.result p{margin:0;color:var(--muted);max-width:34ch}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;width:100%}
.tile{border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 6px;display:grid;gap:2px}
.tile b{font-family:var(--display);font-size:22px;font-variant-numeric:tabular-nums}
.tile span{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.tile.xp b{color:var(--primary)}
.btns{display:grid;gap:12px;width:100%}
.mark{width:84px;height:84px;border-radius:50%;display:grid;place-items:center;font-size:40px}
.mark.ok{background:var(--good);color:var(--on-good);box-shadow:0 6px 0 var(--good-edge)}
.mark.no{background:var(--bad);color:var(--on-bad);box-shadow:0 6px 0 var(--bad-edge)}

.how{margin:-8px 0 0;color:var(--muted);font-size:14.5px}
@media (hover:hover){
  .opt:hover:not(:disabled),.chip:hover:not(:disabled),.line:hover:not(:disabled){border-color:var(--primary)}
  .btn:hover:not(:disabled){filter:brightness(1.07)}
  .node:hover:not(:disabled){filter:brightness(1.07)}
}

/* ---------- motion ---------- */
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
@keyframes viewin{from{opacity:0;transform:translateY(16px)}}
@keyframes stagein{from{opacity:0;transform:translateX(18px)}}
@keyframes nodein{from{opacity:0;transform:scale(.3)}}
@keyframes ping{from{opacity:.7;transform:scale(1)}to{opacity:0;transform:scale(1.4)}}
@keyframes bob{50%{transform:translateY(-5px)}}
@keyframes bump{40%{transform:scale(1.25)}}
@keyframes flicker{0%,100%{transform:scale(1) rotate(0)}30%{transform:scale(1.1,1.2) rotate(-4deg)}60%{transform:scale(.94,1.05) rotate(3deg)}}
@keyframes tap{40%{transform:scale(.97)}}
@keyframes pop{40%{transform:scale(1.07)}}
@keyframes shake{20%{transform:translateX(-9px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}
@keyframes setin{from{opacity:.2;transform:scale(.6)}}
@keyframes hbreak{0%{color:var(--bad);transform:scale(1)}25%{transform:scale(1.7) rotate(-12deg)}50%{transform:scale(1.35) rotate(10deg)}100%{color:var(--line);transform:scale(1)}}
@keyframes barin{from{transform:translateY(100%)}}
@keyframes floatup{from{opacity:0;transform:translateY(14px) scale(.8)}20%{opacity:1;transform:translateY(0) scale(1.1)}to{opacity:0;transform:translateY(-34px)}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes markin{from{transform:scale(0) rotate(-25deg)}}
@keyframes fall{to{transform:translate(var(--dx),110vh) rotate(var(--r))}}

.view.enter{animation:viewin .4s cubic-bezier(.2,.8,.2,1) backwards}
.nodewrap.enter{animation:nodein .5s cubic-bezier(.3,1.5,.5,1) backwards;animation-delay:var(--d,0ms)}
.node{position:relative}
.node.current::after{content:"";position:absolute;inset:-5px;border-radius:50%;border:4px solid var(--uc);pointer-events:none;animation:ping 1.8s ease-out infinite}
.bubble{animation:bob 1.6s ease-in-out infinite}
.stat.bump{animation:bump .6s cubic-bezier(.3,1.6,.5,1)}
.stat.streak:not(.off) .ico{transform-origin:50% 90%;animation:flicker 1.8s ease-in-out infinite}

.stage.enter{animation:stagein .35s cubic-bezier(.2,.8,.2,1) backwards}
.stage.enter .opt,.stage.enter .chip,.stage.enter .line,.stage.enter .code{animation:rise .4s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(var(--i,0) * 55ms + 120ms)}
.opt.tap{animation:tap .25s ease-out}
.opt.pop,.blank.pop,.build.pop{animation:pop .5s cubic-bezier(.3,1.6,.5,1)}
.opt.shake,.blank.shake,.build.shake{animation:shake .45s}
.opt.reveal{animation:pop .5s .35s cubic-bezier(.3,1.6,.5,1) backwards}
.blank.set,.line.in{animation:setin .25s cubic-bezier(.3,1.6,.5,1)}
.hrt.hit{animation:hbreak .7s}

.bar.slide{animation:barin .45s cubic-bezier(.2,1.1,.3,1)}
.bar-in{position:relative}
.plus{position:absolute;right:2px;top:-40px;font:700 18px var(--display);color:var(--good-ink);pointer-events:none;animation:floatup 1.1s ease-out forwards}
.badge{animation:pop .5s .1s cubic-bezier(.3,1.6,.5,1) backwards}
.badge .ico path,.mark .ico path{stroke-dasharray:40;stroke-dashoffset:40;animation:draw .45s .2s ease-out forwards}

.result>*{animation:rise .55s cubic-bezier(.2,.8,.2,1) backwards}
.result>:nth-child(2){animation-delay:.15s}
.result>:nth-child(3){animation-delay:.22s}
.result>:nth-child(4){animation-delay:.32s}
.result>:nth-child(5){animation-delay:.45s}
.result>:nth-child(6){animation-delay:.55s}
.result>.mark{animation:markin .7s cubic-bezier(.3,1.6,.5,1) backwards}
.result>.mark.no{animation:markin .7s cubic-bezier(.3,1.6,.5,1) backwards,shake .5s .75s}
.confetti{position:fixed;inset:0;z-index:60;pointer-events:none;overflow:hidden}
.confetti i{position:absolute;top:-24px;border-radius:2px;animation:fall linear forwards}


/* ---------- study & review ---------- */
.review{margin-top:16px;background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:14px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.rv-ico{flex:none;width:44px;height:44px;border-radius:12px;background:color-mix(in srgb,var(--primary) 14%,var(--surface));color:var(--primary);display:grid;place-items:center;font-size:22px}
.rv-t{flex:1;min-width:150px}
.rv-t h2{margin:0;font-family:var(--display);font-weight:700;font-size:16px}
.rv-t p{margin:2px 0 0;color:var(--muted);font-size:13.5px;line-height:1.4}
.btn.sm{width:auto;padding:12px 18px;font-size:13px}
.review .btn.sm{flex:1 1 100%;background:transparent;color:var(--primary);border:2px solid var(--line);box-shadow:0 3px 0 var(--line)}
.dots{flex:1;display:flex;gap:6px}
.dot{flex:1;height:10px;border-radius:999px;background:var(--line);transition:background .3s}
.dot.on{background:var(--primary)}
.txt{margin:0;font-size:17px;line-height:1.65;max-width:62ch}
.txt code{font:500 .88em var(--mono);background:var(--code-bg);border:1px solid var(--line);border-radius:6px;padding:1px 6px;overflow-wrap:anywhere}
.console{background:var(--con-bg);color:var(--con-ink);border:1px solid var(--line);border-radius:14px;padding:12px 16px;display:grid;gap:6px}
.con-l{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;opacity:.6}
.console pre{margin:0;font:500 13.5px/1.6 var(--mono);white-space:pre-wrap;overflow-wrap:anywhere}
.btnrow{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:12px}
.stage.enter .txt{animation:rise .4s .1s cubic-bezier(.2,.8,.2,1) backwards}
.stage.enter .console{animation:rise .4s .4s cubic-bezier(.2,.8,.2,1) backwards}


/* ---------- mascot ---------- */
.mascot{display:block;overflow:visible}
.mascot .body{fill:#EC7A2C}
.mascot .muzzle{fill:#FFF4E6}
.mascot .etip{fill:#2B1A12}
.mascot .ttip{fill:none;stroke:#FFF4E6;stroke-width:6;stroke-linecap:round}
.mascot .rim{fill:#C45A17}
.mascot .coffee{fill:var(--con-bg)}
.mascot .saucer{fill:var(--line-edge)}
.mascot .tail{fill:none;stroke:#EC7A2C;stroke-width:7;stroke-linecap:round;transform-box:fill-box;transform-origin:0 100%}
.mascot .ear{fill:#EC7A2C;stroke:#EC7A2C;stroke-width:2;stroke-linejoin:round}
.mascot .earin{fill:#FFD9B3}
.mascot .nose{fill:#2B1A12}
.mascot .wh{fill:none;stroke:var(--muted);stroke-width:1.6;stroke-linecap:round;opacity:.8}
.m-idle .tail,.m-cheer .tail{animation:wag 2.2s ease-in-out infinite}
.m-sad .tail{transform:rotate(18deg)}
.m-sad .ttip{transform:rotate(0)}
@keyframes wag{0%,100%{transform:rotate(0)}50%{transform:rotate(-14deg)}}
.mascot .steam{fill:none;stroke:var(--muted);stroke-width:2.5;stroke-linecap:round;opacity:.7}
.mascot .eye{fill:#2B1A12}
.mascot .ln,.mascot .mo{fill:none;stroke:#2B1A12;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.mascot .open{fill:#2B1A12}
.mascot .blush{fill:var(--bad);opacity:.35}
.mascot .tear{fill:#6FB6FF;opacity:.95}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes steam{0%{opacity:0;transform:translateY(4px)}40%{opacity:.7}100%{opacity:0;transform:translateY(-6px)}}
@keyframes cheer{0%,100%{transform:translateY(0) rotate(0)}25%{transform:translateY(-8px) rotate(-4deg)}75%{transform:translateY(-8px) rotate(4deg)}}
@keyframes hop{40%{transform:translateY(-6px) scale(1.06)}}
@keyframes droop{40%{transform:rotate(-6deg) translateY(2px)}}
.m-idle .eye{transform-box:fill-box;transform-origin:center;animation:blink 4.2s infinite}
.m-idle .steam,.m-cheer .steam{animation:steam 2.4s ease-in-out infinite}
.m-idle .s2,.m-cheer .s2{animation-delay:1.1s}
.m-cheer{animation:cheer 1.2s ease-in-out infinite}
.m-happy{animation:hop .6s}
.m-sad{animation:droop .8s}
.hero{display:grid;place-items:center}
.result>.hero{animation:markin .7s cubic-bezier(.3,1.6,.5,1) backwards}
.fb .badge.m{background:none;width:auto;height:auto;border-radius:0;animation:none}

/* ---------- profile, goal, notes ---------- */
.me{margin-top:4px;background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:14px 16px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 14px;align-items:center}
.me-t h2{margin:0;font-family:var(--display);font-weight:700;font-size:17px;line-height:1.25}
.meter.slim{margin-top:8px;gap:10px}
.meter.slim .track{height:10px}
.goal{grid-column:1/-1;display:flex;align-items:center;gap:10px;font-size:13px;font-weight:600;color:var(--muted);margin-top:8px;font-variant-numeric:tabular-nums}
.goal .track{flex:1;height:10px}
.fill.g{background:var(--good)}
.goal.met .gv{color:var(--good)}
.note{margin:12px 0 0;padding:10px 14px;border-radius:12px;background:color-mix(in srgb,var(--warm) 14%,var(--surface));border:2px solid color-mix(in srgb,var(--warm) 45%,var(--line));font-size:14px;line-height:1.45}
.note.good{background:var(--good-bg);border-color:var(--good);color:var(--good-ink)}
.next{margin-top:12px}
.next .btn.ghost{margin-top:2px}
.hastabs{padding-bottom:calc(88px + env(safe-area-inset-bottom,0px))}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:8;background:var(--surface);border-top:2px solid var(--line);display:flex;justify-content:center;gap:4px;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
.tab{flex:1;max-width:180px;min-width:0;display:grid;justify-items:center;gap:2px;border:0;background:none;border-radius:12px;padding:6px 4px;color:var(--muted);font-size:11.5px;font-weight:700;cursor:pointer}
.tab .ico{font-size:22px}
.tab span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tab.on{color:var(--primary);background:color-mix(in srgb,var(--primary) 12%,var(--surface))}
.node.stale{box-shadow:0 6px 0 color-mix(in srgb,var(--uc) 70%,#000)}
.stale-b{position:absolute;right:-6px;top:-6px;width:28px;height:28px;border-radius:50%;background:var(--warm);color:#1B1200;display:grid;place-items:center;font-size:15px;border:3px solid var(--bg);font-style:normal}

/* ---------- achievements & settings ---------- */
.alist{display:grid;gap:12px;padding-top:6px}
.ach{display:flex;gap:14px;align-items:center;background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:12px 14px;opacity:.7}
.ach.on{opacity:1;border-color:color-mix(in srgb,var(--gold) 60%,var(--line))}
.ach-i{flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--line);color:var(--muted);font-size:22px}
.ach.on .ach-i{background:var(--gold);color:#241800}
.ach h3{margin:0;font-size:15px}
.ach p{margin:2px 0 0;font-size:13.5px;color:var(--muted)}
.view.enter .ach{animation:rise .4s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(var(--i) * 40ms)}
.sets{display:grid;gap:14px;padding-top:6px}
.card{background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:16px;display:grid;gap:12px;min-width:0}
.card h2{margin:0;font-family:var(--display);font-size:15px;font-weight:700}
.card .desc{margin:0;color:var(--muted);font-size:14px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px;background:var(--bg);padding:4px;border-radius:14px}
.segb{border:0;background:transparent;border-radius:11px;padding:10px 6px;font-weight:700;font-size:14px;color:var(--muted);cursor:pointer}
.segb.on{background:var(--surface);color:var(--primary);box-shadow:0 0 0 2px var(--line)}
.row{display:flex;align-items:center;justify-content:space-between;gap:14px}
.row-t{min-width:0}
.row h3{margin:0;font-size:15px}
.row p{margin:2px 0 0;font-size:13px;color:var(--muted)}
.sw{flex:none;width:52px;height:30px;border-radius:999px;border:2px solid var(--line);background:var(--line);position:relative;cursor:pointer;padding:0}
.sw span{position:absolute;top:2px;left:2px;width:22px;height:22px;border-radius:50%;background:var(--surface);transition:transform .2s}
.sw.on{background:var(--good);border-color:var(--good)}
.sw.on span{transform:translateX(22px)}
.area{width:100%;resize:vertical;border:2px solid var(--line);border-radius:12px;background:var(--code-bg);color:var(--code-ink);padding:10px 12px;font:400 13px/1.5 var(--body)}
.area.mono{font-family:var(--mono);font-size:12px;word-break:break-all}
.btn.bad{background:var(--bad);color:var(--on-bad);box-shadow:0 4px 0 var(--bad-edge)}
.toast{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:80;display:flex;gap:12px;align-items:center;background:var(--ink);color:var(--bg);padding:10px 18px 10px 12px;border-radius:16px;box-shadow:0 8px 24px rgba(0,0,0,.28);max-width:calc(100vw - 32px);animation:toastin .45s cubic-bezier(.2,1.2,.3,1)}
.toast.out{animation:toastout .4s forwards}
.t-ico{flex:none;width:32px;height:32px;border-radius:50%;background:var(--good);color:var(--on-good);display:grid;place-items:center;font-size:18px}
.toast.ach .t-ico{background:var(--gold);color:#241800}
.t-tx{display:grid;min-width:0}
.t-tx b{font-size:12.5px;opacity:.75;font-weight:600}
.t-tx span{font-size:15px;font-weight:700;overflow-wrap:anywhere}
@keyframes toastin{from{transform:translate(-50%,-150%)}}
@keyframes toastout{to{transform:translate(-50%,-150%);opacity:0}}

/* ---------- new exercise types ---------- */
.bugs{display:grid;gap:2px;background:var(--code-bg);border:1px solid var(--line);border-radius:14px;padding:6px}
.bugline{display:grid;grid-template-columns:28px minmax(0,1fr);gap:8px;align-items:center;text-align:left;border:2px solid transparent;border-radius:10px;background:transparent;padding:6px 8px;font:500 13px/1.5 var(--mono);color:var(--code-ink);cursor:pointer}
.bugline .ln{color:var(--com);text-align:right;font-size:12px}
.bugline .lc{white-space:pre;overflow-x:auto}
@media (hover:hover){.bugline:hover:not(:disabled){border-color:var(--line-edge)}}
.bugline.sel{border-color:var(--primary);background:color-mix(in srgb,var(--primary) 12%,transparent)}
.bugline.good{border-color:var(--good);background:var(--good-bg)}
.bugline.bad{border-color:var(--bad);background:var(--bad-bg)}
.bugline.gone,.opt.gone{opacity:.28;text-decoration:line-through;box-shadow:none}
.bugline.pop,.bugline.reveal{animation:pop .5s cubic-bezier(.3,1.6,.5,1)}
.bugline.shake{animation:shake .45s}
.stage.enter .bugline{animation:rise .35s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(var(--i,0) * 35ms + 120ms)}
.tslot{display:inline-block;min-width:5ch;padding:0 6px;border-bottom:2px solid var(--primary);background:color-mix(in srgb,var(--primary) 12%,transparent);border-radius:6px 6px 0 0;color:var(--code-ink);white-space:pre-wrap}
.tslot.good{border-color:var(--good);background:var(--good-bg);color:var(--good-ink)}
.tslot.bad{border-color:var(--bad);background:var(--bad-bg);color:var(--bad-ink)}
.field{width:100%;font:500 16px var(--mono);padding:14px 16px;border:2px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);box-shadow:0 3px 0 var(--line)}
.field:focus{outline:none;border-color:var(--primary);box-shadow:0 3px 0 var(--primary)}
.field.good{border-color:var(--good);background:var(--good-bg);color:var(--good-ink);box-shadow:0 3px 0 var(--good)}
.field.bad{border-color:var(--bad);background:var(--bad-bg);color:var(--bad-ink);box-shadow:0 3px 0 var(--bad)}
.field.pop{animation:pop .5s cubic-bezier(.3,1.6,.5,1)}
.field.shake{animation:shake .45s}
.btnrow.hint{grid-auto-flow:row;grid-template-columns:auto minmax(0,1fr)}
.hintbtn{display:flex;align-items:center;justify-content:center;gap:8px;padding-inline:16px;font-size:13px;white-space:nowrap}
.hintbtn .ico{font-size:18px}
.hintbtn em{font-style:normal;opacity:.65;font-size:11px;text-transform:none;letter-spacing:0}
.plus{opacity:0}
.tiles.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.notes{list-style:none;margin:0;padding:0;display:grid;gap:8px;width:100%;text-align:left}
.notes li{background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:10px 14px;font-size:14px;font-weight:600}

/* ---------- accessibility prefs ---------- */
:root[data-big="1"] .app{zoom:1.14}
:root[data-calm="1"] *,:root[data-calm="1"] *::before,:root[data-calm="1"] *::after{animation:none!important;transition:none!important}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .btn:active,.opt:active,.chip:active,.line:active,.node:active{transform:none}
}
.inp{width:100%;margin:10px 0 0;padding:12px 14px;border:2px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);font:inherit;font-size:16px}
.inp:focus{outline:none;border-color:var(--primary)}
.authmsg{margin:10px 0 0;color:var(--bad-ink)}
.gate{max-width:420px;margin:0 auto;padding:max(28px,env(safe-area-inset-top)) 20px 40px;display:flex;flex-direction:column;gap:6px;min-height:100vh;justify-content:center}
.gate h1{font-family:var(--display);font-size:26px;margin:0}
.gate-m{display:flex;justify-content:center;margin-bottom:8px}
.gate .desc{margin:4px 0 14px;color:var(--muted)}
</style><style>*,*::before,*::after{box-sizing:border-box}html{-webkit-text-size-adjust:100%}body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body)}</style>
</head>
<body>


<div class="app" id="app"></div>

<script>
(function(){
'use strict';

/* ================= Course content ================= */
const C=(q,opts,why,code,mono)=>({t:'mc',q,opts,why,code:code||null,mono:!!mono});
const O=(code,opts,why,q,stdin)=>({t:'out',q:q||'Що виведе цей код?',code,opts,why,mono:true,stdin:stdin||null});
const F=(q,code,ans,extra,why)=>({t:'fill',q,code,ans,extra,why});
const R=(q,lines,why)=>({t:'order',q,lines,why});
const T=(q,code,acc,why)=>({t:'type',q,code,acc,why});
const B=(q,lines,bad,why)=>({t:'bug',q:q||'У якому рядку помилка компіляції?',lines,bad,why});

const UNITS=[
{title:'Перші кроки',sub:'Структура програми та вивід тексту',lessons:[
 {title:'Привіт, світе',ex:[
  C('Який рядок виводить текст у консоль?',['System.out.println("Hi");','print("Hi");','console.log("Hi");','echo "Hi";'],'У Java вивід у консоль виконує System.out.println.',null,true),
  F('Встав пропущене слово, щоб програма вивела привітання.','public class Main {\n    public static void main(String[] args) {\n        System.out.[[0]]("Привіт!");\n    }\n}',['println'],['printn','echo','write'],'println виводить текст і переходить на новий рядок.'),
  R('Склади програму, яка виводить Hello.',['public class Main {','    public static void main(String[] args) {','        System.out.println("Hello");','    }','}'],'Клас містить метод main, а main містить інструкцію виводу. Кожен блок закривається своєю дужкою }.'),
  O('System.out.println("Java");\nSystem.out.println("rocks");',['Java\nrocks','Javarocks','Java rocks','Помилка компіляції'],'println після виводу переходить на новий рядок, тому слова опиняються в різних рядках.'),
  C('З якого методу починається виконання програми?',['main','start','run','init'],'Java завжди запускає метод main. Це точка входу в програму.',null,true),
  C('Чим закінчується більшість інструкцій у Java?',['Крапкою з комою ;','Крапкою .','Двокрапкою :','Нічим, достатньо нового рядка'],'Кожна інструкція завершується символом ;. Без нього компілятор видасть помилку.')
 ]},
 {title:'Вивід і коментарі',ex:[
  O('System.out.print("A");\nSystem.out.print("B");\nSystem.out.println("C");',['ABC','A\nB\nC','A B C','CBA'],'print не переходить на новий рядок, тому літери виводяться поруч.'),
  C('Який запис є коментарем в один рядок?',['// це коментар','# це коментар','-- це коментар','<!-- це коментар -->'],'Коментар у Java починається з //. Компілятор його ігнорує.',null,true),
  O('System.out.println("2 + 3");',['2 + 3','5','23','Помилка компіляції'],'Усе в лапках є текстом, тому Java виводить його як є, без обчислення.'),
  F('Текст у Java береться у подвійні лапки. Заповни пропуски.','System.out.println([[0]]Java[[1]]);',['"','"'],["'",'(','/'],'Рядки (String) пишуться у подвійних лапках: "Java".'),
  C('Що станеться, якщо забути закрити лапку в рядку?',['Помилка компіляції','Програма виведе порожній рядок','Java сама додасть лапку','Програма запуститься, але зламається пізніше'],'Це синтаксична помилка. Компілятор помітить її ще до запуску і не збере програму.'),
  R('Склади код: спочатку коментар, потім слово Привіт, потім Java.',['// Привітання','System.out.println("Привіт");','System.out.println("Java");'],'Рядки виконуються зверху вниз, а коментар ніяк не впливає на результат.')
 ]}
]},
{title:'Змінні й типи',sub:'Де Java зберігає числа, текст і логіку',lessons:[
 {title:'Змінні',ex:[
  C('Який рядок оголошує змінну для цілого числа?',['int age = 25;','String age = 25;','age int = 25;','integer age = 25;'],'Спочатку пишемо тип (int), потім ім\'я, потім значення.',null,true),
  F('Вкажи тип для текстової змінної.','[[0]] name = "Оля";',['String'],['string','int','char'],'Текст зберігається в типі String. Він пишеться з великої літери, бо Java чутлива до регістру.'),
  O('int a = 5;\nint b = 7;\nSystem.out.println(a + b);',['12','57','a + b','35'],'Змінні a і b є числами, тому + додає їх.'),
  C('Який тип зберігає значення true або false?',['boolean','int','String','char'],'boolean має лише два значення: true і false.',null,true),
  R('Збери код, який збільшує x на 5 і виводить результат.',['int x = 10;','x = x + 5;','System.out.println(x);'],'Спочатку змінну оголошують, потім змінюють, потім виводять нове значення: 15.'),
  C('Яке ім\'я змінної допустиме в Java?',['myAge','2age','my-age','class'],'Ім\'я не може починатися з цифри, містити дефіс чи збігатися зі службовим словом (як class).',null,true),
  O('String s = "Java";\nSystem.out.println(s + 8);',['Java8','Java 8','8Java','Помилка компіляції'],'Якщо один з операндів + є рядком, Java склеює їх у текст: "Java8".')
 ]},
 {title:'Типи даних',ex:[
  C('Який тип найкраще підходить для числа 3.14?',['double','int','char','boolean'],'double зберігає дробові числа, а int лише цілі.',null,true),
  O('int x = 7 / 2;\nSystem.out.println(x);',['3','3.5','4','2'],'Ділення двох цілих чисел дає ціле: дробова частина відкидається.'),
  O('double d = 7 / 2.0;\nSystem.out.println(d);',['3.5','3','4.0','3.0'],'Один з операндів дробовий, тому ділення дробове: 3.5.'),
  F('Символ зберігається в типі…','[[0]] letter = \'A\';',['char'],['String','int','boolean'],'char містить один символ в одинарних лапках. String містить текст у подвійних.'),
  C('Який запис правильний?',['char c = \'A\';','char c = "A";','String s = \'A\';','int n = "5";'],'Символ беруть в одинарні лапки, рядок у подвійні. Типи й лапки мають збігатися.',null,true),
  F('Щоб значення змінної не можна було змінити, додай слово…','[[0]] double PI = 3.14;',['final'],['const','static','lock'],'final робить змінну константою. Слова const для цього в Java немає.'),
  O('int n = (int) 9.99;\nSystem.out.println(n);',['9','10','9.99','Помилка компіляції'],'Приведення (int) відкидає дробову частину, а не округлює.')
 ]}
]},
{title:'Оператори',sub:'Арифметика, порівняння й логіка',lessons:[
 {title:'Арифметика',ex:[
  O('System.out.println(10 % 3);',['1','3','0','3.33'],'Оператор % повертає залишок від ділення: 10 = 3·3 + 1.'),
  O('int i = 5;\ni++;\nSystem.out.println(i);',['6','5','7','Помилка компіляції'],'i++ збільшує змінну на 1.'),
  O('System.out.println(2 + 3 * 4);',['14','20','24','9'],'Множення виконується раніше за додавання: 2 + 12.'),
  F('Додай 5 до x коротким записом.','int x = 10;\nx [[0]] 5; // тепер x дорівнює 15',['+='],['=+','++','=='],'x += 5 є скороченням від x = x + 5.'),
  C('Що робить оператор % ?',['Повертає залишок від ділення','Обчислює відсотки','Ділить числа націло','Підносить до степеня'],'Це залишок від ділення: 7 % 2 дорівнює 1. Зручно перевіряти парність числа.'),
  O('System.out.println(1 + 2 + "3");',['33','6','123','Помилка компіляції'],'Спочатку 1 + 2 = 3, а потім число склеюється з рядком "3": виходить "33".'),
  O('System.out.println("1" + 2 + 3);',['123','15','6','Помилка компіляції'],'Вираз читається зліва направо: "1" + 2 дає рядок "12", далі додається 3.')
 ]},
 {title:'Порівняння і логіка',ex:[

{title:'Винятки',sub:'Що робити, коли щось пішло не так',lessons:[
 {title:'try і catch',ex:[
  C("Що таке виняток (exception)?",['Помилка, яка виникає під час виконання програми','Помилка в написанні слова, яку знаходить компілятор','Різновид коментаря','Спеціальний цикл'],'Виняток виникає, коли програма вже працює, наприклад при діленні на нуль. Без обробки програма зупиняється.'),
  O('try {\n    System.out.println(10 / 2);\n} catch (ArithmeticException e) {\n    System.out.println("Помилка");\n}',['5','Помилка','2','Помилка компіляції'],'Помилки немає, тому виконується лише try. 10 / 2 = 5.'),
  O('try {\n    System.out.println("Старт");\n    System.out.println(10 / 0);\n    System.out.println("Кінець");\n} catch (ArithmeticException e) {\n    System.out.println("Помилка");\n}',['Старт\nПомилка','Старт\nКінець','Помилка','Старт\nПомилка\nКінець'],'Після винятку решта try пропускається. Виводиться «Старт», і одразу спрацьовує catch.'),
  F("Встав слово, щоб перехопити виняток.",'try {\n    int x = 5 / 0;\n} [[0]] (ArithmeticException e) {\n    System.out.println("Ой");\n}',['catch'],['except','handle','error'],'Блок catch ловить виняток зазначеного типу.'),
  C("Що робить блок finally?",['Виконується завжди: і з помилкою, і без неї','Виконується лише при помилці','Виконується лише без помилок','Завершує програму'],'У finally зазвичай роблять прибирання, яке потрібне за будь-яких обставин.'),
  O('try {\n    System.out.println("A");\n} catch (Exception e) {\n    System.out.println("B");\n} finally {\n    System.out.println("C");\n}',['A\nC','A\nB\nC','A','A\nB'],'Помилки не було, тож catch пропущено, а finally виконався.'),
  R("Збери обробку помилки.",['try {','    int x = 10 / 0;','} catch (ArithmeticException e) {','    System.out.println("Помилка");','}'],'Спочатку try з небезпечним кодом, потім catch з обробкою.'),
  C("Який виняток виникне при зверненні до a[5] у масиві з 3 елементів?",['ArrayIndexOutOfBoundsException','ArithmeticException','NullPointerException','NumberFormatException'],'Індекс виходить за межі масиву, тому й виняток із такою назвою.',null,true)
 ]},
 {title:'throw і перевірка',ex:[
  C("Яке слово викликає виняток вручну?",['throw','throws','raise','error'],'throw кидає виняток. Слово throws стоїть в оголошенні методу й лише попереджає про можливий виняток.',null,true),
  O('try {\n    int n = Integer.parseInt("abc");\n    System.out.println(n);\n} catch (NumberFormatException e) {\n    System.out.println("Не число");\n}',['Не число','abc','0','Помилка компіляції'],'"abc" не можна перетворити на число, тому parseInt кидає NumberFormatException.'),
  O('try {\n    int n = Integer.parseInt("42");\n    System.out.println(n + 1);\n} catch (NumberFormatException e) {\n    System.out.println("Не число");\n}',['43','Не число','421','42'],'"42" успішно стає числом 42, і ми додаємо 1.'),
  F("Створи виняток.",'throw [[0]] IllegalArgumentException("Помилка");',['new'],['create','make','throw'],'Виняток це об\'єкт, тому його створюють через new.'),
  O('try {\n    String s = null;\n    System.out.println(s.length());\n} catch (NullPointerException e) {\n    System.out.println("A");\n} catch (Exception e) {\n    System.out.println("B");\n}',['A','B','A\nB','Помилка компіляції'],'Звернення до null дає NullPointerException. Спрацьовує перший підходящий catch.'),
  C("Що повертає метод getMessage() винятку?",['Текст повідомлення про помилку','Назву файлу','Номер рядка','Нічого'],'У повідомленні зазвичай пояснено, що пішло не так.'),
  R("Збери метод, що кидає виняток для від'ємного віку.",['static void setAge(int age) {','    if (age < 0) {','        throw new IllegalArgumentException("Вік має бути додатним");','    }','}'],'Перевіряємо умову й кидаємо виняток через throw new.'),
  C("Який catch слід ставити останнім?",['catch (Exception e), найзагальніший','catch (NullPointerException e)','catch (ArithmeticException e)','Порядок не важливий'],'Спочатку йдуть конкретні винятки, потім загальний Exception. Інакше код не скомпілюється.')
 ]}
]}
,

{title:'Успадкування та інтерфейси',sub:'Спільна поведінка різних класів',lessons:[
 {title:'extends і super',ex:[
  C('Яке слово означає успадкування класу?',['extends','implements','inherits','from'],'class Dog extends Animal означає, що Dog успадковує Animal.',null,true),
  O('class A {\n    void hi() {\n        System.out.println("A");\n    }\n}\n\nclass B extends A {\n}\n\n// у main:\nnew B().hi();',['A','B','Нічого не виведе','Помилка компіляції'],'B успадкував метод hi від A, тому метод працює.'),
  O('class A {\n    void hi() {\n        System.out.println("A");\n    }\n}\n\nclass B extends A {\n    @Override\n    void hi() {\n        System.out.println("B");\n    }\n}\n\n// у main:\nA x = new B();\nx.hi();',['B','A','AB','Помилка компіляції'],'Об\'єкт створено як B, тому виконується перевизначений метод B.'),
  F('Виклич конструктор батьківського класу.','class Dog extends Animal {\n    Dog(String name) {\n        [[0]](name);\n    }\n}',['super'],['this','parent','base'],'super(...) передає значення в конструктор батьківського класу.'),
  C('Що робить @Override?',['Показує, що метод перевизначає метод батька','Робить метод приватним','Видаляє метод','Запускає метод двічі'],'Анотація допомагає компілятору перевірити, що такий метод справді є в батьківському класі.'),
  O('class A {\n    String who() {\n        return "A";\n    }\n}\n\nclass B extends A {\n    String who() {\n        return super.who() + "B";\n    }\n}\n\n// у main:\nSystem.out.println(new B().who());',['AB','B','A','BA'],'super.who() повертає "A", далі додається "B".'),
  R('Збери оголошення класу Dog, що успадковує Animal.',['class Dog extends Animal {','    void bark() {','        System.out.println("Гав");','    }','}'],'Після імені класу йде extends і ім\'я батьківського класу.'),
  T('Допиши оголошення класу Cat, який успадковує Animal.','[[0]] {\n    void meow() {\n    }\n}',['class Cat extends Animal'],'Спочатку слово class, потім ім\'я, потім extends і батьківський клас.')
 ]},
 {title:'Інтерфейси і поліморфізм',ex:[
  C('Яке слово використовує клас, щоб реалізувати інтерфейс?',['implements','extends','uses','interface'],'Клас реалізує інтерфейс словом implements.',null,true),
  O('interface Shape {\n    int area();\n}\n\nclass Square implements Shape {\n    int s;\n    Square(int s) {\n        this.s = s;\n    }\n    public int area() {\n        return s * s;\n    }\n}\n\n// у main:\nShape sh = new Square(4);\nSystem.out.println(sh.area());',['16','8','4','Помилка компіляції'],'Square(4) має сторону 4, тому area() повертає 4 * 4 = 16.'),
  C('Що має зробити клас, який реалізує інтерфейс?',['Описати всі методи інтерфейсу','Скопіювати поля інтерфейсу','Видалити інтерфейс','Створити об\'єкт інтерфейсу'],'Компілятор вимагає реалізувати кожен метод інтерфейсу.'),
  C('Що таке поліморфізм?',['Один виклик методу працює по-різному залежно від типу об\'єкта','Заборона створювати об\'єкти','Копіювання класу','Приховування полів'],'Наприклад, area() для Square і Rect рахується по-різному.'),
  F('Допиши слово, щоб клас реалізував інтерфейс Shape.','class Circle [[0]] Shape {\n    public int area() {\n        return 3;\n    }\n}',['implements'],['extends','inherits','uses'],'Інтерфейси підключають через implements, а класи успадковують через extends.'),
  C('Що не можна зробити з abstract класом?',['Створити об\'єкт через new','Успадкувати його','Додати в нього поле','Оголосити в ньому метод'],'Абстрактний клас це лише основа, об\'єкт створюють із дочірнього класу.'),
  O('abstract class Animal {\n    abstract void sound();\n}\n\nclass Cat extends Animal {\n    void sound() {\n        System.out.println("Няв");\n    }\n}\n\n// у main:\nAnimal a = new Cat();\na.sound();',['Няв','Нічого не виведе','Помилка компіляції','null'],'Змінна типу Animal тримає об\'єкт Cat, тому виконується метод Cat.'),
  B('У якому рядку помилка компіляції?',['interface Shape {','    int area();','}','class Sq implements Shape {','    int area() {','        return 1;','    }','}'],4,'Методи інтерфейсу публічні, тому в класі метод має бути public. Без цього компілятор скаржиться.')
 ]}
]},
{title:'Потоки Stream',sub:'Обробка списків в одному ланцюжку',lessons:[
 {title:'filter, map і підсумки',ex:[
  O('List<Integer> a = List.of(1, 2, 3, 4);\na.stream()\n    .filter(n -> n > 2)\n    .forEach(n -> System.out.println(n));',['3\n4','1\n2','2\n3\n4','4'],'filter залишає елементи більші за 2: це 3 і 4.'),

  O('List<Integer> a = List.of(4, 5, 6);\nSystem.out.println(a.stream().mapToInt(n -> n).sum());',['15','456','6','3'],'sum додає всі числа: 4 + 5 + 6 = 15.'),

  F('Перетвори кожен елемент потоку.','nums.stream()\n    .[[0]](n -> n + 1)\n    .forEach(n -> System.out.println(n));',['map'],['filter','sort','change'],'map застосовує функцію до кожного елемента.'),
  T('Допиши лямбду, яка залишає лише числа більші за 10.','nums.stream()\n    .filter([[0]])\n    .forEach(n -> System.out.println(n));',['n -> n > 10'],'Лямбда приймає n і повертає true, якщо n більше за 10.')

]},

{title:'Міні-проєкти',sub:'Збираємо все вивчене разом',lessons:[

const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const KW='public|private|protected|static|void|class|int|double|float|long|boolean|char|String|final|if|else|switch|case|default|break|continue|for|while|do|return|new|true|false|null|import|package|this';
const RX=new RegExp('(\\/\\/[^\\n]*)|("(?:\\\\.|[^"\\\\\\n])*")|(\'(?:\\\\.|[^\'\\\\\\n])\')|\\b('+KW+')\\b|\\b(\\d+(?:\\.\\d+)?)\\b|\\b([A-Z][A-Za-z0-9_]*)\\b','g');
function hl(src){
  let out='',last=0,m;RX.lastIndex=0;
  while((m=RX.exec(src))){
    out+=esc(src.slice(last,m.index));
    const t=m[1]?'com':(m[2]||m[3])?'str':m[4]?'kw':m[5]?'num':'ty';
    out+='<span class="t-'+t+'">'+esc(m[0])+'</span>';
    last=m.index+m[0].length;
  }
  return out+esc(src.slice(last));
}
function shuffle(a,avoidSame){
  const orig=a.slice();let r;let tries=0;
  do{r=orig.slice();for(let i=r.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[r[i],r[j]]=[r[j],r[i]];}tries++;}
  while(avoidSame&&r.length>1&&tries<12&&r.every((x,i)=>x===orig[i]));
  return r;
}

function norm(s){
  const r=Object.assign(fresh(),s);

  r.ach=s.ach||{};r.miss=s.miss||{};r.done=s.done||{};

function shownStreak(){

}
function bumpStreak(){
  const r={froze:false,earned:false};
  if(S.last===today())return r;
  if(S.last===dAgo(1))S.streak++;
  else if(S.last===dAgo(2)&&S.freeze>0){S.freeze--;S.streak++;r.froze=true;}
  else S.streak=1;
  S.last=today();
  if(S.streak%7===0&&S.freeze<2){S.freeze++;r.earned=true;}
  return r;
}

function snd(k){
  if(!S.sound||!SEQ[k])return;
  try{
    actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    if(actx.state==='suspended')actx.resume();
    const t0=actx.currentTime;
    SEQ[k].forEach(n=>{
      const o=actx.createOscillator(),g=actx.createGain();
      o.type=k==='bad'?'triangle':'sine';o.frequency.value=n[0];
      g.gain.setValueAtTime(0.0001,t0+n[1]);
      g.gain.exponentialRampToValueAtTime(0.12,t0+n[1]+0.015);
      g.gain.exponentialRampToValueAtTime(0.0001,t0+n[1]+n[2]);
      o.connect(g);g.connect(actx.destination);
      o.start(t0+n[1]);o.stop(t0+n[1]+n[2]+0.03);
    });
  }catch(e){}
}

  if(toastBusy||!toasts.length)return;
  toastBusy=true;
  const t=toasts.shift(),el=document.createElement('div');
  el.className='toast'+(t.kind==='ach'?' ach':'');
  el.setAttribute('role','status');
  el.innerHTML='<div class="t-ico">'+(t.kind==='ach'?IC.star:IC.check)+'</div><div class="t-tx"><b>'+esc(t.title)+'</b><span>'+esc(t.msg)+'</span></div>';
  document.body.appendChild(el);
  setTimeout(()=>{el.classList.add('out');},3200);
  setTimeout(()=>{if(el.parentNode)el.parentNode.removeChild(el);toastBusy=false;pumpToast();},3700);
}

function resetShown(){shownXp=S.xp;shownStreakVal=shownStreak();Object.keys(barsMem).forEach(k=>delete barsMem[k]);}

/* ================= Rendering ================= */
const OFF=[0,9,14,9,0,-9,-14,-9];
const HOW={
  mc:"Вибери правильну відповідь.",
  out:"Подумай, що з'явиться на екрані, і вибери відповідь.",
  fill:"Торкнись слова внизу, щоб вставити його в пропуск.",
  order:"Торкайся рядків внизу по черзі, щоб скласти код зверху вниз.",
  bug:"Торкнись рядка, у якому є помилка.",
  type:"Впиши пропущений код."
};

function topbar(){
  const s=shownStreak(),bump=s>shownStreakVal;
  const cnt=S.xp!==shownXp?' data-count="'+S.xp+'" data-from="'+shownXp+'"':'';
  return '<header class="top"><div class="brand">Java <span>Бариста</span></div><div class="stats">'
   +'<div class="stat streak'+(s?'':' off')+(bump?' bump':'')+'" aria-label="Серія днів: '+s+'">'+IC.flame+'<span>'+s+'</span></div>'
   +'<div class="stat xp'+(cnt?' bump':'')+'" aria-label="Досвід: '+S.xp+'">'+IC.bolt+'<span'+cnt+'>'+S.xp+'</span></div></div></header>';
}
function tabs(cur){
  const t=[['home','Курс',IC.layers],['ach','Досягнення',IC.trophy],['set','Налаштування',IC.sliders]];
  return '<nav class="tabs" aria-label="Розділи">'+t.map(x=>'<button class="tab'+(x[0]===cur?' on':'')+'" data-act="tab" data-tab="'+x[0]+'"'+(x[0]===cur?' aria-current="page"':'')+'>'+x[2]+'<span>'+x[1]+'</span></button>').join('')+'</nav>';
}
function reviewPool(){
  const pool=[];
  ALL.forEach(l=>{const d=S.done[l.uid];if(d&&!d.skip)l.lesson.ex.forEach(e=>pool.push(e));});
  return pool;
}
function reviewMissCount(){return reviewPool().filter(e=>S.miss[e.id]>0).length;}
const STALE=3*864e5;
function isStale(d){return !!d&&!d.skip&&(Date.now()-(d.t||0))>STALE;}
function staleCount(){return ALL.filter(l=>isStale(S.done[l.uid])).length;}

function homeView(){
  const doneN=ALL.filter(l=>S.done[l.uid]).length;
  const cur=ALL.find(l=>!S.done[l.uid]);
  const pct=doneN/ALL.length*100;
  const li=lvlInfo(S.xp);
  const dxp=S.day.d===today()?S.day.xp:0,gpct=Math.min(100,dxp/S.goal*100);
  let h='<div class="view hastabs'+(fx.view?' enter':'')+'">'+topbar();
  h+='<section class="me"><div class="me-m">'+mascot('idle',64)+'</div><div class="me-t"><p class="kicker">Рівень '+li.n+'</p><h2>'+esc(li.title)+'</h2>'
    +'<div class="meter slim"><div class="track" role="progressbar" aria-label="Прогрес до наступного рівня" aria-valuemin="0" aria-valuemax="100" aria-valuenow="'+Math.round(li.pct)+'"><div class="fill" style="width:'+barFrom('lvl',li.pct)+'%" data-to="'+li.pct+'"></div></div><span>'+(li.hi?S.xp+' / '+li.hi:'максимум')+'</span></div></div>'
    +'<div class="goal'+(dxp>=S.goal?' met':'')+'"><span class="gl">Ціль дня</span><div class="track" role="progressbar" aria-label="Ціль дня" aria-valuemin="0" aria-valuemax="'+S.goal+'" aria-valuenow="'+Math.min(dxp,S.goal)+'"><div class="fill g" style="width:'+barFrom('goal',gpct)+'%" data-to="'+gpct+'"></div></div><span class="gv">'+Math.min(dxp,S.goal)+' / '+S.goal+' XP</span></div></section>';
  if(S.streak>0&&S.last!==today()){
    if(S.last===dAgo(1))h+='<p class="note">Серія '+S.streak+' дн. Пройди урок сьогодні, щоб не втратити її.</p>';
    else if(S.last===dAgo(2)&&S.freeze>0)h+='<p class="note">Ти пропустив день. Заморожування збереже серію, якщо пройдеш урок сьогодні.</p>';
  }
  if(isWeekend())h+='<p class="note good">Вихідні: за кожен урок подвійний досвід.</p>';
  h+='<section class="next">';
  if(cur){
    h+='<p class="kicker">'+(doneN?'Продовжуй':'Починаємо')+'</p><h1>'+esc(cur.lesson.title)+'</h1><p class="sub">Розділ '+(cur.ui+1)+': '+esc(cur.unit.title)+'</p>';
    if(!doneN)h+='<p class="sub">Короткі уроки із завданнями. Спочатку теорія, потім тренування. Кожна помилка коштує одне життя.</p>';
  }else{
    h+='<p class="kicker">Курс пройдено</p><h1>Ти закрив усі уроки</h1><p class="sub">Повертайся до будь-якого уроку, щоб повторити матеріал і підтримати серію.</p>';
  }
  h+='<div class="meter"><div class="track" role="progressbar" aria-label="Прогрес курсу" aria-valuemin="0" aria-valuemax="'+ALL.length+'" aria-valuenow="'+doneN+'"><div class="fill" style="width:'+barFrom('home',pct)+'%" data-to="'+pct+'"></div></div><span>'+doneN+' / '+ALL.length+'</span></div>';
  if(cur)h+='<button class="btn" data-act="start" data-uid="'+cur.uid+'">'+(doneN?'Продовжити':'Почати')+'</button>';
  if(!doneN&&!S.stats.placement)h+='<button class="btn ghost" data-act="placement">Я вже знаю основи: пройти тест рівня</button>';
  h+='</section>';
  if(doneN-ALL.filter(l=>S.done[l.uid]&&S.done[l.uid].skip).length>0){
    const mc=reviewMissCount(),sc=staleCount();
    h+='<section class="review"><div class="rv-ico">'+IC.refresh+'</div><div class="rv-t"><h2>Повторення</h2><p>'
      +(mc?'Є завдання, де ти помилявся: '+mc+'. Повтори їх.':sc?'Давно не повторював уроків: '+sc+'. Освіжи їх.':'Закріпи пройдене змішаними завданнями.')
      +'</p></div><button class="btn sm" data-act="start" data-uid="review">Повторити</button></section>';
  }
  UNITS.forEach((u,ui)=>{
    h+='<section style="--uc:var(--u'+((ui%6)+1)+')"><div class="unit"><p class="kicker">Розділ '+(ui+1)+'</p><h2>'+esc(u.title)+'</h2><p>'+esc(u.sub)+'</p></div><div class="path">';
    ALL.filter(l=>l.ui===ui).forEach(l=>{
      const d=S.done[l.uid],un=isUnlocked(l.n),isCur=cur&&cur.uid===l.uid,st=isStale(d);
      h+='<div class="nodewrap'+(fx.view?' enter':'')+'" style="--k:'+OFF[l.n%8]+';--d:'+(Math.min(l.n,14)*45)+'ms">';
      if(isCur)h+='<span class="bubble">Почати</span>';
      h+='<button class="node'+(isCur?' current':'')+(st?' stale':'')+'" '+(un?'':'disabled ')+'data-act="start" data-uid="'+l.uid+'" aria-label="'+esc(l.lesson.title)+(d?(d.skip?', пропущено':', пройдено'):un?'':', закрито')+'">'+(d?IC.check:un?IC.play:IC.lock)+(st?'<i class="stale-b">'+IC.refresh+'</i>':'')+'</button>';
      h+='<span class="nlabel">'+esc(l.lesson.title)+(d?(d.skip?'<small>Пропущено після тесту</small>':'<small>'+(st?'Пора повторити':'Точність '+d.a+'%')+'</small>'):'')+'</span></div>';
    });
    h+='</div></section>';
  });
  h+='</div>'+tabs('home');
  return h;
}

function achView(){
  const got=ACH.filter(a=>S.ach[a.id]).length;
  let h='<div class="view hastabs'+(fx.view?' enter':'')+'"><header class="top"><div class="brand">Досягнення</div><div class="stats"><div class="stat">'+IC.trophy+'<span>'+got+' / '+ACH.length+'</span></div></div></header><div class="alist">';
  ACH.forEach((a,i)=>{
    const on=!!S.ach[a.id];
    h+='<div class="ach'+(on?' on':'')+'" style="--i:'+i+'"><div class="ach-i">'+(on?IC.star:IC.lock)+'</div><div class="ach-t"><h3>'+esc(a.t)+'</h3><p>'+esc(a.d)+'</p></div></div>';
  });
  return h+'</div></div>'+tabs('ach');
}

function seg(act,opts,cur){
  return '<div class="seg" role="group">'+opts.map(o=>{const on=String(o.v)===String(cur);return '<button class="segb'+(on?' on':'')+'" data-act="'+act+'" data-v="'+o.v+'" aria-pressed="'+on+'">'+esc(o.t)+'</button>';}).join('')+'</div>';
}
function tog(k,label,desc){
  return '<div class="row"><div class="row-t"><h3>'+esc(label)+'</h3><p>'+esc(desc)+'</p></div><button class="sw'+(S[k]?' on':'')+'" role="switch" aria-checked="'+(!!S[k])+'" aria-label="'+esc(label)+'" data-act="tog" data-k="'+k+'"><span></span></button></div>';
}
function shareText(){
  const li=lvlInfo(S.xp);
  return 'Java Бариста: рівень '+li.n+' («'+li.title+'»), серія '+shownStreak()+' дн., пройдено '+doneReal()+' з '+ALL.length+' уроків. https://mariiaosadchaa.github.io/EspressoCode/';
}
function backupCode(){try{return btoa(unescape(encodeURIComponent(JSON.stringify(S))));}catch(e){return '';}}
function setView(){
  let h='<div class="view hastabs'+(fx.view?' enter':'')+'"><header class="top"><div class="brand">Налаштування</div></header><div class="sets">';
  h+=accountCard();
  h+='<section class="card"><h2>Складність</h2>'+seg('setlevel',[{v:'easy',t:'Легкий'},{v:'normal',t:'Звичайний'},{v:'hard',t:'Складний'}],S.level)+'<p class="desc">'+esc(LEVELS[S.level].desc)+'</p></section>';
  h+='<section class="card"><h2>Ціль на день</h2>'+seg('setgoal',[{v:20,t:'20 XP'},{v:30,t:'30 XP'},{v:50,t:'50 XP'}],S.goal)+'</section>';
  h+='<section class="card">'+tog('sound','Звуки','Короткі сигнали правильної й неправильної відповіді.')+tog('big','Великий шрифт','Збільшує весь інтерфейс.')+tog('calm','Спокійний режим','Вимикає анімації.')+'</section>';
  h+='<section class="card"><h2>Поділитись результатом</h2><textarea id="sharebox" class="area" rows="3" readonly>'+esc(shareText())+'</textarea><button class="btn ghost" data-act="copy" data-src="sharebox">Скопіювати</button></section>';
  h+='<section class="card"><h2>Резервний код прогресу</h2><p class="desc">Збережи код, щоб перенести прогрес на інший пристрій чи браузер.</p><textarea id="bkp" class="area mono" rows="3" readonly>'+esc(backupCode())+'</textarea><button class="btn ghost" data-act="copy" data-src="bkp">Скопіювати код</button>'
    +'<textarea id="imp" class="area mono" rows="3" placeholder="Встав сюди код, щоб відновити прогрес"></textarea><button class="btn ghost" data-act="import">Відновити з коду</button></section>';
  h+='<section class="card"><h2>Прогрес</h2>';
  h+=confirmReset
    ?'<p class="desc">Усе буде видалено: уроки, досвід, серія й досягнення.</p><div class="btnrow"><button class="btn ghost" data-act="reset-no">Скасувати</button><button class="btn bad" data-act="reset-yes">Видалити</button></div>'
    :'<button class="btn ghost" data-act="reset">Скинути прогрес</button>';
  h+='</section></div></div>'+tabs('set');
  return h;

function codeBlock(code){return '<pre class="code"><code>'+hl(code)+'</code></pre>';}
function fmt(s){return esc(s).replace(/`([^`]+)`/g,'<code>$1</code>');}
function fillCode(ex,c){
  const parts=ex.code.split(/\[\[(\d)\]\]/);let h='';
  parts.forEach((p,i)=>{
    if(i%2===0){h+=hl(p);}
    else{
      const k=+p,id=c.slots[k],w=id==null?null:c.words.find(x=>x.id===id).w;
      let cls='blank';
      if(c.checked&&w!=null){
        const ok=w===ex.ans[k];
        cls+=ok?' good':' bad';
        if(fx.res)cls+=ok?' pop':' shake';
      }else if(fx.slot===k)cls+=' set';
      h+='<button class="'+cls+'" data-act="unslot" data-i="'+k+'"'+(c.checked?' disabled':'')+' aria-label="Пропуск '+(k+1)+'">'+(w==null?'&nbsp;':esc(w))+'</button>';
    }
  });
  return '<pre class="code"><code>'+h+'</code></pre>';
}
function typeCode(ex,c){
  const parts=ex.code.split('[[0]]');
  const cls='tslot'+(c.checked?(c.ok?' good':' bad'):'');
  const val=c.val?esc(c.val):'&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;';
  return '<pre class="code"><code>'+hl(parts[0])+'<span class="'+cls+'" id="tslot">'+val+'</span>'+hl(parts[1]||'')+'</code></pre>';
}
function ready(c){
  const ex=c.ex;
  if(ex.t==='mc'||ex.t==='out'||ex.t==='bug')return c.sel!=null;
  if(ex.t==='fill')return c.slots.every(x=>x!=null);
  if(ex.t==='type')return c.val.trim().length>0;
  return c.bank.length===0;
}
function heartsHtml(){
  let s='';
  for(let i=0;i<L.max;i++)s+='<span class="hrt'+(i>=L.hearts?' lost':'')+(fx.hit===i?' hit':'')+'">'+IC.heart+'</span>';
  return '<div class="lives" role="img" aria-label="Життя: '+L.hearts+' з '+L.max+'">'+s+'</div>';
}
function canHint(c){
  if(L.placement||S.level==='hard')return null;
  const single=['mc','out','bug','type'].includes(c.ex.t);
  return single?c.hints<1:true;
}

function studyView(){
  const cards=L.info.lesson.learn,k=cards[L.si],last=L.si===cards.length-1;
  let dots='';
  cards.forEach((_,i)=>{dots+='<span class="dot'+(i<=L.si?' on':'')+'"></span>';});
  let h='<div class="view'+(fx.view?' enter':'')+'"><div class="lesson"><div class="lhead"><button class="x" data-act="leave" aria-label="'+(L.peek?'Закрити теорію':'Вийти з уроку')+'">'+IC.cross+'</button><div class="dots" role="img" aria-label="Картка '+(L.si+1)+' з '+cards.length+'">'+dots+'</div></div>'
    +'<div class="stage'+(fx.stage?' enter':'')+'"><p class="kicker">Вивчаємо · '+(L.si+1)+' / '+cards.length+'</p><h2 class="q">'+esc(k.h)+'</h2><p class="txt">'+fmt(k.p)+'</p>';
  if(k.code)h+=codeBlock(k.code);
  if(k.out!=null)h+='<div class="console"><span class="con-l">Результат</span><pre>'+esc(k.out)+'</pre></div>';
  h+='</div></div></div>';
  h+='<div class="bar"><div class="bar-in"><div class="btnrow">'+(L.si>0?'<button class="btn ghost" data-act="sback">Назад</button>':'')
    +'<button class="btn" data-act="snext">'+(last?(L.peek?'Назад до завдань':'До завдань'):'Далі')+'</button></div></div></div>';
  return h;
}

function lessonView(){
  const c=L.cur,ex=c.ex,pct=L.done/L.total*100,from=barFrom('lesson',pct);
  const idx=Math.min(L.total,L.total-L.queue.length+1);
  let h='<div class="view'+(fx.view?' enter':'')+'"><div class="lesson"><div class="lhead"><button class="x" data-act="leave" aria-label="Вийти з уроку">'+IC.cross+'</button>'
    +'<div class="track" role="progressbar" aria-valuemin="0" aria-valuemax="'+L.total+'" aria-valuenow="'+L.done+'"><div class="fill" style="width:'+from+'%" data-to="'+pct+'"></div></div>'
    +(L.placement?'':heartsHtml())
    +((L.info.lesson&&L.info.lesson.learn)?'<button class="x book" data-act="peek" aria-label="Переглянути теорію">'+IC.book+'</button>':'')+'</div>';
  const kicker=L.placement?'Тест рівня · '+idx+' / '+L.total:L.review?'Повторення':'Тренуємось';
  h+='<div class="stage'+(fx.stage?' enter':'')+'"><p class="kicker">'+kicker+'</p><h2 class="q">'+esc(ex.q)+'</h2><p class="how">'+HOW[ex.t]+'</p>';
  if(ex.t==='mc'||ex.t==='out'){
    if(ex.code)h+=codeBlock(ex.code);
    h+='<div class="opts">';
    c.opts.forEach((o,i)=>{
      let cls='opt'+(ex.mono?' mono':'');
      const gone=c.gone.includes(i);
      if(c.checked){
        if(o.ok)cls+=' good'+(fx.res==='pop'?' pop':fx.res==='shake'?' reveal':'');
        else if(c.sel===i)cls+=' bad'+(fx.res==='shake'?' shake':'');
      }else if(c.sel===i)cls+=' sel'+(fx.sel===i?' tap':'');
      if(gone)cls+=' gone';
      h+='<button class="'+cls+'" style="--i:'+i+'" data-act="pick" data-i="'+i+'"'+((c.checked||gone)?' disabled':'')+'>'+esc(o.text)+'</button>';
    });
    h+='</div>';
  }else if(ex.t==='fill'){
    h+=fillCode(ex,c)+'<div class="bank">';
    c.words.forEach((w,i)=>{
      const used=c.slots.includes(w.id);
      h+='<button class="chip" style="--i:'+i+'" data-act="word" data-id="'+w.id+'"'+(used||c.checked?' disabled':'')+'>'+esc(w.w)+'</button>';
    });
    h+='</div>';
  }else if(ex.t==='order'){
    h+='<div class="build'+(c.checked?(c.ok?' good':' bad'):'')+(fx.res?(c.ok?' pop':' shake'):'')+'">';
    if(!c.built.length)h+='<p class="hint">Тут з\'явиться твій код.</p>';
    c.built.forEach(b=>{h+='<button class="line'+(fx.line===b.id?' in':'')+'" data-act="unline" data-id="'+b.id+'"'+(c.checked?' disabled':'')+'>'+esc(b.text)+'</button>';});
    h+='</div><div class="lines">';
    c.bank.forEach((b,i)=>{h+='<button class="line" style="--i:'+i+'" data-act="line" data-id="'+b.id+'">'+esc(b.text)+'</button>';});
    h+='</div>';
  }else if(ex.t==='bug'){
    h+='<div class="bugs'+(c.checked?(c.ok?' okb':' badb'):'')+'">';
    ex.lines.forEach((ln,i)=>{
      let cls='bugline';
      const gone=c.gone.includes(i);
      if(c.checked){
        if(i===ex.bad)cls+=' good'+(fx.res==='pop'?' pop':' reveal');
        else if(c.sel===i)cls+=' bad'+(fx.res==='shake'?' shake':'');
      }else if(c.sel===i)cls+=' sel';
      if(gone)cls+=' gone';
      h+='<button class="'+cls+'" style="--i:'+i+'" data-act="bugpick" data-i="'+i+'"'+((c.checked||gone)?' disabled':'')+'><span class="ln">'+(i+1)+'</span><span class="lc">'+(ln?hl(ln):'&nbsp;')+'</span></button>';
    });
    h+='</div>';
  }else{
    h+=typeCode(ex,c)+'<input id="ans" class="field'+(c.checked?(c.ok?' good':' bad'):'')+(fx.res?(c.ok?' pop':' shake'):'')+'" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Впиши код тут" value="'+esc(c.val)+'"'+(c.checked?' disabled':'')+' aria-label="Твоя відповідь">';
    if(c.hintTxt)h+='<p class="hint">Підказка: '+esc(c.hintTxt)+'</p>';
  }
  h+='</div></div></div>';
  /* action bar sits outside .view so position:fixed is never affected by the enter animation */
  if(L.leave){
    h+='<div class="bar slide"><div class="bar-in"><div class="fb"><div class="fb-text"><h3>Вийти з уроку?</h3><p>Прогрес цього уроку не збережеться.</p></div></div><button class="btn" data-act="stay">Залишитись</button><button class="btn ghost" data-act="quit">Вийти</button></div></div>';
  }else if(!c.checked){
    const ch=canHint(c);
    h+='<div class="bar"><div class="bar-in"><div class="btnrow'+(ch!==null?' hint':'')+'">'
      +(ch!==null?'<button class="btn ghost hintbtn" data-act="hint"'+(ch?'':' disabled')+'>'+IC.bulb+'<span>Підказка</span>'+(S.level==='normal'?'<em>−5 XP</em>':'')+'</button>':'')
      +'<button class="btn" data-act="check"'+(ready(c)?'':' disabled')+'>Перевірити</button></div></div></div>';
  }else{
    const ok=c.ok;
    let ans='';
    if(!ok){
      let a;
      if(ex.t==='mc'||ex.t==='out')a=c.opts.find(o=>o.ok).text;
      else if(ex.t==='fill')a=ex.ans.join('  ,  ');
      else if(ex.t==='bug')a='Рядок '+(ex.bad+1)+': '+ex.lines[ex.bad].trim();
      else if(ex.t==='type')a=ex.acc[0];
      else a=ex.lines.join('\n');
      ans='<span class="ans">'+esc(a)+'</span>';
    }
    const praise=['Правильно!','Чудово!','Так тримати!','Точно!'][L.done%4];
    const gain=L.retried.has(ex)||L.hinted.has(ex)?5:10;
    const plus=(ok&&fx.res&&!L.placement)?'<span class="plus" aria-hidden="true">+'+gain+(fx.fast?' ⚡':'')+'</span>':'';
    h+='<div class="bar slide '+(ok?'good':'bad')+'"><div class="bar-in">'+plus+'<div class="fb"><div class="badge m">'+mascot(ok?'happy':'sad',48)+'</div><div class="fb-text"><h3>'+(ok?praise:'Не зовсім')+'</h3>'
      +(ok?'':'<p>Правильна відповідь:</p>'+ans)

/* ---------- motion helpers ---------- */
function animateBars(){
  const bars=$app.querySelectorAll('.fill[data-to]');
  if(!bars.length)return;
  void $app.offsetWidth;
  requestAnimationFrame(()=>{bars.forEach(b=>{b.style.width=b.dataset.to+'%';});});
}
function runCounters(){
  if(isReduced())return;
  $app.querySelectorAll('[data-count]').forEach(el=>{
    const to=+el.dataset.count,from=+(el.dataset.from||0),pre=el.dataset.pre||'',suf=el.dataset.suf||'';
    if(from===to)return;
    const t0=performance.now(),dur=900;
    (function step(now){
      const p=Math.min(1,Math.max(0,(now-t0)/dur)),e=1-Math.pow(1-p,3);
      el.textContent=pre+Math.round(from+(to-from)*e)+suf;
      if(p<1)requestAnimationFrame(step);
    })(t0);
  });
}
function confetti(){
  if(isReduced())return;
  const box=document.createElement('div');
  box.className='confetti';box.setAttribute('aria-hidden','true');
  let s='';
  for(let i=0;i<46;i++){
    const w=6+Math.random()*7;
    s+='<i style="left:'+(Math.random()*100).toFixed(1)+'%;width:'+w.toFixed(1)+'px;height:'+(w*1.6).toFixed(1)+'px;background:var(--u'+(1+i%6)+');animation-duration:'+(1.9+Math.random()*1.5).toFixed(2)+'s;animation-delay:'+(Math.random()*0.6).toFixed(2)+'s;--r:'+Math.round(Math.random()*720-360)+'deg;--dx:'+Math.round((Math.random()*2-1)*90)+'px"></i>';
  }
  box.innerHTML=s;
  document.body.appendChild(box);
  setTimeout(()=>{if(box.parentNode)box.parentNode.removeChild(box);},4500);
}

/* ================= Lesson logic ================= */
function prep(){
  const ex=L.queue[0],c={ex,checked:false,ok:null,t0:performance.now(),hints:0,gone:[]};
  if(ex.t==='mc'||ex.t==='out'){c.opts=shuffle(ex.opts.map((text,i)=>({text,ok:i===0})));c.sel=null;}
  else if(ex.t==='fill'){c.words=shuffle(ex.ans.concat(ex.extra).map((w,i)=>({id:i,w})));c.slots=ex.ans.map(()=>null);}
  else if(ex.t==='order'){c.bank=shuffle(ex.lines.map((text,i)=>({id:i,text})),true);c.built=[];}
  else if(ex.t==='bug'){c.sel=null;}
  else{c.val='';c.hintTxt='';}
  L.cur=c;fx.stage=true;
}
function reviewPick(){
  const missed=reviewPool().filter(e=>S.miss[e.id]>0).sort((a,b)=>S.miss[b.id]-S.miss[a.id]).slice(0,5);
  const lessons=ALL.filter(l=>S.done[l.uid]&&!S.done[l.uid].skip).sort((a,b)=>S.done[a.uid].t-S.done[b.uid].t).slice(0,6);
  const lists=lessons.map(l=>shuffle(l.lesson.ex.filter(e=>!missed.includes(e))));
  const want=Math.min(8,reviewPool().length)-missed.length,rest=[];
  for(let r=0;rest.length<want&&r<20;r++)lists.forEach(li=>{if(rest.length<want&&li[r])rest.push(li[r]);});
  return shuffle(missed.concat(rest));
}
function newRun(info,queue,extra){
  const mx=LEVELS[S.level].hearts;
  L=Object.assign({info,mode:'practice',queue,total:queue.length,done:0,first:0,hearts:mx,max:mx,retried:new Set(),hinted:new Set(),leave:false,cur:null,si:0,peek:false,fast:0,review:false,placement:false},extra||{});
  delete barsMem.lesson;
  screen='lesson';fx.view=true;prep();render();window.scrollTo(0,0);
}
function startReview(){
  const q=reviewPick();if(!q.length)return;
  newRun({uid:'review',n:-1,lesson:{title:'Змішані завдання з пройдених уроків',ex:[]}},q,{review:true,allEx:q.slice()});
}
function startPlacement(){
  const q=[];
  for(let ui=0;ui<8&&ui<UNITS.length;ui++){
    const ls=UNITS[ui].lessons,lsn=ls[ls.length-1];
    const pool=lsn.ex.filter(e=>e.t==='mc'||e.t==='out'||e.t==='fill');
    q.push(pool[Math.floor(Math.random()*pool.length)]);
  }
  newRun({uid:'placement',n:-1,lesson:{title:'Тест рівня',ex:[]}},q,{placement:true,hearts:99,max:99,pl:[]});
}
function startLesson(uid){
  if(uid==='review'){startReview();return;}
  const info=ALL.find(l=>l.uid===uid);if(!info||!isUnlocked(info.n))return;
  newRun(info,info.lesson.ex.slice(),{mode:'study'});
}
function endStudy(){
  L.mode='practice';L.peek=false;L.si=0;
  fx.view=true;fx.stage=true;
  render();window.scrollTo(0,0);
}
function hint(){
  const c=L.cur,ex=c.ex;
  if(!c||c.checked||canHint(c)!==true)return;
  c.hints++;S.stats.hints++;
  if(S.level!=='easy')L.hinted.add(ex);
  if(ex.t==='mc'||ex.t==='out'){
    const wrong=c.opts.map((o,i)=>i).filter(i=>!c.opts[i].ok&&i!==c.sel);
    shuffle(wrong).slice(0,2).forEach(i=>c.gone.push(i));
  }else if(ex.t==='bug'){
    const wrong=ex.lines.map((l,i)=>i).filter(i=>i!==ex.bad&&i!==c.sel&&ex.lines[i].trim());
    shuffle(wrong).slice(0,Math.ceil(wrong.length/2)).forEach(i=>c.gone.push(i));
    if(c.gone.includes(c.sel))c.sel=null;
  }else if(ex.t==='fill'){
    const k=ex.ans.findIndex((w,i)=>{const id=c.slots[i];return id==null||c.words.find(x=>x.id===id).w!==w;});
    if(k<0)return;
    c.slots[k]=null;
    let chip=c.words.find(x=>x.w===ex.ans[k]&&!c.slots.includes(x.id));
    if(!chip){
      const j=c.slots.findIndex(id=>id!=null&&c.words.find(x=>x.id===id).w===ex.ans[k]);
      if(j>=0)c.slots[j]=null;
      chip=c.words.find(x=>x.w===ex.ans[k]&&!c.slots.includes(x.id));
    }
    if(chip){c.slots[k]=chip.id;fx.slot=k;}
  }else if(ex.t==='order'){
    let i=0;while(i<c.built.length&&c.built[i].text===ex.lines[i])i++;
    while(c.built.length>i)c.bank.push(c.built.pop());
    const bi=c.bank.findIndex(b=>b.text===ex.lines[i]);
    if(bi>=0){const b=c.bank.splice(bi,1)[0];c.built.push(b);fx.line=b.id;}
  }else{
    const a=ex.acc[0];
    c.hintTxt=a.slice(0,Math.max(2,Math.ceil(a.length*0.35)))+'…';
  }
  render();
}
function check(){
  const c=L.cur,ex=c.ex;if(c.checked||!ready(c))return;
  let ok;
  if(ex.t==='mc'||ex.t==='out')ok=c.opts[c.sel].ok;
  else if(ex.t==='fill')ok=c.slots.every((id,k)=>c.words.find(w=>w.id===id).w===ex.ans[k]);
  else if(ex.t==='order')ok=c.built.map(b=>b.text).join('\n')===ex.lines.join('\n');
  else if(ex.t==='bug')ok=c.sel===ex.bad;
  else ok=ex.acc.some(a=>strip(a)===strip(c.val));
  c.checked=true;c.ok=ok;fx.res=ok?'pop':'shake';
  const firstTry=!L.retried.has(ex);
  if(L.placement){
    L.done++;L.pl.push(ok);
  }else if(ok){
    L.done++;
    if(firstTry&&!L.hinted.has(ex)){
      L.first++;
      const dt=(performance.now()-c.t0)/1000;
      if(dt<8&&ex.t!=='type'&&ex.t!=='order'){L.fast++;fx.fast=true;}
    }
    if(firstTry){
      if(S.miss[ex.id]>0){S.miss[ex.id]--;if(!S.miss[ex.id])delete S.miss[ex.id];}
      if(ex.t==='bug')S.stats.bugs++;
      if(ex.t==='type')S.stats.typed++;
    }
  }else{
    L.hearts--;fx.hit=L.hearts;
    S.miss[ex.id]=Math.min(5,(S.miss[ex.id]||0)+1);
    if(L.hearts>0){L.retried.add(ex);L.queue.push(ex);}
  }
  if(!L.placement){
    if(ok){S.stats.run++;S.stats.runBest=Math.max(S.stats.runBest,S.stats.run);}else S.stats.run=0;
  }
  save();
  snd(ok?'ok':'bad');
  render();
  checkAch();
}
function next(){
  const c=L.cur;if(!c.checked)return;
  L.queue.shift();
  if(!L.placement&&L.hearts<=0&&!c.ok){screen='fail';fx.view=true;render();window.scrollTo(0,0);return;}
  if(!L.queue.length){finish();return;}
  prep();render();window.scrollTo(0,0);
}
function finishPlacement(){
  let known=0;
  for(const ok of L.pl){if(ok)known++;else break;}
  ALL.filter(l=>l.ui<known&&!S.done[l.uid]).forEach(l=>{S.done[l.uid]={a:0,skip:1,t:Date.now()};});
  S.stats.placement=1;save();
  res={placement:true,known,total:L.pl.length,right:L.pl.filter(Boolean).length,next:UNITS[known]?UNITS[known].title:null};
  screen='result';fx.view=true;fx.confetti=known>0;snd('done');
  render();window.scrollTo(0,0);
}
function finish(){
  if(L.placement){finishPlacement();return;}
  const acc=Math.round(L.first/L.total*100);
  const mult=(S.level==='hard'?1.5:1)*(isWeekend()?2:1);
  const gain=Math.round((L.first*10+(L.total-L.first)*5+5+L.fast*2)*mult);
  const notes=[];
  if(L.fast)notes.push('Бонус за швидкі відповіді: +'+L.fast*2);
  if(S.level==='hard')notes.push('Складний режим: досвід ×1,5');
  if(isWeekend())notes.push('Вихідні: досвід ×2');
  const lv0=lvlInfo(S.xp).n;
  S.xp+=gain;
  const li=lvlInfo(S.xp);
  if(li.n>lv0)notes.push('Новий рівень: '+li.n+' («'+li.title+'»)');
  const dxp=S.day.d===today()?S.day.xp:0;
  const goalHit=dxp<S.goal&&dxp+gain>=S.goal;
  S.day={d:today(),xp:dxp+gain};
  if(goalHit){S.stats.goals++;notes.push('Ціль дня виконано');}
  const st=bumpStreak();
  if(st.froze)notes.push('Заморожування врятувало серію');
  if(st.earned)notes.push('Нове заморожування серії за тиждень занять');
  if(L.review){
    S.stats.reviews++;
    const seen={};L.allEx.forEach(e=>{seen[e.id.split(':')[0]]=1;});
    Object.keys(seen).forEach(uid=>{if(S.done[uid])S.done[uid].t=Date.now();});
  }else{
    const prev=S.done[L.info.uid];
    S.done[L.info.uid]={a:Math.max(prev&&!prev.skip?prev.a:0,acc),t:Date.now()};
    S.stats.lessons++;
    if(acc===100)S.stats.perfect++;
  }
  save();
  res={info:L.info,acc,gain,hearts:L.hearts,max:L.max,review:!!L.review,notes};
  screen='result';fx.view=true;fx.confetti=true;
  snd('done');
  render();window.scrollTo(0,0);
  if(li.n>lv0)toast('Новий рівень',li.n+' · '+li.title,'ach');
  checkAch();
}

function copyFrom(id){

function importCode(){

    if(a==='leave'){if(L.peek){endStudy();}else{goHome();}return;}
    if(a==='snext'){
      if(L.si<L.info.lesson.learn.length-1){L.si++;fx.stage=true;render();window.scrollTo(0,0);}
      else endStudy();
      return;
    }
    if(a==='sback'){if(L.si>0){L.si--;fx.stage=true;render();window.scrollTo(0,0);}return;}
    return;
  }
  if(a==='peek'){S.stats.peeks++;save();L.mode='study';L.peek=true;L.si=0;L.leave=false;fx.view=true;fx.stage=true;render();window.scrollTo(0,0);checkAch();return;}
  if(a==='leave'){L.leave=true;render();return;}
  if(a==='stay'){L.leave=false;render();return;}
  if(a==='quit'){goHome();return;}
  if(a==='check'){check();return;}
  if(a==='next'){next();return;}
  if(c.checked)return;
  if(a==='hint'){hint();return;}

  else if(a==='bugpick'){c.sel=+el.dataset.i;}

  else if(a==='unline'){const id=+el.dataset.id,i=c.built.findIndex(b=>b.id===id);if(i<0)return;c.bank.push(c.built.splice(i,1)[0]);}
  render();
});

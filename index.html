C('Який запис створює таблицю з 3 рядків і 4 стовпців?',
  ['new int[3][4]','new int[4][3]','new int[3,4]','new int(3)(4)'],
  'У дужках спершу кількість рядків, потім кількість стовпців. Інші записи не є правильним синтаксисом масиву.',
  null, true),
F('Заповни пропуски, щоб програма надрукувала таблицю рядок за рядком.',
  `int[][] t = {{1, 2, 3}, {4, 5, 6}};
for (int r = 0; r < [[0]]; r++) {
    for (int c = 0; c < [[1]]; c++) {
        System.out.print(t[r][c] + " ");
    }
    System.out.println();
}`,
  ['t.length','t[r].length'],
  ['t[c].length','t.size()','t[0]'],
  'Зовнішній цикл іде по рядках, тому межа це t.length. Внутрішній іде по стовпцях поточного рядка, тому t[r].length.'),
R('Збери код, який додає елементи головної діагоналі таблиці.',
  ['int[][] t = {{1, 2}, {3, 4}};',
   'int d = 0;',
   'for (int i = 0; i < t.length; i++) {',
   '    d += t[i][i];',
   '}',
   'System.out.println(d);'],
  'Спершу таблиця й змінна для суми, потім цикл. Діагональ це елементи, де номер рядка дорівнює номеру стовпця: t[0][0] і t[1][1], тобто 1 + 4.'),
T('Допиши вираз, щоб вивелося число 8 (другий рядок, перший стовпець).',
  `int[][] t = {{5, 6}, {8, 9}};
System.out.println([[0]]);`,
  ['t[1][0]'],
  'Число 8 лежить у рядку з номером 1 і стовпці з номером 0, тож t[1][0].'),
T('Допиши рядок, який замінює центральний елемент таблиці на 0.',
  `int[][] t = {{1, 2, 3}, {4, 5, 6}, {7, 8, 9}};
[[0]]
System.out.println(Arrays.toString(t[1]));`,
  ['t[1][1] = 0;','t[1][1]=0;'],
  'Центр має рядок 1 і стовпець 1. Присвоєння t[1][1] = 0; змінює саме цю клітинку, тому другий рядок стане [4, 0, 6].'),
B('Знайди рядок, який не скомпілюється.',
  ['int[][] t = new int[2][3];',
   't[0][0] = 5;',
   'int x = t[0];',
   'System.out.println(x);'],
  2,
  't[0] це цілий рядок таблиці, тобто масив int[], а не одне число. Щоб отримати число, потрібні два індекси: t[0][0].'),
O(`int[][] t = new int[2][2];
for (int r = 0; r < 2; r++) {
    for (int c = 0; c < 2; c++) {
        t[r][c] = r * 2 + c;
    }
}
System.out.println(t[1][0] + t[0][1]);`,
  ['3','2','1','4'],
  'Таблиця заповниться так: {0, 1} і {2, 3}. Тоді t[1][0] = 2, t[0][1] = 1, а сума дорівнює 3.'),
O(`int[][] t = {{1, 2}, {3, 4}, {5, 6}};
int s = 0;
for (int r = 0; r < t.length; r++) {
    s += t[r][1];
}
System.out.println(s);`,
  ['12','9','21','6'],
  'Цикл іде по трьох рядках і щоразу бере елемент зі стовпця 1: 2, 4 і 6. Разом 12. Перший стовпець дав би 1 + 3 + 5 = 9.'),
]},

{unit:5, after:'5-1', key:'5-n1', title:'Рекурсія', learn:[
K('Метод, що викликає сам себе',
  "Уяви, що треба порахувати чашки в стопці. Ти береш одну зверху й просиш помічника порахувати решту, а той робить так само. Це і є рекурсія: метод розв'язує маленьку частину задачі, а решту доручає самому собі, але з меншим числом. Спуск має десь закінчитися, інакше помічники не припинять передавати стопку далі.",
  `static void countdown(int n) {
    if (n == 0) return;
    System.out.println(n);
    countdown(n - 1);
}
countdown(3);`,
  '3\n2\n1'),
K('База і крок',
  "У кожної рекурсії є дві частини. База: випадок, коли відповідь відома одразу й виклики припиняються (тут n == 0). Крок: виклик себе з меншою задачею (n - 1). Сума 1 + 2 + ... + n це n плюс сума до n - 1, а сума до нуля дорівнює 0.",
  `static int sum(int n) {
    if (n == 0) return 0;
    return n + sum(n - 1);
}
System.out.println(sum(4));`,
  '10'),
K('Стек викликів: хто кого чекає',
  "Кожен виклик чекає на результат наступного, тому виклики складаються в стос, як тарілки. Для fact(3): fact(3) чекає fact(2), той чекає fact(1). fact(1) повертає 1 (база). Тоді стос розкручується назад: fact(2) = 2 * 1 = 2, потім fact(3) = 3 * 2 = 6. Множення відбувається вже при поверненні.",
  `static int fact(int n) {
    if (n <= 1) return 1;
    return n * fact(n - 1);
}
System.out.println(fact(3));`,
  '6'),
K('Фібоначчі: два виклики',
  "Число Фібоначчі це сума двох попередніх: 0, 1, 1, 2, 3, 5, 8... Тут метод викликає себе двічі, і є дві бази: fib(0) = 0 та fib(1) = 1. Наприклад fib(4) = fib(3) + fib(2) = 2 + 1 = 3. Виклики розгалужуються, як дерево, тому для великих n це повільно.",
  `static int fib(int n) {
    if (n < 2) return n;
    return fib(n - 1) + fib(n - 2);
}
System.out.println(fib(6));`,
  '8'),
K('Пастка: немає бази, StackOverflowError',
  "Якщо бази немає або до неї ніколи не дійти, виклики не зупиняються. Стос росте, поки не закінчиться пам'ять під нього, і Java кидає StackOverflowError. Завжди питай себе: де зупинка і чи наближається кожен крок до неї? У цьому прикладі зупинки немає.",
  `static int bad(int n) {
    return n + bad(n - 1);
}
System.out.println(bad(3));`,
  'помилка StackOverflowError'),
], ex:[
C('Що таке база рекурсії?',
  ['Випадок, коли метод більше не викликає сам себе','Перший виклик методу з main','Змінна, що рахує кількість викликів','Метод без параметрів'],
  'База це умова зупинки: для неї відповідь відома одразу, тому нових викликів немає. Без неї рекурсія не закінчується.'),
O(`static int f(int n) {
    if (n == 0) return 0;
    return 2 * f(n - 1) + 1;
}
System.out.println(f(3));`,
  ['7','6','3','8'],
  'f(0) = 0. Далі f(1) = 2 * 0 + 1 = 1, f(2) = 2 * 1 + 1 = 3, f(3) = 2 * 3 + 1 = 7.'),
C('Що станеться, якщо в рекурсивному методі немає бази?',
  ['Програма впаде з StackOverflowError','Метод поверне 0','Код не скомпілюється','Java сама зупинить рекурсію'],
  'Компілятор не перевіряє, чи є зупинка. Під час роботи виклики складаються в стос, поки він не переповниться, і виникає StackOverflowError.'),
F('Заповни пропуски, щоб метод обчислював число в степені: power(2, 3) дає 8.',
  `static int power(int b, int e) {
    if (e == [[0]]) return 1;
    return b * power(b, e [[1]] 1);
}
System.out.println(power(2, 3));`,
  ['0','-'],
  ['1','+','*'],
  'Будь-яке число в степені 0 дорівнює 1, це база. Крок зменшує степінь на 1: power(2, 3) = 2 * 2 * 2 * 1 = 8.'),
R('Збери код, який виводить «Готово» після двох спусків рекурсії.',
  ['static void boom(int n) {',
   '    if (n == 0) {',
   '        System.out.println("Готово");',
   '        return;',
   '    }',
   '    boom(n - 1);',
   '}',
   'boom(2);'],
  'Спочатку метод: база з виводом і return, потім рекурсивний виклик із меншим n. Виклик boom(2) іде в кінці, після оголошення методу.'),
T('Допиши умову бази, щоб fact(5) дав 120.',
  `static int fact(int n) {
    if ([[0]]) return 1;
    return n * fact(n - 1);
}
System.out.println(fact(5));`,
  ['n <= 1','n == 1','n < 2','n<=1','n==1','n<2','n == 0','n==0','n <= 0','n<=0'],
  'Факторіал 1 дорівнює 1, тому на n <= 1 (або n == 1) спуск зупиняється. Тоді 5 * 4 * 3 * 2 * 1 = 120.'),
T('Допиши рекурсивний виклик: mul(3, 4) має дати 12 (множення через додавання).',
  `static int mul(int a, int b) {
    if (b == 0) return 0;
    return a + [[0]];
}
System.out.println(mul(3, 4));`,
  ['mul(a, b - 1)','mul(a,b-1)'],
  'a * b це a плюс a * (b - 1). Кожен крок зменшує b на 1, поки не дійдемо до бази b == 0: 3 + 3 + 3 + 3 + 0 = 12.'),
B('Знайди рядок, який не скомпілюється.',
  ['static int fact(int n) {',
   '    if (n <= 1) return 1;',
   '    n * fact(n - 1);',
   '}',
   'System.out.println(fact(3));'],
  2,
  'Вираз n * fact(n - 1); сам по собі не є командою, його результат нікуди не йде. Потрібно повернути його: return n * fact(n - 1);'),
O(`static int g(int n) {
    if (n <= 1) return n;
    return g(n - 1) + g(n - 2);
}
System.out.println(g(5));`,
  ['5','8','3','10'],
  'Це Фібоначчі: g(0)=0, g(1)=1, g(2)=1, g(3)=2, g(4)=3, g(5)=3+2=5.'),
O(`static void walk(int n) {
    if (n == 0) return;
    System.out.println("в " + n);
    walk(n - 1);
    System.out.println("з " + n);
}
walk(2);`,
  ['в 2\nв 1\nз 1\nз 2','в 2\nз 2\nв 1\nз 1','в 1\nв 2\nз 2\nз 1','в 2\nв 1'],
  'Рядки «в» друкуються перед викликом, тому йдуть у порядку 2, 1. Рядки «з» друкуються після повернення зі стосу, тому в зворотному порядку: 1, потім 2.'),
]},

{unit:7, after:'7-1', key:'7-n0', title:'Set: унікальні значення (HashSet, TreeSet)', learn:[
K('Колекція без повторів',
  "Уяви список постійних клієнтів кав'ярні: кожна людина має бути там лише раз, скільки б разів вона не заходила. Для цього в Java є Set (множина). Вона зберігає тільки унікальні значення: спроба додати те, що вже є, нічого не змінює.",
  `Set<String> s = new HashSet<>();
s.add("Лате");
s.add("Мокко");
s.add("Лате");
System.out.println(s.size());`,
  '2'),
K('add, contains, remove',
  "Основні методи схожі на ArrayList. `add` додає значення й повертає boolean: true, якщо воно справді нове, і false, якщо вже було. `contains` перевіряє, чи є значення. `remove` прибирає його. Номерів позицій у Set немає.",
  `Set<Integer> s = new HashSet<>();
System.out.println(s.add(5));
System.out.println(s.add(5));
System.out.println(s.contains(5));
s.remove(5);
System.out.println(s.size());`,
  'true\nfalse\ntrue\n0'),
K('HashSet чи TreeSet',
  "HashSet швидкий, але порядок елементів у ньому не гарантований, тож не розраховуй на нього. TreeSet щоразу тримає елементи відсортованими: числа за зростанням, рядки за алфавітом. Обидва мають однакові методи, різниця лише в порядку.",
  `Set<String> t = new TreeSet<>();
t.add("Mocha");
t.add("Latte");
t.add("Espresso");
System.out.println(t);`,
  '[Espresso, Latte, Mocha]'),
K('Крок за кроком: що в множині',
  "Простежимо TreeSet. Додали 3: [3]. Додали 1: [1, 3], бо TreeSet ставить на своє місце. Додали 3 ще раз: нічого не змінилось, [1, 3]. Додали 2: [1, 2, 3]. Через це Set зручний, щоб позбутися повторів: достатньо віддати йому весь список.",
  `Set<Integer> s = new TreeSet<>();
s.add(3);
s.add(1);
s.add(3);
s.add(2);
System.out.println(s);`,
  '[1, 2, 3]'),
K('Пастка: у Set немає get(i)',
  "Раз порядку позицій немає, то й `s.get(0)` не існує, такий код не скомпілюється. Щоб пройтися по всіх елементах, користуйся for-each. А якщо чекаєш певний порядок, бери TreeSet, а не HashSet.",
  `Set<String> s = new TreeSet<>();
s.add("b");
s.add("a");
// s.get(0) не скомпілюється
for (String x : s) {
    System.out.println(x);
}`,
  'a\nb'),
], ex:[
C('Чим Set відрізняється від List?',
  ['Set не зберігає однакові значення двічі','Set має метод get(i)','Set працює лише з числами','Set завжди відсортований'],
  'Головна властивість Set це унікальність. get(i) є в List, а відсортованим є тільки TreeSet, але не будь-який Set.'),
O(`Set<String> s = new HashSet<>();
s.add("A");
s.add("B");
s.add("A");
s.add("C");
s.add("B");
System.out.println(s.size());`,
  ['3','5','2','4'],
  'Унікальних значень три: A, B і C. Повторні додавання A та B ігноруються, тому size() дорівнює 3.'),
O(`Set<Integer> s = new HashSet<>();
s.add(4);
System.out.println(s.add(4) + " " + s.add(7));`,
  ['false true','true true','false false','true false'],
  'Число 4 уже є, тож перший add повертає false. Число 7 нове, тому другий add повертає true.'),
C('Що станеться, коли викликати add зі значенням, яке вже є в Set?',
  ['Множина не зміниться, а add поверне false','Виникне помилка виконання','Значення додасться вдруге','Старе значення зникне'],
  'Set мовчки ігнорує повтор. Про це лише повідомляє результат false, тож винятку немає.'),
F('Заповни пропуски: створи множину й додай ім’я двічі, розмір має бути 1.',
  `Set<String> g = new [[0]]<>();
g.[[1]]("Ія");
g.add("Ія");
System.out.println(g.[[2]]());`,
  ['HashSet','add','size'],
  ['ArrayList','put','length','Set'],
  'Set це інтерфейс, тож об’єкт створює клас HashSet. Додаємо через add, а кількість елементів дає size(). Дубль не зберігається, тому вийде 1.'),
R('Збери код, який прибирає повтори зі списку й показує впорядковану множину.',
  ['List<Integer> nums = List.of(5, 2, 5, 2, 9);',
   'Set<Integer> u = new TreeSet<>(nums);',
   'System.out.println(u);',
   'System.out.println(u.size());'],
  'Спочатку список із повторами, потім множина, створена з нього: повтори зникають, а TreeSet ще й впорядковує. Виведеться [2, 5, 9], а потім 3.'),
T('Допиши метод, який перевіряє, чи є значення в множині.',
  `Set<String> menu = new HashSet<>(List.of("Лате", "Мокко"));
System.out.println(menu.[[0]]("Лате"));`,
  ['contains'],
  'Метод contains повертає true, якщо значення є в множині, і false, якщо немає.'),
T('Допиши назву класу, щоб числа виводились за зростанням.',
  `Set<Integer> s = new [[0]]<>();
s.add(9);
s.add(1);
s.add(5);
System.out.println(s);`,
  ['TreeSet'],
  'Лише TreeSet тримає елементи відсортованими, тому виведеться [1, 5, 9]. У HashSet порядок не гарантований.'),
B('Знайди рядок, який не скомпілюється.',
  ['Set<String> s = new HashSet<>();',
   's.add("Лате");',
   'String x = s.get(0);',
   'System.out.println(x);'],
  2,
  'У Set немає позицій, тому методу get(int) не існує. Щоб дістати елементи, потрібен for-each по множині.'),
O(`Set<Integer> s = new TreeSet<>();
for (int i = 1; i <= 6; i++) {
    s.add(i % 3);
}
System.out.println(s + " " + s.size());`,
  ['[0, 1, 2] 3','[1, 2, 0, 1, 2, 0] 6','[0, 1, 2] 6','[1, 2, 0] 3'],
  'Остачі від ділення на 3 для i від 1 до 6: 1, 2, 0, 1, 2, 0. У множині лишаються 0, 1, 2 без повторів і в порядку зростання, тож розмір 3.'),
C('У List names є 10 імен із повторами. Як дізнатися, скільки в ньому різних імен?',
  ['new HashSet<>(names).size()','names.size()','names.length','names.distinct()'],
  'Множина, створена зі списку, лишає тільки унікальні значення, а size() їх рахує. names.size() порахує і повтори, а names.length та distinct() у List не існують.',
  null, true),
]},

{unit:7, after:'7-n0', key:'7-n1', title:'Сортування: Comparable і Comparator, Collections.sort', learn:[
K('Collections.sort: порядок за замовчуванням',
  "Уяви чергу замовлень на барі: щоб працювати зручно, їх треба впорядкувати, наприклад за номером. `Collections.sort(список)` розставляє елементи на місці, у тому самому списку. Числа йдуть за зростанням. Метод нічого не повертає, він змінює сам список.",
  `List<Integer> p = new ArrayList<>(List.of(30, 10, 20));
Collections.sort(p);
System.out.println(p);`,
  '[10, 20, 30]'),
K('Рядки й обернений порядок',
  "Рядки за замовчуванням сортуються за алфавітом. Щоб перевернути список, є `Collections.reverse`. Разом ці два виклики дають порядок від Я до А. Зверни увагу: reverse не сортує, а лише змінює порядок на протилежний.",
  `List<String> n = new ArrayList<>(List.of("Mocha", "Latte", "Espresso"));
Collections.sort(n);
System.out.println(n);
Collections.reverse(n);
System.out.println(n);`,
  '[Espresso, Latte, Mocha]\n[Mocha, Latte, Espresso]'),
K('Comparator: своє правило порівняння',
  "А що, коли треба сортувати не за алфавітом, а, скажімо, за довжиною слова? Тоді даємо правило у вигляді Comparator: лямбда `(a, b) -> ...` отримує двох сусідів. Якщо результат менший за нуль, a стоїть раніше за b. Більший за нуль: b раніше. Нуль: вони рівні за правилом.",
  `List<String> n = new ArrayList<>(List.of("Espresso", "Latte", "Cap"));
Collections.sort(n, (a, b) -> a.length() - b.length());
System.out.println(n);`,
  '[Cap, Latte, Espresso]'),
K('Comparable: клас сам знає свій порядок',

{unit:7, after:'7-n1', key:'7-n2', title:'Обхід Map та Iterator', learn:[
K('Ключі, значення, пари',
  "Уяви меню кав'ярні: назва напою і ціна. Іноді треба прочитати лише назви, іноді лише ціни. `keySet()` дає всі ключі, `values()` дає всі значення. Тут ми беремо TreeMap, щоб порядок був передбачуваний (за алфавітом ключів). У HashMap порядок не гарантований.",
  `Map<String, Integer> menu = new TreeMap<>();

menu.put("Мокко", 90);

  '[Лате, Мокко]\n[80, 90]'),
K('entrySet: ключ і значення разом',
  "Часто потрібна пара одразу: назва та її ціна. Для цього є `entrySet()`. Кожен елемент це Map.Entry, у нього є `getKey()` і `getValue()`. Це зручніше й швидше, ніж обходити ключі й щоразу викликати `get`.",
  `Map<String, Integer> menu = new TreeMap<>();

K('getOrDefault і merge: рахуємо',

  `Map<String, Integer> cnt = new TreeMap<>();
cnt.put("лате", cnt.getOrDefault("лате", 0) + 1);
cnt.put("лате", cnt.getOrDefault("лате", 0) + 1);

  '{лате=2, мокко=2}'),
K('Iterator: видаляємо під час обходу',

  `Map<String, Integer> m = new TreeMap<>(Map.of("a", 1, "b", 5, "c", 2));

  `Map<String, Integer> m = new TreeMap<>(Map.of("a", 1, "b", 5, "c", 2));

{unit:6, after:'6-1', key:'6-n0', title:"Інкапсуляція: private, getter і setter, валідація", learn:[
K("Навіщо ховати поля",
  "У кав'ярні клієнт не лізе рукою в касу: він просить баристу. З класом так само. Якщо поле відкрите, будь-хто може записати в нього нісенітницю, наприклад мінус 50 мл у чашці. Захист від такого називається інкапсуляція.",
  `class Cup { int ml; }

c.ml = -50;

  "-50"),
K("private: закриваємо поле",
  "Слово `private` робить поле доступним лише всередині власного класу. Ззовні `c.ml` вже не скомпілюється: Java сама зупинить того, хто лізе не туди.",
  `class Cup {
    private int ml;
}
Cup c = new Cup();
c.ml = 200;   // помилка`,
  null),
K("getter і setter: віконце баристи",
  "Закрите поле читають через метод `get...` (getter), а змінюють через метод `set...` (setter). Це віконце баристи: клієнт бачить лише те, що клас дозволив. Імена за звичаєм такі: `getMl`, `setMl`.",
  `class Cup {
    private int ml;
    public int getMl() { return ml; }

K("Валідація: сеттер перевіряє значення",
  "Головна користь сеттера в тому, що він може перевірити число до запису. Йдемо крок за кроком: спершу ml = 100. Виклик setMl(300): умова 300 > 0 істинна, тож ml стає 300. Виклик setMl(-50): умова хибна, запис пропущено, ml лишається 300.",

System.out.println(c.getMl());`,
  "300"),
K("Пастка: ім'я параметра збігається з полем",
  "Якщо параметр називається так само, як поле, то всередині методу `ml` означає параметр. Рядок `ml = ml` просто присвоює параметр самому собі, а поле не чіпає. Щоб дістатися до поля, пиши `this.ml = ml`.",
  `class Cup {
    private int ml = 100;
    void setMl(int ml) { ml = ml; }
    int getMl() { return ml; }
}
Cup c = new Cup();
c.setMl(300);
System.out.println(c.getMl());`,
  "100")

{unit:6, after:'6-n0', key:'6-n1', title:"static, final і enum", learn:[
K("static: одне на весь клас",
  "Кожна чашка має свій обсяг, але лічильник «скільки чашок зроблено» один на всю кав'ярню. Поле зі словом `static` належить не окремому об'єкту, а самому класу. Його читають через ім'я класу: `Cup.made`.",
  `class Cup {
    static int made = 0;
    Cup() { made++; }
}
new Cup(); new Cup();
System.out.println(Cup.made);`,
  "2"),
K("static-метод: виклик без new",
  "Метод зі `static` викликають прямо через клас, без створення об'єкта. Саме тому `main` теж static: програма стартує, коли жодного об'єкта ще немає. Корисно для допоміжних обчислень.",
  `class Price {
    static int withTax(int p) { return p + p / 10; }
}
System.out.println(Price.withTax(100));`,
  "110"),
K("final і константи",
  "`final` означає «після першого присвоєння змінити не можна». Щоб зробити константу, яка спільна для всього класу, пишуть `static final`, а ім'я великими літерами. Спроба змінити таку константу дає помилку компіляції.",
  `class Shop {
    static final int MAX_ML = 500;
}
System.out.println(Shop.MAX_ML);
Shop.MAX_ML = 600;   // помилка`,
  null),
K("enum: список допустимих значень",
  "Розмір чашки може бути лише S, M або L. Для такого випадку є `enum`: це тип зі списком іменованих значень. Помилитися в написанні не вийде, компілятор не пропустить. Метод `values()` дає всі значення по порядку.",
  `enum Size { S, M, L }
Size s = Size.M;
System.out.println(s);
for (Size x : Size.values()) {
    System.out.print(x);
}`,
  "M\nSML"),
K("Пастка: static не бачить звичайних полів",
  "static-метод викликають без об'єкта, тож незрозуміло, чиє саме поле йому читати. Через це зі static-методу не можна напряму звертатися до звичайних полів. У зворотний бік можна: звичайний метод вільно бачить static-поля.",
  `class Cup {
    int ml = 200;
    static void show() {
        System.out.println(ml);   // помилка
    }
}`,
  null)
], ex:[
C("Що означає слово static біля поля класу?",
  ["Поле одне на весь клас і спільне для всіх його об'єктів","Поле не можна змінювати","Поле видно лише в одному методі","Для кожного об'єкта створюється своя копія поля"],
  "static-поле зберігається один раз у класі, а не в кожному об'єкті."),
O(`class Order {
    static int total = 0;
    int id;
    Order() { total++; id = total; }
}
Order a = new Order();
Order b = new Order();
System.out.println(a.id + " " + b.id + " " + Order.total);`,
  ["1 2 2","1 1 2","2 2 2","1 2 1"],
  "total спільний: після першого об'єкта він 1, після другого 2. Поле id у кожного своє: 1 та 2."),
C("Яке оголошення задає константу, спільну для всього класу?",
  ["static final int MAX = 10;","static int MAX = 10;","final static MAX = 10;","const int MAX = 10;"],
  "Потрібні і static (спільна), і final (незмінна), і тип. Слова const у Java немає.",
  null,true),
F("Заповни пропуски, щоб вивести обране зазвичай значення та всі види обсмажування.",
  `enum Roast { LIGHT, DARK }
Roast r = Roast.[[0]];
System.out.println(r);
for (Roast x : Roast.[[1]]()) {
    System.out.println(x);
}`,
  ["DARK","values"],["dark","length","list"],
  "Значення enum пишуть точно так, як у списку, а values() повертає їх усі."),
R("Збери клас із лічильником проданих чашок.",
  ["class Shop {","    static int sold = 0;","    static void sell() {","        sold++;","    }","}"],
  "Спершу static-поле, далі static-метод, який збільшує його на одиницю."),
T("Допиши виклик static-методу twice.",
  `class Calc {
    static int twice(int x) { return x * 2; }
}
System.out.println([[0]](21));`,
  ["Calc.twice","Calc . twice"],
  "static-метод викликають через ім'я класу: Calc.twice(21)."),
T("Допиши слово, яке робить PERCENT незмінною.",
  `class Tax {
    static [[0]] int PERCENT = 10;
}`,
  ["final"],
  "final забороняє змінювати значення після присвоєння."),
B(null,
  ["class Cup {","    final int ml = 200;","    void fill() {","        ml = 250;","    }","}"],
  3,
  "Поле ml позначене final, його не можна перезаписати."),
O(`class Cup {
    static int count = 0;
    int ml;
    Cup(int ml) { this.ml = ml; count++; }
    static int getCount() { return count; }
}
Cup a = new Cup(200);
Cup b = new Cup(300);

  ["2 550","2 500","3 550","2 450"],
  "Створено два об'єкти, тож count дорівнює 2. Власне ml у першої чашки змінили на 250, тому 250+300=550."),
C("Що з цього можна зробити всередині static-методу sell()?",
  ["Змінити sold, бо воно теж static","Прочитати id, бо воно в тому ж класі","Написати this.id","Нічого: static-метод не бачить жодних полів"],
  "Static-метод бачить static-поля, але не поля конкретного об'єкта, бо жодного об'єкта в нього немає.",
  `class Shop {
    static int sold = 0;
    int id = 7;
    static void sell() { ... }

]},

{unit:10, after:'10-1', key:'10-n0', title:"Клас Object: toString, equals, hashCode", learn:[
K("Усі класи походять від Object",
  "Навіть коли ти пишеш `class Cup { }` без жодного extends, Java мовчки додає `extends Object`. Тому кожен об'єкт уміє три речі: перетворитися на текст (`toString`), порівнятися (`equals`) і дати число-відбиток (`hashCode`). Але стандартні версії майже нічого корисного не роблять. Цифри після @ у тебе будуть інші.",
  `class Cup { }
Cup c = new Cup();
System.out.println(c);`,
  "Cup@1b6d3586"),
K("toString: людський текст замість Cup@...",
  "Коли println друкує об'єкт, він сам викликає `toString()`. Якщо написати свою версію, замість незрозумілого Cup@... побачиш потрібний текст. Над методом пишуть `@Override`: це підказка компілятору, що ми замінюємо чужий метод, і він перевірить, чи правильно.",
  `class Cup {
    String drink = "латте";
    @Override
    public String toString() { return "Чашка: " + drink; }
}
System.out.println(new Cup());`,
  "Чашка: латте"),
K("== та equals: однаковий об'єкт чи однаковий зміст",
  "Для об'єктів `==` питає: це один і той самий об'єкт у пам'яті? А `equals` має питати: вони однакові за змістом? Але стандартний equals робить те саме, що ==. Тому дві чашки латте, створені окремо, для Java різні.",
  `class Cup { String drink = "латте"; }
Cup a = new Cup();
Cup b = new Cup();
System.out.println(a == b);
System.out.println(a.equals(b));`,
  "false\nfalse"),
K("Пишемо свій equals крок за кроком",
  "Параметр equals завжди має тип `Object`, бо порівняти можна з чим завгодно. Тому: 1) `instanceof Cup` перевіряє, чи прийшла справді чашка, інакше повертаємо false; 2) `(Cup) o` перетворює Object назад на Cup; 3) порівнюємо потрібні поля. Тепер дві чашки латте будуть рівні.",
  `class Cup {
    String drink;
    Cup(String d) { drink = d; }
    public boolean equals(Object o) {
        if (!(o instanceof Cup)) return false;
        return drink.equals(((Cup) o).drink);
    }
}`,
  null),
K("Пастка: змінив equals, зроби і hashCode",
  "Правило: якщо два об'єкти рівні за equals, їхні hashCode мають збігатися. Інакше колекції на хешах (`HashSet`, `HashMap`) поводяться дивно: можуть не знайти очевидно однаковий об'єкт. Тому equals і hashCode завжди пишуть разом, із тих самих полів.",
  `class Cup {
    String d;
    Cup(String d) { this.d = d; }
    public boolean equals(Object o) {
        return o instanceof Cup && ((Cup) o).d.equals(d);
    }
    public int hashCode() { return d.hashCode(); }
}`,
  null)
], ex:[
C("Від якого класу неявно успадковується кожен клас у Java?",
  ["Object","Main","Class","Base"],
  "Усе в Java починається з Object, тому toString, equals і hashCode є в кожному класі."),
C("Що надрукує println(c) для класу Cup, у якому немає свого toString?",
  ["Назву класу, символ @ і число, наприклад Cup@1b6d3586","Усі поля об'єкта","null","Буде помилка компіляції"],
  "Стандартний toString з Object друкує ім'я класу та хеш, а не вміст полів."),
O(`class Mug {
    int ml = 250;
    @Override
    public String toString() { return ml + " мл"; }
}
Mug m = new Mug();
System.out.println("Кружка: " + m);`,
  ["Кружка: 250 мл","Кружка: Mug@1b6d3586","Кружка: 250","Кружка: m"],

O(`class Cup { }
Cup a = new Cup();
Cup b = a;
Cup c = new Cup();
System.out.println((a == b) + " " + (a == c) + " " + a.equals(c));`,
  ["true false false","true true false","false false false","true false true"],
  "b вказує на той самий об'єкт, що й a. c це новий об'єкт, а стандартний equals працює як ==."),
F("Заповни пропуски, щоб println(t) показував текст про чай.",
  `class Tea {
    String kind = "матча";
    [[0]]
    public [[1]] toString() {
        return "Чай " + kind;
    }
}`,
  ["@Override","String"],["@Overload","int","void"],
  "toString повертає String, а @Override перевіряє, що ми справді замінюємо метод Object."),
R("Збери equals, що порівнює чашки за напоєм.",
  ["class Cup {","    String drink = \"мокко\";","    public boolean equals(Object o) {","        if (!(o instanceof Cup)) return false;","        return drink.equals(((Cup) o).drink);","    }","}"],
  "Спершу перевіряємо тип, потім порівнюємо поле. Без перевірки приведення (Cup) могло б впасти."),
T("Допиши тип параметра, який повинен мати equals.",
  `class Cup {
    public boolean equals([[0]] o) {
        return o == this;
    }
}`,
  ["Object","java.lang.Object"],
  "Щоб перевизначити equals з Object, параметр теж має бути Object."),
B(null,
  ["class Cup {","    String drink = \"латте\";","    @Override","    public String toString() {","        return drink.length();","    }","}"],
  4,
  "toString має повертати String, а length() дає int."),
C("Що виведе цей код і чому?",
  ["false: equals(Cup) лише перевантажує метод, а x.equals(y) викликає equals з Object","true: бо напої однакові","Помилку компіляції: equals не можна писати","true: бо обидві змінні типу Object"],
  "Параметр має тип Cup, а не Object, тому це інший метод. Виклик x.equals(y) бере стандартний equals, який порівнює адреси.",
  `class Cup {
    String drink = "латте";
    public boolean equals(Cup o) {
        return drink.equals(o.drink);
    }
}
Object x = new Cup();
Object y = new Cup();
System.out.println(x.equals(y));`),
O(`class Cup {
    String d;
    Cup(String d) { this.d = d; }
    public boolean equals(Object o) {
        return o instanceof Cup && ((Cup) o).d.equals(d);
    }
    public int hashCode() { return d.hashCode(); }
}
HashSet<Cup> set = new HashSet<>();
set.add(new Cup("a"));
set.add(new Cup("a"));
set.add(new Cup("b"));
System.out.println(set.size());`,
  ["2","3","1","0"],
  "HashSet не тримає дублікатів. Два Cup(\"a\") рівні за equals і мають однаковий hashCode, тож лишаються лише a та b."),
O(`class Pt {
    int x;
    Pt(int x) { this.x = x; }
    public boolean equals(Object o) {
        return o instanceof Pt && ((Pt) o).x == x;
    }
    public String toString() { return "P" + x; }
}
Pt a = new Pt(1);
Pt b = new Pt(1);
System.out.println(a + " " + a.equals(b) + " " + (a == b));`,
  ["P1 true false","P1 true true","Pt@1b6d3586 true false","P1 false false"],
  "toString дає P1. equals порівнює x і каже true. А == порівнює адреси двох окремих об'єктів, тож false.")
]},

{unit:8, after:'8-1', key:'8-n0', title:"Власні винятки (extends Exception / RuntimeException)", learn:[
K("Навіщо власний виняток",
  "У кав'ярні закінчилося молоко. Це не «якась загальна помилка», а конкретна ситуація, і їй варто дати ім'я. Власний виняток це просто клас, який розширює `Exception` або `RuntimeException`. Тоді код читається майже як людська мова.",
  `class OutOfMilkException extends RuntimeException { }
try {
    throw new OutOfMilkException();
} catch (OutOfMilkException e) {
    System.out.println("Немає молока");
}`,
  "Немає молока"),
K("Повідомлення через super",
  "Щоб виняток ніс текст, додай конструктор і передай рядок батьківському класу через `super(...)`. Потім цей текст можна дістати методом `getMessage()`.",
  `class MilkException extends Exception {
    MilkException(String msg) { super(msg); }
}
MilkException e = new MilkException("Молоко скінчилося");
System.out.println(e.getMessage());`,
  "Молоко скінчилося"),
K("Exception чи RuntimeException",
  "Якщо успадкувати `Exception`, виняток стає перевірюваним (checked): компілятор змусить кожного, хто викликає такий метод, або обгорнути виклик у try/catch, або написати `throws`. Виняток від `RuntimeException` непевірюваний: примусу немає. Слово `throws` у заголовку методу попереджає, що метод може викинути виняток.",
  `class MilkException extends Exception { }
class Bar {
    static void pour() throws MilkException {
        throw new MilkException();
    }
}
Bar.pour();   // помилка`,
  null),
K("Розбір виконання: куди йде керування",
  "Розбираємо. milk = 30, умова 30 < 50 істинна, тому виконується throw. Керування одразу стрибає у catch, а рядок «Налито» пропускається. У catch беремо текст винятку через getMessage().",
  `class MilkException extends RuntimeException {
    MilkException(String m) { super(m); }
}
int milk = 30;
try {
    if (milk < 50) throw new MilkException("Мало: " + milk);
    System.out.println("Налито");
} catch (MilkException e) { System.out.println(e.getMessage()); }`,
  "Мало: 30"),
K("Пастка: загальний catch стоїть першим",
  "Блоки catch перевіряються зверху вниз. Якщо першим стоїть загальний `catch (Exception e)`, він ловить усе, і конкретний catch нижче ніколи не спрацює. Java помітить це й видасть помилку компіляції. Правило: спершу конкретні, потім загальні.",
  `class MilkException extends RuntimeException { MilkException(String m) { super(m); } }
try {
    throw new MilkException("x");
} catch (Exception e) {
    System.out.println("1");
} catch (MilkException e) {   // помилка
    System.out.println("2");
}`,
  null)
], ex:[
C("Від якого класу успадковують власний виняток, щоб його не треба було обов'язково ловити чи оголошувати через throws?",
  ["RuntimeException","Exception","Object","String"],
  "Нащадки RuntimeException непевірювані: компілятор не вимагає try/catch чи throws."),
C("Метод має заголовок pour() throws MilkException, а MilkException успадковує Exception. Що треба зробити при виклику pour()?",
  ["Обгорнути виклик у try/catch або й самому оголосити throws","Нічого, помилка виникне лише під час роботи","Додати слово static","Замінити throws на throw"],
  "Це перевірюваний виняток, тож компілятор вимагає від викликача або обробити його, або передати далі через throws."),
O(`class SoldOutException extends RuntimeException { }
class Shop {
    static void sell(int left) {
        if (left == 0) throw new SoldOutException();
        System.out.println("Продано");
    }
}
try {
    Shop.sell(2);
    Shop.sell(0);
    Shop.sell(1);
} catch (SoldOutException e) {
    System.out.println("Нема");
}`,
  ["Продано\nНема","Продано\nНема\nПродано","Продано\nПродано\nНема","Нема"],
  "Перший виклик друкує «Продано». Другий кидає виняток, керування йде в catch, а третій виклик уже не виконується."),
F("Заповни пропуски, щоб створити власний виняток із повідомленням.",
  `class EmptyCupException [[0]] RuntimeException {
    EmptyCupException(String m) {
        [[1]](m);
    }
}`,
  ["extends","super"],["implements","this","throws"],
  "Клас успадковується через extends, а текст передається батьківському конструктору через super(m)."),
R("Збери клас, що викидає власний виняток, якщо цукру забагато.",
  ["class SugarException extends RuntimeException { }","class Bar {","    static void sweeten(int spoons) {","        if (spoons > 5) {","            throw new SugarException();","        }","    }","}"],
  "Спершу оголошуємо виняток, потім метод, який перевіряє ложки та кидає виняток."),
T("Допиши слово, яким викидають виняток.",
  `class SugarException extends RuntimeException { }
class Bar {
    static void sweeten(int s) {
        if (s > 5) [[0]] new SugarException();
    }
}`,
  ["throw"],
  "throw (без s) викидає сам об'єкт винятку, а throws лише оголошує в заголовку."),
T("Допиши слово в заголовку методу, що попереджає про перевірюваний виняток.",
  `class MilkException extends Exception { }
class Bar {
    static void pour(int ml) [[0]] MilkException {
        if (ml < 50) throw new MilkException();
    }

K("Збираємо потік назад","Уяви: бариста перебирає чергу замовлень, відкидає зайве, щось готує. Але наприкінці все треба поставити на піднос. Так і в `stream`: `filter` та `map` лише обробляють елементи, а щоб отримати готовий результат (список, рядок, мапу), потрібна завершальна операція `collect`.",`List<String> drinks = List.of("latte", "espresso", "mocha");

{unit:11, after:'11-n0', key:'11-n1', title:'Optional: безпечно працюємо з null',
learn:[
K("Навіщо потрібен Optional","Клієнт просить напій, якого немає в меню. Якщо бариста мовчки подасть порожній стакан (`null`), клієнт не зрозуміє, що сталося, а програма впаде з `NullPointerException`. `Optional` це коробочка з написом «тут може бути значення, а може й не бути». Ти бачиш це у типі й змушений обробити обидва випадки.",`String s = null;
System.out.println(s.length());`,null),
K("Як створити Optional","Є три способи. `Optional.of(x)` для значення, яке точно не `null` (якщо передати `null`, буде помилка). `Optional.empty()` для порожньої коробочки. `Optional.ofNullable(x)` коли не знаєш: поверне порожню, якщо `x` дорівнює `null`.",`Optional<String> a = Optional.of("latte");
Optional<String> b = Optional.empty();
System.out.println(a);
System.out.println(b);`,"Optional[latte]\nOptional.empty"),
K("Як дістати значення","Найзручніше віддати запасний варіант: `orElse(запас)` поверне вміст або запас, якщо коробочка порожня. `ifPresent(дія)` виконає дію, лише коли значення є. `isPresent()` просто відповідає true або false.",`Optional<String> a = Optional.of("latte");
Optional<String> b = Optional.empty();
System.out.println(a.orElse("none"));
System.out.println(b.orElse("none"));
a.ifPresent(x -> System.out.println("got " + x));`,"latte\nnone\ngot latte"),
K("Optional разом зі stream","Багато операцій потоку повертають `Optional`, бо результату може й не бути. Наприклад, `findFirst()` бере перший елемент, а якщо потік порожній, дає порожню коробочку. Метод `map` працює й на `Optional`: перетворює вміст, якщо він є, а порожню коробочку лишає порожньою. Тут для `b` фільтр нічого не знайшов, тож `map` пропускається, і спрацьовує `orElse`.",`List<String> d = List.of("tea", "latte", "mocha");
Optional<String> a = d.stream().filter(x -> x.length() > 4).findFirst();
Optional<String> b = d.stream().filter(x -> x.length() > 9).findFirst();
System.out.println(a.map(String::toUpperCase).orElse("none"));
System.out.println(b.map(String::toUpperCase).orElse("none"));`,"LATTE\nnone"),
K("Пастка: get() на порожньому","Метод `get()` на порожньому `Optional` кидає `NoSuchElementException`, тобто ти просто змінюєш один збій на інший. Тому спершу перевір `isPresent()` або, ще краще, користуйся `orElse`, `map`, `ifPresent`. І пам'ятай: `Optional.of(null)` теж одразу падає, для невідомого значення бери `ofNullable`.",`Optional<String> e = Optional.empty();
System.out.println(e.isPresent());
System.out.println(e.orElse("none"));`,"false\nnone")
],
ex:[
C("Навіщо в Java придумали `Optional`?",["Щоб у типі було видно, що значення може бути відсутнім, і не впасти на `null`","Щоб прискорити роботу програми","Щоб замінити всі масиви","Щоб значення ніколи не можна було змінити"],"`Optional` робить можливу відсутність значення явною: компілятор і читач бачать, що її треба обробити."),
O(`Optional<String> o = Optional.of("mocha");
System.out.println(o);`,["Optional[mocha]","mocha","Optional.empty","Optional(mocha)"],"Рядкове представлення непорожнього `Optional` має вигляд `Optional[значення]`."),
C("Що станеться при виклику `Optional.of(null)`?",["Програма кине NullPointerException","Створиться порожній Optional","Поверниться null","Код не скомпілюється"],"`of` вимагає значення, що точно існує. Для можливого `null` призначений `ofNullable`."),
O(`Optional<String> o = Optional.empty();
System.out.println(o.orElse("tea"));`,["tea","Optional.empty","null","Нічого не виведе"],"Коробочка порожня, тому `orElse` повертає запасне значення tea."),
F("Зроби безпечний `Optional` зі змінної, яка може бути `null`, і дістань значення із запасом.",`String name = null;
Optional<String> o = Optional.[[0]](name);
String r = o.[[1]]("guest");
System.out.println(r);`,["ofNullable","orElse"],["empty","get","isPresent"],"`ofNullable` дозволяє `null` і дає порожню коробочку. Далі `orElse` підставляє guest."),
F("Знайди перший напій на літеру m і виведи його, якщо він є.",`Optional<String> f = d.stream().filter(x -> x.startsWith("m")).[[0]]();
f.[[1]](x -> System.out.println(x));`,["findFirst","ifPresent"],["count","orElse","map"],"`findFirst` повертає `Optional`, а `ifPresent` виконає дію лише тоді, коли значення справді є."),
R("Збери код: знайди перше довге слово або виведи none.",['List<String> d = List.of("tea", "mocha");','Optional<String> f = d.stream().filter(x -> x.length() > 3).findFirst();','String s = f.orElse("none");','System.out.println(s);'],"Спочатку список, потім пошук з `Optional`, потім дістаємо значення із запасом, і лише тоді друкуємо."),
T("Допиши вираз, який поверне значення з `o` або рядок none, якщо `o` порожній.",`Optional<String> o = Optional.empty();
String r = [[0]];
System.out.println(r);`,["o.orElse(\"none\")","o.orElseGet(() -> \"none\")"],"`orElse` віддає вміст або запасне значення, тож `NullPointerException` тут неможливий."),
T("Допиши метод, який відповідає true, якщо в коробочці є значення.",`Optional<String> o = Optional.of("tea");
boolean has = o.[[0]]();`,["isPresent"],"`isPresent()` повертає true для непорожнього `Optional` і false для порожнього."),
B(null,['Optional<String> a = Optional.of("tea");','String s = a.orElse("none");','int n = a.map(String::length);','System.out.println(s + n);'],2,"`map` на `Optional` повертає знову `Optional` (тут `Optional<Integer>`), а не `int`. Треба дописати `.orElse(0)`."),
O(`List<String> d = List.of("tea", "latte", "mocha");
Optional<String> x = d.stream().filter(s -> s.startsWith("m")).findFirst();
Optional<String> y = d.stream().filter(s -> s.startsWith("z")).findFirst();
System.out.println(x.map(String::length).orElse(-1));
System.out.println(y.map(String::length).orElse(-1));
System.out.println(y.isPresent());`,["5\n-1\nfalse","5\n-1\ntrue","mocha\n-1\nfalse","5\n0\nfalse"],"Для `x` знайдено mocha, `map` дає довжину 5. Для `y` слів на z немає, коробочка порожня, `map` пропускається, і `orElse` дає -1. `isPresent()` для `y` це false.")
]},

{unit:14, after:'14-1', key:'14-n0', title:'Wildcards і <T extends Comparable<T>>',
learn:[
K("Обмежений тип: T extends Comparable<T>","Уяви конкурс «найкращий напій»: брати участь можуть лише ті, кого можна порівняти між собою. Запис `<T extends Comparable<T>>` каже саме це: `T` може бути будь-яким типом, але тільки таким, що вміє порівнювати себе з іншим (має метод `compareTo`). Тоді один метод `max` працює і з числами, і з рядками.",`static <T extends Comparable<T>> T max(T a, T b) {
    return a.compareTo(b) >= 0 ? a : b;
}
System.out.println(max(3, 8));
System.out.println(max("tea", "latte"));`,"8\ntea"),
K("Навіщо потрібне extends","Без обмеження `T` може бути чим завгодно, навіть звичайним `Object`, а в нього немає `compareTo`. Компілятор не дозволить викликати метод, який він не гарантує. Слово `extends` у дужках `<>` і є гарантією. Сам `compareTo` повертає число: менше нуля, якщо перший менший; нуль, якщо рівні; більше нуля, якщо перший більший. Важливий лише знак.",`System.out.println("a".compareTo("b") < 0);
System.out.println("b".compareTo("a") > 0);
Integer x = 5;
System.out.println(x.compareTo(5));`,"true\ntrue\n0"),
K("Wildcard ?: будь-який тип","Є дивна річ: `Integer` це `Number`, але `List<Integer>` НЕ є `List<Number>`. Тому метод з параметром `List<Number>` не прийме список цілих. Знак питання `?` означає «список чого завгодно». З такого списку можна читати елементи як `Object`.",`static void printAll(List<?> list) {
    for (Object o : list) System.out.println(o);
}
printAll(List.of(1, 2));
printAll(List.of("a"));`,"1\n2\na"),
K("? extends: читаємо, не пишемо","`List<? extends Number>` означає «список Number або чогось успадкованого: Integer, Double...». Читати можна: кожен елемент точно хоча б `Number`. Крок за кроком для `sum(List.of(1, 2, 3))`: s=0, потім додаємо 1, 2, 3 і маємо 6.0. А от додати в такий список нічого не можна (крім null): компілятор не знає, чи це список Integer, чи Double, тож боїться покласти не те.",`static double sum(List<? extends Number> nums) {
    double s = 0;
    for (Number n : nums) s += n.doubleValue();
    return s;
}
System.out.println(sum(List.of(1, 2, 3)));
System.out.println(sum(List.of(1.5, 2.5)));`,"6.0\n4.0"),
K("? super: пишемо, але читати важко","`List<? super Integer>` означає «список Integer або будь-якого його предка: Number, Object». Туди безпечно додавати `Integer`, бо він підійде в кожен такий список. Зате читати можна лише як `Object`. Запам'ятай правило: джерело даних, з якого читаєш, це `extends`, а приймач, куди кладеш, це `super`.",`static void fill(List<? super Integer> list) {
    list.add(1);
    list.add(2);
}
List<Number> nums = new ArrayList<>();
fill(nums);
System.out.println(nums);`,"[1, 2]")
],
ex:[
C("Що означає запис `<T extends Comparable<T>>`?",["T може бути лише типом, об'єкти якого вміють порівнювати себе","T може бути будь-яким типом без обмежень","T мусить бути числом","T мусить бути рядком"],"Після `extends` стоїть умова: тип має мати `compareTo`, тоді метод може порівнювати елементи."),
O(`static <T extends Comparable<T>> T bigger(T a, T b) {
    return a.compareTo(b) > 0 ? a : b;
}
System.out.println(bigger("mocha", "latte"));
System.out.println(bigger(4, 4));`,["mocha\n4","latte\n4","mocha\n0","latte\n0"],"Рядок mocha за абеткою після latte, тож він більший. Для 4 та 4 `compareTo` дає 0, умова `> 0` хибна, і повертається `b`, тобто теж 4."),
C("Є метод `static <T extends Comparable<T>> T min(T a, T b)`. Який виклик скомпілюється?",["min(2, 7)","min(new Object(), new Object())","min(new int[0], new int[1])","min(new ArrayList<>(), new ArrayList<>())"],"`Integer` вміє порівнювати себе, а `Object`, масиви та `ArrayList` не реалізують `Comparable`.",null,true),
O(`static double sum(List<? extends Number> nums) {
    double s = 0;
    for (Number n : nums) s += n.doubleValue();
    return s;
}
System.out.println(sum(List.of(2, 3)));
System.out.println(sum(List.of(0.5, 0.25)));`,["5.0\n0.75","5\n0.75","5.0\n0.5","23.0\n0.75"],"Метод повертає `double`. Для 2 та 3 це 5.0, для 0.5 та 0.25 це 0.75."),
F("Оголоси метод, який вибирає більше з двох значень.",`static <T [[0]] Comparable<T>> T maxOf(T a, T b) {
    return a.[[1]](b) > 0 ? a : b;
}`,["extends","compareTo"],["implements","equals","super","compare"],"У параметрі типу для обмеження пишуть `extends`, навіть якщо `Comparable` це інтерфейс. А порівняння дає `compareTo`, бо `equals` повертає boolean."),
F("Зроби метод, що приймає список чисел будь-якого виду (Integer, Double...) і лише читає його.",`static double total(List<[[0]] [[1]] Number> nums) {
    double s = 0;
    for (Number n : nums) s += n.doubleValue();
    return s;
}`,["?","extends"],["super","implements","T"],"`? extends Number` означає «Number або його нащадки», тож кожен елемент можна прочитати як `Number`. Із `super` цикл не скомпілюється."),
R("Склади метод, що повертає більший з двох елементів.",['static <T extends Comparable<T>> T max(T a, T b) {','    if (a.compareTo(b) > 0) return a;','    return b;','}'],"Спочатку заголовок з обмеженням, всередині умова, потім запасне повернення `b`, і закриваюча дужка."),
T("Впиши тип параметра так, щоб метод приймав список будь-чого й лише рахував його розмір.",`static int count(List<[[0]]> list) {
    return list.size();
}`,["?"],"Знак питання означає «список чогось невідомого», і для `size()` нам більше нічого не треба."),
T("Впиши тип параметра, щоб у метод можна було передати і List<Integer>, і List<Number>, і List<Object>, а всередині додавати цілі числа.",`static void put(List<[[0]]> list) {
    list.add(5);
}`,["? super Integer","?super Integer"],"`? super Integer` приймає список Integer та його предків, і в кожен з них безпечно додати Integer."),
B(null,['static <T> T bigger(T a, T b) {','    return a.compareTo(b) > 0 ? a : b;','}'],1,"Без `extends Comparable<T>` компілятор знає про `T` лише те, що це `Object`, а в `Object` немає `compareTo`."),
C("У методі параметр `List<? extends Number> nums`. Який рядок НЕ скомпілюється?",["nums.add(5);","Number n = nums.get(0);","for (Number x : nums) { }","int size = nums.size();"],"Із `? extends` читати можна, а додавати ні: компілятор не знає, чи це список Integer, Double чи ще чогось.",null,true)
]},

{unit:15, after:'15-1', key:'15-n0', title:'Гонка даних: volatile, AtomicInteger, synchronized',
learn:[
K("Що таке гонка даних","Дві бариста ведуть спільну лічильну дошку чашок. Обидва бачать число 5, обидва беруть крейду й пишуть 6. Було продано дві чашки, а на дошці лише на одну більше. Це і є race condition (гонка): результат залежить від того, хто встиг раніше. У програмі так само, якщо два потоки змінюють одну змінну без захисту. Код нижче в різні запуски може виводити різне число, не завжди 2000.",`static int n = 0;
Thread t1 = new Thread(() -> { for (int i = 0; i < 1000; i++) n++; });
Thread t2 = new Thread(() -> { for (int i = 0; i < 1000; i++) n++; });
t1.start();
t2.start();
t1.join();
t2.join();
System.out.println(n);`,null),
K("Чому n++ небезпечний","На вигляд `n++` одна дія, але для процесора це три кроки: прочитати значення, додати 1, записати назад. Якщо потоки перемішають кроки, одне додавання загубиться. Ось як це відбувається, коли обидва потоки зробили `n++` одночасно (n було 5):",`n = 5
Потік A: читає n, бачить 5
Потік B: читає n, бачить 5
Потік A: записує 5 + 1, тепер n = 6
Потік B: записує 5 + 1, тепер n = 6
Результат: 6, а мало бути 7`,null),
K("AtomicInteger: неподільна дія","`AtomicInteger` це число, яке змінюється одним неподільним кроком: ніхто не втрутиться посередині. Замість `n++` пиши `incrementAndGet()`. Є ще `get()` (прочитати), `addAndGet(k)` (додати k і повернути нове), `getAndIncrement()` (повернути старе й збільшити). Метод `join()` змушує головний потік дочекатися кінця потоку, тому ми читаємо результат лише коли всі закінчили. Тут завжди рівно 2000.",`AtomicInteger n = new AtomicInteger(0);
Runnable r = () -> { for (int i = 0; i < 1000; i++) n.incrementAndGet(); };
Thread t1 = new Thread(r);
Thread t2 = new Thread(r);
t1.start(); t2.start();
t1.join(); t2.join();
System.out.println(n.get());`,"2000"),
K("synchronized: один за раз","Інший спосіб: поставити біля цінного місця охоронця. Метод зі словом `synchronized` може виконувати лише один потік одночасно, решта чекають у черзі. Тому три кроки `n++` вже ніхто не розірве, і результат знову рівно 2000. Для складних дій з кількома змінними саме `synchronized` і потрібен, а `AtomicInteger` добре підходить для одного лічильника.",`static int n = 0;
static synchronized void inc() { n++; }
Runnable r = () -> { for (int i = 0; i < 1000; i++) inc(); };
Thread t1 = new Thread(r);
Thread t2 = new Thread(r);
t1.start(); t2.start();
t1.join(); t2.join();
System.out.println(n);`,"2000"),
K("volatile і пастка","`volatile` каже: ця змінна не кешується, кожен потік завжди бачить свіже значення. Це корисно для прапорців на кшталт `done`. Але `volatile` НЕ робить `n++` безпечним: три кроки читання, додавання й запису так само можуть перемішатися. Отже, `volatile` гарантує видимість, а `synchronized` та `AtomicInteger` ще й неподільність.",`static volatile boolean done = false;
Thread t = new Thread(() -> { done = true; });
t.start();
t.join();
System.out.println(done);`,"true")
],
ex:[
C("Що таке race condition (гонка даних)?",["Результат залежить від того, в якому порядку потоки встигли виконати свої кроки","Один потік працює швидше за інший","Програма виконується занадто повільно","Потік завершується з помилкою"],"Гонка виникає, коли кілька потоків без захисту змінюють спільні дані, і підсумок залежить від випадкового чергування."),
O(`static int total = 0;
Thread t = new Thread(() -> {
    for (int i = 1; i <= 4; i++) total += i;
});
t.start();
t.join();
System.out.println(total);`,["10","0","4","24"],"`join()` змушує main дочекатися потоку, який рахує 1+2+3+4=10. Без `join` main міг би надрукувати ще 0."),
C("Два потоки роблять `n++` над спільною змінною `int n`. Що найпростіше виправить гонку?",["Замінити int на AtomicInteger і викликати incrementAndGet()","Замінити n++ на n = n + 1","Зробити змінну private","Додати слово final"],"`n = n + 1` це ті самі три кроки, а `AtomicInteger` робить збільшення неподільним."),
O(`AtomicInteger a = new AtomicInteger(10);
System.out.println(a.incrementAndGet());
System.out.println(a.getAndIncrement());
System.out.println(a.get());`,["11\n11\n12","11\n12\n12","10\n11\n12","11\n11\n11"],"`incrementAndGet` збільшує до 11 й повертає 11. `getAndIncrement` повертає старе 11, а значення стає 12. `get` показує 12."),
F("Створи лічильник, збільш його на 1 та додай ще 4.",`AtomicInteger n = new AtomicInteger(0);
n.[[0]]();
n.[[1]](4);
System.out.println(n.get());`,["incrementAndGet","addAndGet"],["increment","add","plus"],"`incrementAndGet()` без аргументів додає 1, `addAndGet(4)` додає 4. Вийде 5."),
F("Запусти потік, дочекайся його й надрукуй прапорець, який бачать усі потоки.",`static [[0]] boolean done = false;
Thread t = new Thread(() -> { done = true; });
t.[[1]]();
t.[[2]]();
System.out.println(done);`,["volatile","start","join"],["synchronized","finish","await"],"`volatile` стосується змінної, `synchronized` на поле не ставлять. `start` запускає потік, `join` чекає його завершення."),
R("Склади код: потік додає 5 до лічильника, main чекає й друкує.",['AtomicInteger n = new AtomicInteger();','Thread t = new Thread(() -> n.addAndGet(5));','t.start();','t.join();','System.out.println(n.get());'],"Потік треба створити, запустити, дочекатися, і лише потім читати результат."),
T("Впиши слово, щоб метод `inc` одночасно виконував лише один потік.",`static int n = 0;
static [[0]] void inc() { n++; }`,["synchronized"],"`synchronized` пускає в метод одного потоку за раз, тож `n++` не розірветься."),
T("Впиши виклик, що збільшує лічильник на 1 і повертає нове значення (8).",`AtomicInteger n = new AtomicInteger(7);
int x = n.[[0]];
System.out.println(x);`,["incrementAndGet()","addAndGet(1)"],"`incrementAndGet()` спершу додає, потім повертає нове значення 8. Той самий результат дасть `addAndGet(1)`."),
B(null,['AtomicInteger n = new AtomicInteger(0);','n.incrementAndGet();','n++;','System.out.println(n.get());'],2,"`AtomicInteger` це об'єкт, а не число, тому оператор `++` до нього не застосовується. Потрібен `incrementAndGet()`."),
O(`AtomicInteger a = new AtomicInteger();
Thread t1 = new Thread(() -> { for (int i = 0; i < 500; i++) a.incrementAndGet(); });
Thread t2 = new Thread(() -> { for (int i = 0; i < 300; i++) a.addAndGet(2); });
t1.start(); t2.start();
t1.join(); t2.join();
System.out.println(a.get());`,["1100","800","500","Результат щоразу різний"],"Перший потік додає 500 разів по 1, це 500. Другий додає 300 разів по 2, це 600. Усі дії неподільні, а `join` чекає обох, тож завжди 1100.")
]},

{unit:15, after:'15-n0', key:'15-n1', title:'CompletableFuture: supplyAsync, thenApply, join',
learn:[
K("Квитанція на майбутню каву","Ти робиш замовлення і отримуєш квитанцію. Каву ще готують, але ти вже вільний: можеш займатися справами, а потім забрати напій за квитанцією. `CompletableFuture<T>` і є такою квитанцією на результат типу `T`, який з'явиться пізніше. `supplyAsync(() -> ...)` віддає роботу в інший потік і одразу повертає квитанцію. Метод `join()` чекає, поки результат готовий, і повертає його.",`CompletableFuture<String> f = CompletableFuture.supplyAsync(() -> "latte");
System.out.println(f.join());`,"latte"),
K("thenApply: обробка результату","`thenApply` схожий на `map` у потоках: коли результат буде готовий, перетвори його функцією, а на виході знову квитанція. Є ще `thenAccept`: вона лише користується результатом (наприклад, друкує) і нічого не повертає.",`CompletableFuture<Integer> f = CompletableFuture.supplyAsync(() -> "mocha").thenApply(String::length);
System.out.println(f.join());
CompletableFuture.supplyAsync(() -> "tea").thenAccept(s -> System.out.println("got " + s)).join();`,"5\ngot tea"),
K("Ланцюжок крок за кроком","Етапи можна нанизувати один на інший, як стадії приготування кави. Кожен наступний етап отримує результат попереднього. Тут: `supplyAsync` дає 10, перший `thenApply` робить 10 + 5 = 15, другий робить 15 * 2 = 30, а `join` приносить 30. Порядок етапів завжди той, що в коді, тож результат передбачуваний.",`CompletableFuture<Integer> f = CompletableFuture
    .supplyAsync(() -> 10)
    .thenApply(x -> x + 5)
    .thenApply(x -> x * 2);
System.out.println(f.join());`,"30"),
K("thenCombine: об'єднуємо дві квитанції","Дві незалежні роботи можуть виконуватися одночасно, наприклад, молоти зерно й гріти молоко. Коли обидві готові, `thenCombine(інша, (x, y) -> ...)` зводить їхні результати докупи. Отже, першу квитанцію викликаємо, другу передаємо в аргументі, а лямбда отримує обидва значення.",`CompletableFuture<Integer> a = CompletableFuture.supplyAsync(() -> 3);
CompletableFuture<Integer> b = CompletableFuture.supplyAsync(() -> 4);
System.out.println(a.thenCombine(b, (x, y) -> x + y).join());`,"7"),
K("Пастка: помилки й очікування","Якщо код усередині `supplyAsync` зламається, помилка не з'явиться одразу: вона сховається в квитанції й вистрибне лише на `join()` як `CompletionException`. Захист: `exceptionally(e -> запас)` підставить запасне значення замість помилки. І ще: якщо головний потік завершиться, не викликавши `join`, асинхронна робота може не встигнути.",`CompletableFuture<Integer> f = CompletableFuture.supplyAsync(() -> 10 / 0);
System.out.println(f.exceptionally(e -> -1).join());`,"-1")
],

K("JOIN ... ON",
"Після `JOIN` пишемо другу таблицю, а після `ON` умову зв'язку: у замовлення є `client_id`, у клієнта є `id`. Для Анни (id 1) знайшлося 2 замовлення, для Богдана одне, для Олени жодного, тому її в результаті немає.",

["Нічого не змінилося: обидва UPDATE скасовано","Збережено тільки перший UPDATE","Збережено обидва UPDATE","Зависла транзакція, доки не закриють програму"],
"Другий UPDATE кидає SQLException, і commit() не викликається. Спрацьовує rollback(), який скасовує і другий, і вже виконаний перший UPDATE.",

]},

{unit:18, after:'18-0', key:'18-n0', title:"Dependency Injection: @Component, @Autowired, конструктор", learn:[
K("Навіщо потрібен Dependency Injection",
"Бариста потребує кавомашини. Він може сам піти й купити її, а може отримати від кав'ярні вже готову. Dependency Injection (DI) це друге: залежності (те, без чого клас не працює) передають класу ззовні, а не створюють усередині. Тоді кавомашину легко замінити, наприклад на підставну в тесті.",
null,null),
K("Без DI і з DI",
"Коли клас сам робить `new`, він жорстко прив'язаний до конкретної залежності. Коли залежність приходить через конструктор, клас про неї лише знає, що вона є, а хто саме її створив, йому байдуже.",
`class Barista {
    private final EspressoMachine machine = new EspressoMachine();
}

class Barista {
    private final EspressoMachine machine;
    Barista(EspressoMachine machine) { this.machine = machine; }
}`,null),
K("@Component: Spring керує об'єктом",
"Анотація `@Component` над класом каже Spring: «створи об'єкт цього класу сам і зберігай у себе». Такі об'єкти називають бінами (bean). Під час запуску Spring знаходить усі класи з `@Component` і створює по одному бін.",
`@Component
class EspressoMachine {
    // Spring створить один такий об'єкт
}`,null),
K("@Autowired і конструктор",
"Коли Spring створює `Barista`, він дивиться на конструктор, бачить параметр `EspressoMachine` і сам підставляє туди готовий бін. Анотація `@Autowired` на конструкторі прямо про це просить (якщо конструктор єдиний, у нових версіях Spring вона не обов'язкова).",
`@Component
class Barista {
    private final EspressoMachine machine;

    @Autowired
    Barista(EspressoMachine machine) {
        this.machine = machine;
    }
}`,null),
K("Типова пастка: Spring бачить лише своє",
"Spring підставить лише те, що сам створив. Якщо над класом немає `@Component`, бін не з'явиться, і програма не запуститься з помилкою «не знайдено біна». Те саме, якщо зробити `new Barista(...)` вручну: такий об'єкт Spring не знає й нічого в нього не підставить. А якщо підходящих бінів два, Spring теж не вгадає, який брати.",
`class EspressoMachine { }      // немає @Component

@Component
class Barista {
    Barista(EspressoMachine m) { }
}`,"Помилка запуску: Spring не знайшов біна EspressoMachine"),
], ex:[
C("Що таке Dependency Injection?",
["Клас отримує потрібні залежності ззовні, а не створює їх сам","Клас копіює код іншого класу в себе","Клас успадковує всі методи від Spring","Клас створює всі об'єкти у своєму конструкторі"],

C("Що тут погано з погляду DI?",
["Barista сам створює кавомашину і жорстко прив'язаний до неї","Поле machine не може бути final","Клас не має методів","Назва класу занадто коротка"],
"Рядок new EspressoMachine() усередині класу не дозволяє підставити іншу машину, наприклад підставну для тесту.",
`class Barista {
    private final EspressoMachine machine = new EspressoMachine();

C("Що робить анотація @Component над класом?",
["Каже Spring створити об'єкт цього класу й керувати ним","Створює таблицю в базі даних","Запускає клас як тест","Робить усі поля класу static"],
"@Component позначає клас як бін: Spring знайде його при запуску, створить об'єкт і підставлятиме куди потрібно."),
F("Заповни пропуски: Cafe має створюватися Spring і отримати Barista через конструктор.",
`[[0]]

"@Component робить клас бінам, а @Autowired на конструкторі просить Spring підставити параметр."),
F("Заповни пропуски в конструкторі, щоб залежність прийшла ззовні й збереглася в полі.",
`@Component

R("Збери клас Barista, який отримує кавомашину через конструктор.",
["@Component","class Barista {","    private final EspressoMachine machine;","    Barista(EspressoMachine machine) {","        this.machine = machine;","    }","}"],
"Спершу анотація й заголовок класу, потім поле, а за ним конструктор, який це поле заповнює."),
T("Допиши назву анотації, щоб Spring створив об'єкт цього класу.",
`@[[0]]

"@Component робить клас бінам, який створює Spring."),
T("Допиши анотацію, якою просимо Spring підставити параметри конструктора.",
`@[[0]]
Barista(EspressoMachine machine) {

C("Дві різні кавомашини мають @Component і реалізують інтерфейс Machine. Що станеться на старті?",
["Помилка: Spring не знає, який із двох бінів підставити","Spring візьме першу за алфавітом","Spring створить третю, порожню машину","Нічого, у Barista потрапить null"],
"Для параметра Machine підходять два біни, і Spring не вирішує за тебе. Треба явно вказати, який саме потрібен.",
`interface Machine { }

C("Що станеться під час запуску застосунку?",
["Помилка: Spring не знайшов біна Barista для Cafe","Усе запуститься, Barista буде створено автоматично","Cafe створиться, а в barista буде null","Помилка компіляції в рядку з Cafe"],
"У Barista немає @Component, тому Spring не зробив його бінам. Коли Cafe просить Barista у конструкторі, підставляти нічого, і запуск зупиняється з помилкою.",
`class Barista { }

@Component

{unit:18, after:'18-1', key:'18-n1', title:"Spring Data JPA: @Entity, репозиторій", learn:[

null,null),
K("@Entity і @Id: клас як таблиця",

`@Entity
public class Drink {

}`,null),

`public interface DrinkRepository
        extends JpaRepository<Drink, Long> {
}`,null),
K("Готові методи в дії",
"Репозиторій уже має `save` (зберегти), `findById` (знайти за ключем), `findAll`, `count` і `deleteById`. Розберемо по кроках. Після першого `save` в базі один рядок, і йому видано id. Після другого рядків два. `findById` повертає `Optional`, бо рядка з таким id може й не бути.",
`repo.save(new Drink("Лате"));
repo.save(new Drink("Еспресо"));

K("Типова пастка: Optional і назви методів",

`Drink d = repo.findById(1L).get();        // пряме .get() ризиковано

], ex:[

F("Заповни пропуски: клас стає таблицею, а id його ключем.",
`@[[0]]

    @[[1]]
    private Long id;

F("Заповни пропуски: репозиторій для Drink із ключем Long.",

T("Допиши метод, що шукає напій за ключем.",

{unit:19, after:'19-0', key:'19-n0', title:"Патерни: Singleton, Factory, Builder", learn:[
K("Навіщо потрібні патерни",
"Патерн це перевірений рецепт розв'язання задачі, яка постійно повторюється. У кав'ярні така сама логіка: одна каса на всіх (Singleton), бариста готує напій за назвою (Factory), а складне замовлення збирають крок за кроком (Builder). Нижче розберемо їх по черзі.",
null,null),
K("Singleton: об'єкт тільки один",
"Іноді об'єкт має бути єдиним, як каса. Для цього конструктор робимо `private`, щоб ніхто не зробив `new` ззовні, а єдиний об'єкт зберігаємо в `static` полі й віддаємо через `getInstance()`. Перший виклик створює об'єкт, наступні повертають його ж.",
`class Register {
    private static Register instance;
    int total;
    private Register() { }
    static Register getInstance() {
        if (instance == null) instance = new Register();
        return instance;
    }
}`,null),
K("Factory: клас вирішує, що створити",
"Фабрика це метод, який за параметром сам вирішує, який об'єкт повернути. Той, хто викликає, не пише `new` і не знає про конкретні класи: йому достатньо інтерфейсу `Drink`.",
`interface Drink { String name(); }
class Latte implements Drink { public String name() { return "Лате"; } }
class Espresso implements Drink { public String name() { return "Еспресо"; } }
class DrinkFactory {
    static Drink make(String t) { return t.equals("latte") ? new Latte() : new Espresso(); }
}
System.out.println(DrinkFactory.make("latte").name());`,"Лате"),
K("Builder: збираємо об'єкт крок за кроком",
"Коли в об'єкта багато необов'язкових налаштувань, зручно збирати його ланцюжком. Кожен метод-налаштування змінює поле й повертає `this`, тому наступний виклик можна дописати одразу. Наприкінці `build()` видає результат. Не вказане залишається за замовчуванням.",
`class OrderBuilder {
    private String drink = "кава";
    private int sugar = 0;
    OrderBuilder drink(String d) { drink = d; return this; }
    OrderBuilder sugar(int s) { sugar = s; return this; }
    String build() { return drink + ", цукор: " + sugar; }
}
System.out.println(new OrderBuilder().drink("лате").sugar(2).build());`,"лате, цукор: 2"),
K("Типова пастка: Singleton ділить стан на всіх",
"Усі змінні, що отримали `getInstance()`, посилаються на один об'єкт. Тому зміна через одну видна через іншу, а `==` між ними дає `true`. Це зручно для каси, але небезпечно, якщо забути, що копії немає.",
`Register a = Register.getInstance();
Register b = Register.getInstance();
a.total += 50;
b.total += 30;
System.out.println(a.total + " " + (a == b));`,"80 true"),
], ex:[
C("Який патерн гарантує, що в програмі існує лише один об'єкт класу?",
["Singleton","Builder","Factory","Iterator"],
"Саме для цього придумано Singleton: єдиний екземпляр і єдина точка доступу до нього."),
C("Навіщо в Singleton конструктор роблять private?",
["Щоб ніхто ззовні не міг створити ще один об'єкт через new","Щоб клас не можна було скомпілювати","Щоб об'єкт став швидшим","Щоб метод getInstance не був потрібен"],
"Якби конструктор був відкритим, будь-хто створив би другий об'єкт, і «єдиність» зникла б."),
O(`interface Drink { String name(); }
class Tea implements Drink { public String name() { return "чай"; } }
class Coffee implements Drink { public String name() { return "кава"; } }
class Maker {
    static Drink make(int sugar) { return sugar > 0 ? new Tea() : new Coffee(); }
}
System.out.println(Maker.make(0).name() + " " + Maker.make(2).name());`,
["кава чай","чай кава","кава кава","чай чай"],
"make(0): умова sugar > 0 хибна, тому Coffee. make(2): умова правдива, тому Tea. Виходить «кава чай»."),
F("Заповни пропуски, щоб клас став Singleton.",
`class Register {
    private [[0]] Register instance;
    private [[1]]() { }
    static Register getInstance() {
        if (instance == null) instance = new Register();
        return instance;
    }
}`,["static","Register"],["final","int","abstract"],
"Єдиний об'єкт зберігаємо в static-полі, а конструктор (його ім'я збігається з назвою класу) робимо private."),
F("Заповни пропуски у ланцюжку Builder: цукор і готовий результат. Методи в OrderBuilder: drink, sugar, build.",
`String s = new OrderBuilder()
    .drink("лате")
    .[[0]](2)
    .[[1]]();`,["sugar","build"],["get","new","create"],

R("Збери метод-фабрику: за рядком повертає чай або каву.",
["static Drink make(String type) {","    if (type.equals(\"tea\")) {","        return new Tea();","    }","    return new Coffee();","}"],
"Спершу перевіряємо випадок для чаю й одразу повертаємо його. Усе інше потрапляє у return після if."),
T("Допиши модифікатор, щоб ніхто ззовні не міг зробити new Register().",
`[[0]] Register() { }`,["private"],
"private закриває конструктор усім, крім самого класу, і Singleton лишається єдиним."),
T("Допиши метод, який завершує Builder і повертає готовий результат.",
`String order = new OrderBuilder().drink("лате").[[0]]();`,["build"],
"Під кінець ланцюжка завжди викликають метод, що видає готовий об'єкт. У нашому Builder це build()."),
B("У класу Register конструктор private. Знайди рядок, який не скомпілюється.",[
"Register a = Register.getInstance();",
"Register b = new Register();",

const GITTERMS=[
{t:'Репозиторій',c:'Git',d:'Тека проєкту, за якою стежить Git. Усередині є прихована тека .git з усією історією змін.',ex:'$ git init',k:['стежить','.git','історією'],s:'Це вся кав\'ярня разом із книгою замовлень: і сьогоднішнє меню, і записи про всі його зміни.'},
{t:'Коміт',c:'Git',d:'Збережений знімок проєкту з коротким повідомленням. Коміти складають історію, до якої можна повернутися.',ex:'$ git commit -m "Add latte"',k:['знімок','повідомленням','історію'],s:'Це знімок меню на певний день: пізніше можна подивитися, яким воно було.'},
{t:'Гілка',c:'Git',d:'Окрема лінія комітів. У гілці можна пробувати нове й не чіпати головну лінію, поки робота не готова.',ex:'$ git switch -c new-drink',k:['лінія','нове','головну'],s:'Це чернетка рецепта: експериментуєш у ній, а основне меню лишається недоторканим.'},
{t:'HEAD',c:'Git',d:'Це вказівник на поточний коміт, зазвичай через поточну гілку. Показує, де ти зараз в історії.',ex:'$ git show HEAD',k:['вказівник','поточний','гілку'],s:'Це закладка в книзі замовлень: показує сторінку, на якій ти зараз.'},
{t:'Staging area',c:'Git',d:'Проміжна зона (її ще звуть індексом), куди кладуть зміни перед комітом. Так обирають, які саме зміни потраплять у наступний знімок.',ex:'$ git add menu.txt',k:['індексом','зміни','комітом'],s:'Це піднос на барі: кладеш на нього лише те, що зараз віднесеш гостю.'},
{t:'Робоча тека',c:'Git',d:'Файли проєкту в тому вигляді, як вони лежать на диску просто зараз. Саме їх ти редагуєш, поки не додав зміни у staging area.',ex:null,k:['диску','редагуєш','staging area'],s:'Це робочий стіл бариста: тут усе в процесі, ще не відправлено в записи.'},
{t:'Remote',c:'Git',d:'Це копія репозиторію на іншому комп\'ютері або сервері, наприклад на GitHub. З нею обмінюються комітами.',ex:'$ git remote -v',k:['копія','сервері','GitHub'],s:'Це спільна книга замовлень у головному офісі: усі кав\'ярні звіряють з нею свої записи.'},
{t:'origin',c:'Git',d:'Типове ім\'я головного remote. Після git clone воно вказує на місце, звідки скопіювали проєкт. Це лише назва за звичаєм, її можна змінити.',ex:'$ git push origin main',k:['remote','clone','за звичаєм'],s:'Це підпис «головний офіс» на дверях: просто зручна назва, а не особлива магія.'},
{t:'clone',c:'Git',d:'Команда, яка копіює весь віддалений репозиторій на твій комп\'ютер разом з історією. Заодно налаштовує remote під назвою origin.',ex:'$ git clone https://github.com/user/cafe.git',k:['копіює','історією','origin'],s:'Це як отримати повну копію книги рецептів із головної кав\'ярні.'},
{t:'Fork',c:'Git',d:'Власна копія чужого репозиторію на GitHub. Її можна вільно змінювати, не чіпаючи оригінал.',ex:null,k:['копія','чужого','оригінал'],s:'Це твій примірник чужої книги рецептів: пишеш у ньому що хочеш, а оригінал цілий.'},
{t:'Pull request',c:'Git',d:'Це прохання на GitHub додати зміни зі своєї гілки в іншу, зазвичай у main. Колеги переглядають код і обговорюють його до злиття.',ex:null,k:['прохання','переглядають','злиття'],s:'Це записка шефу: «Я придумав новий напій, подивись і додай у меню».'},
{t:'Merge',c:'Git',d:'Операція злиття гілок: зміни однієї гілки переносяться в іншу. Якщо гілки розійшлися, Git створює спеціальний merge-коміт.',ex:'$ git merge new-drink',k:['злиття','розійшлися','merge-коміт'],s:'Це момент, коли рецепт із чернетки вносять в основне меню.'},
{t:'Конфлікт злиття',c:'Git',d:'Ситуація, коли в обох гілок змінено ті самі рядки, і Git не знає, яку версію лишити. У файлі з\'являються позначки <<<<<<<, ======= і >>>>>>>, а обрати потрібний варіант треба вручну.',ex:'$ git merge new-drink',k:['рядки','версію','вручну'],s:'Двоє бариста по-різному виправили той самий рядок рецепта, і шеф має вибрати, чия версія лишиться.'},
{t:'Rebase',c:'Git',d:'Перенесення комітів гілки поверх іншої гілки. Історія стає рівною лінією, але коміти отримують нові хеші.',ex:'$ git rebase main',k:['комітів','поверх','лінією'],s:'Це переписати свою чернетку так, ніби ти почав її вже після останніх змін у меню.'},
{t:'Fast-forward',c:'Git',d:'Злиття без нового коміту: якщо в main за цей час нічого не змінилося, Git просто пересуває вказівник гілки вперед.',ex:null,k:['без нового','main','вказівник'],s:'Це як просто пересунути закладку на кілька сторінок уперед, нічого не переписуючи.'},
{t:'Stash',c:'Git',d:'Тимчасова схованка для незакомічених змін. Робоча тека стає чистою, а зміни можна повернути пізніше.',ex:'$ git stash',k:['схованка','незакомічених','повернути'],s:'Це шухляда під баром: ховаєш недороблене замовлення, щоб швидко обслужити термінове.'},
{t:'Tag',c:'Git',d:'Постійна мітка на конкретному коміті, найчастіше для версій, наприклад v1.0. На відміну від гілки, вона не рухається.',ex:'$ git tag v1.0',k:['мітка','версій','гілки'],s:'Це наклейка «Меню весна 2026» на одній зі сторінок книги: вона лишається на місці.'},
{t:'.gitignore',c:'Git',d:'Файл зі списком шаблонів, які Git має ігнорувати: паролі, логи, зібрані файли. Він не діє на файли, які вже відстежуються.',ex:'$ echo "*.log" >> .gitignore',k:['шаблонів','ігнорувати','відстежуються'],s:'Це список на дверях комори: «Це не записуємо в книгу».'},
{t:'Diff',c:'Git',d:'Команда, яка показує різницю між версіями: які рядки додали, а які видалили. Без прапорців порівнює робочу теку зі staging area.',ex:'$ git diff',k:['різницю','рядки','прапорців'],s:'Це червоний і зелений маркер, яким шеф позначає, що змінилося в рецепті.'},
{t:'Хеш коміту',c:'Git',d:'Довгий унікальний ідентифікатор коміту з цифр і літер. Зазвичай достатньо перших семи символів.',ex:'$ git log --oneline',k:['унікальний','ідентифікатор','символів'],s:'Це номер чека: за ним точно знайдеш потрібне замовлення.'},
{t:'Upstream',c:'Git',d:'Гілка на remote, з якою пов\'язана твоя локальна гілка. Завдяки цьому git push і git pull працюють без додаткових аргументів.',ex:'$ git push -u origin main',k:['remote','пов\'язана','аргументів'],s:'Це постійний партнер: бариста знає, з ким звіряти записи, і не питає щоразу.'},
{t:'Fetch',c:'Git',d:'Команда, яка завантажує нові коміти з remote, але не змінює твою поточну гілку і файли. Після неї можна подивитися, що змінилось, і лише тоді зливати.',ex:'$ git fetch',k:['нові коміти','не змінює','зливати'],s:'Це подивитися свіжу книгу замовлень з головного офісу, не переписуючи свою.'},
{t:'Push',c:'Git',d:'Команда, яка відправляє твої локальні коміти на remote. Якщо там вже є чужі нові коміти, Git відмовить.',ex:'$ git push',k:['локальні','remote','відмовить'],s:'Це віднести свої записи в головний офіс, щоб колеги їх побачили.'},
{t:'Pull',c:'Git',d:'Скорочення для fetch і наступного злиття (merge). Завантажує зміни з remote й одразу додає їх у поточну гілку.',ex:'$ git pull',k:['fetch','злиття','поточну'],s:'Це отримати свіжі записи з офісу й одразу вклеїти їх у свою книгу.'},
{t:'switch і checkout',c:'Git',d:'switch перемикає на іншу гілку, а restore відновлює файли. Старий checkout вміє і те, і те, тому ним легко зробити не те, що задумано.',ex:'$ git switch main',k:['перемикає','відновлює','checkout'],s:'Це перейти до іншого столика з іншою чернеткою; старий checkout робив і це, і ще пів десятка речей.'},
{t:'Reset',c:'Git',d:'Команда, яка пересуває поточну гілку на інший коміт. З прапорцем --hard вона ще й стирає зміни в робочій теці, тож будь обережний.',ex:'$ git reset --hard HEAD~1',k:['пересуває','--hard','обережний'],s:'Це повернути книгу на кілька сторінок назад і викинути все, що дописано пізніше.'},
{t:'Revert',c:'Git',d:'Команда, яка створює новий коміт, що скасовує дію старого. Історія не переписується, тому це безпечний спосіб скасувати вже опублікований коміт.',ex:'$ git revert HEAD',k:['новий коміт','переписується','безпечний'],s:'Це не вирвати сторінку, а дописати нову: «Попередній запис скасовано».'},
{t:'Reflog',c:'Git',d:'Журнал усіх переміщень HEAD на твоєму комп\'ютері. Допомагає знайти «втрачені» коміти після reset чи rebase.',ex:'$ git reflog',k:['переміщень','втрачені','reset'],s:'Це камера на кухні: навіть якщо запис зник із книги, на записі видно, що було.'},
{t:'Cherry-pick',c:'Git',d:'Команда, яка бере один коміт з іншої гілки й повторює його в поточній. Корисна, коли потрібна одна правка, а не вся гілка.',ex:'$ git cherry-pick a1b2c3d',k:['один коміт','повторює','правка'],s:'Це перенести з чернетки в меню один рецепт, а решту не чіпати.'},
{t:'Blame',c:'Git',d:'Команда, яка показує, хто і в якому коміті востаннє змінив кожен рядок файлу. Допомагає зрозуміти, звідки взялася правка.',ex:'$ git blame menu.txt',k:['хто','востаннє','рядок'],s:'Це підпис біля кожного рядка рецепта: хто його писав востаннє.'},
{t:'Bisect',c:'Git',d:'Пошук коміту, який зламав код, діленням навпіл. Ти позначаєш коміти як good або bad, а Git швидко звужує діапазон.',ex:'$ git bisect start',k:['зламав','навпіл','good'],s:'Це як знайти день, коли кава стала гіркою: перевіряєш середину, потім половину половини.'},
{t:'Working tree clean',c:'Git',d:'Повідомлення git status про те, що в проєкті немає незакомічених змін і нових файлів. Нічого не треба додавати чи комітити.',ex:'$ git status',k:['git status','незакомічених','нових файлів'],s:'Це чистий стіл наприкінці зміни: усе записано, нічого не розкидано.'},
{t:'Restore',c:'Git',d:'Команда, яка відновлює файл зі staging area або коміту. З прапорцем --staged вона прибирає файл зі staging area, не чіпаючи його вміст.',ex:'$ git restore --staged menu.txt',k:['відновлює','--staged','вміст'],s:'Це зняти страву з підносу назад на стіл, нічого з неї не псуючи.'},
{t:'Detached HEAD',c:'Git',d:'Стан, коли HEAD вказує прямо на коміт, а не на гілку. Нові коміти тут легко втратити, тож для роботи спершу створи гілку.',ex:'$ git switch --detach HEAD~1',k:['коміт','гілку','втратити'],s:'Це гортати стару сторінку книги без закладки: дописав щось, а потім не знайдеш.'},
{t:'Untracked файл',c:'Git',d:'Файл, про який Git ще не знає, бо його жодного разу не додавали. У git status він видно в списку Untracked files.',ex:'$ git status',k:['не знає','додавали','Untracked'],s:'Це нова страва, якої ще немає в жодному меню: її спершу треба вписати.'},
{t:'Головна гілка (main)',c:'Git',d:'Назва основної гілки в більшості нових репозиторіїв. Раніше частіше її називали master. Саме тут лежить стабільна версія проєкту.',ex:'$ git switch main',k:['основної','master','стабільна'],s:'Це основне меню, яке бачать гості, а все недороблене лежить у чернетках.'},
{t:'Amend',c:'Git',d:'Прапорець --amend змінює останній коміт: можна виправити повідомлення або додати забуті файли. Коміт отримує новий хеш, тому не роби так з уже опублікованим.',ex:'$ git commit --amend -m "Add mocha"',k:['останній коміт','забуті','хеш'],s:'Це швидко виправити щойно написаний рядок у книзі, поки ніхто не встиг його переписати собі.'}
];

C('menu.txt у корені й sub/s.txt змінено. Що потрапить у staging area?',['Лише sub/s.txt, бо крапка означає поточну теку','Обидва файли, бо крапка означає весь проєкт','Лише menu.txt','Нічого, треба спершу git status'],'`git add .` додає зміни з поточної теки й глибше. `git add -A` бере весь проєкт, звідки б ти його не запустив.','$ cd sub\n$ git add .'),

const RX=new RegExp('(\\/\\/[^\\n]*)|("(?:\\\\.|[^"\\\\\\n])*")|(\'(?:\\\\.|[^\'\\\\\\n])\')|\\b('+KW+')\\b|\\b(\\d+(?:\\.\\d+)?)\\b|\\b([A-Z][A-Za-z0-9_]*)\\b','g');
function hl(src){
  let out='',last=0,m;RX.lastIndex=0;
  while((m=RX.exec(src))){
    out+=esc(src.slice(last,m.index));
    const t=m[1]?'com':(m[2]||m[3])?'str':m[4]?'kw':m[5]?'num':'ty';
    out+='<span class="t-'+t+'">'+esc(m[0])+'</span>';
    last=m.index+m[0].length;
  }
  return out+esc(src.slice(last));
}
function shuffle(a,avoidSame){
  const orig=a.slice();let r;let tries=0;
  do{r=orig.slice();for(let i=r.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[r[i],r[j]]=[r[j],r[i]];}tries++;}
  while(avoidSame&&r.length>1&&tries<12&&r.every((x,i)=>x===orig[i]));
  return r;
}

function norm(s){

}

function bumpStreak(){
  const r={froze:false,earned:false};

  return r;
}

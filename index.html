{unit:11, after:'11-0', key:'11-n0', title:'collect, groupingBy, joining, sorted',
learn:[
K("Збираємо потік назад","Уяви: бариста перебирає чергу замовлень, відкидає зайве, щось готує. Але наприкінці все треба поставити на піднос. Так і в `stream`: `filter` та `map` лише обробляють елементи, а щоб отримати готовий результат (список, рядок, мапу), потрібна завершальна операція `collect`.",`List<String> drinks = List.of("latte", "espresso", "mocha");
List<String> big = drinks.stream()
    .filter(d -> d.length() > 5)
    .collect(Collectors.toList());
System.out.println(big);`,"[espresso]"),
K("sorted: впорядковуємо","`sorted()` розставляє елементи за природним порядком: числа від меншого до більшого, рядки за абеткою. Якщо потрібен свій порядок, передай `Comparator`, наприклад `Comparator.comparing(String::length)` сортує за довжиною. Важливо: `sorted` не міняє початковий список, а повертає новий потік.",`List<String> d = List.of("mocha", "latte", "espresso", "cap");
System.out.println(d.stream().sorted().toList());
System.out.println(d.stream().sorted(Comparator.comparing(String::length)).toList());`,"[cap, espresso, latte, mocha]\n[cap, mocha, latte, espresso]"),
K("joining: склеюємо в один рядок","Іноді результат має бути не списком, а одним рядком, як чек із позиціями через кому. Для цього є `Collectors.joining(роздільник)`. Працює лише з потоком рядків. Можна додати початок і кінець: `joining(\", \", \"[\", \"]\")`.",`String s = Stream.of("latte", "mocha", "tea")
    .map(String::toUpperCase)
    .collect(Collectors.joining(", "));
System.out.println(s);`,"LATTE, MOCHA, TEA"),
K("groupingBy: розкладаємо по купках","`groupingBy(функція)` розкладає елементи по купках: функція визначає ключ, а всі елементи з однаковим ключем потрапляють в один список. Результат: `Map<ключ, List<елемент>>`. Крок за кроком для довжини слова: latte дає ключ 5, tea дає 3, mocha дає 5, cap дає 3. Купка 3 отримує [tea, cap], купка 5 отримує [latte, mocha]. Другий аргумент змінює те, що лежить у купці: `Collectors.counting()` рахує елементи.",`List<String> d = List.of("latte", "tea", "mocha", "cap");
System.out.println(d.stream().collect(Collectors.groupingBy(String::length)));
System.out.println(d.stream().collect(Collectors.groupingBy(String::length, Collectors.counting())));`,"{3=[tea, cap], 5=[latte, mocha]}\n{3=2, 5=2}"),
K("Пастка: оригінал не змінюється","Потік нічого не змінює у вихідній колекції, він лише читає її. Тому `d.stream().sorted()` без збереження результату марний: список лишається таким самим. А ще потік можна використати лише один раз: друга завершальна операція над тим самим потоком дасть `IllegalStateException`. Результат завжди треба кудись покласти.",`List<String> d = new ArrayList<>(List.of("b", "c", "a"));
d.stream().sorted().toList();
System.out.println(d);
List<String> s = d.stream().sorted().toList();
System.out.println(s);`,"[b, c, a]\n[a, b, c]")
],
ex:[
C("Яка головна роль `collect` у потоці?",["Збирає елементи потоку назад у колекцію, рядок чи мапу","Відфільтровує зайві елементи","Перетворює кожен елемент на інший","Запускає потік у новому треді"],"`filter` і `map` обробляють елементи, а `collect` завершує конвеєр і формує готовий результат."),
O(`List<Integer> n = List.of(5, 2, 8, 1);
System.out.println(n.stream().sorted().toList());`,["[1, 2, 5, 8]","[5, 2, 8, 1]","[8, 5, 2, 1]","[1, 5, 2, 8]"],"`sorted()` без аргументів ставить числа від меншого до більшого."),
C("Який збирач склеює рядки з роздільником у єдиний рядок?",["Collectors.joining(\", \")","Collectors.toList()","Collectors.counting()","Collectors.groupingBy(\", \")"],"`joining` єдиний з цих збирачів повертає один `String`, склеєний через роздільник.",null,true),
O(`String s = Stream.of("tea", "latte", "cap")
    .filter(x -> x.length() == 3)
    .collect(Collectors.joining("-"));
System.out.println(s);`,["tea-cap","tea-latte-cap","latte","tea, cap"],"`filter` залишає tea та cap (довжина 3), `joining(\"-\")` склеює їх через дефіс."),
F("Перетвори кожне ім'я на великі літери й збери в список.",`List<String> r = names.stream()
    .[[0]](String::toUpperCase)
    .[[1]](Collectors.toList());`,["map","collect"],["filter","sorted","joining"],"`map` перетворює кожен елемент, а `collect` збирає результат у список. `filter` чекає умову, а не перетворення."),
F("Порахуй, скільки разів зустрічається кожне слово.",`Map<String, Long> c = words.stream()
    .collect(Collectors.[[0]](w -> w, Collectors.[[1]]()));`,["groupingBy","counting"],["joining","toList","sorted"],"`groupingBy` розкладає по ключах, а другий аргумент `counting()` замість списку кладе в купку кількість елементів."),
R("Склади код: відсортуй меню та склей через риску.",['List<String> menu = List.of("mocha", "tea", "latte");','String r = menu.stream()','    .sorted()','    .collect(Collectors.joining(" | "));','System.out.println(r);'],"Спочатку джерело (`stream()`), потім проміжна `sorted()`, і лише наприкінці завершальна `collect`."),
T("Допиши завершальну операцію, яка збере результат у список.",`List<String> up = names.stream().map(String::toUpperCase).[[0]];`,["collect(Collectors.toList())","toList()","collect(Collectors.toUnmodifiableList())"],"Потік не є списком, тому в кінці потрібен `collect(Collectors.toList())` або коротше `toList()`."),
T("Відсортуй числа від більшого до меншого. Впиши аргумент для `sorted`.",`List<Integer> n = List.of(3, 9, 1);
List<Integer> d = n.stream().sorted([[0]]).toList();`,["Comparator.reverseOrder()","Collections.reverseOrder()","(a, b) -> b - a","(a, b) -> b.compareTo(a)","(a,b)->b-a"],"Зворотний порядок задає `Comparator.reverseOrder()`. Підійде й лямбда, яка порівнює навпаки."),
B(null,['List<String> d = List.of("tea", "latte");','String s = d.stream().collect(Collectors.joining(", "));','List<String> r = d.stream().collect(Collectors.joining(", "));','System.out.println(s);'],2,"`joining` повертає один `String`, його не можна покласти у `List<String>`."),
O(`List<String> d = List.of("latte", "tea", "mocha", "cap", "espresso");
Map<Integer, List<String>> m = d.stream()
    .sorted()
    .collect(Collectors.groupingBy(String::length));
System.out.println(m);`,["{3=[cap, tea], 5=[latte, mocha], 8=[espresso]}","{3=[tea, cap], 5=[latte, mocha], 8=[espresso]}","{5=[latte, mocha], 3=[cap, tea], 8=[espresso]}","{3=[cap, tea, latte]}"],"Спочатку `sorted` ставить слова за абеткою: cap, espresso, latte, mocha, tea. Потім `groupingBy` розкладає по довжині й зберігає цей порядок усередині кожної купки.")
]},

{unit:11, after:'11-n0', key:'11-n1', title:'Optional: безпечно працюємо з null',
learn:[
K("Навіщо потрібен Optional","Клієнт просить напій, якого немає в меню. Якщо бариста мовчки подасть порожній стакан (`null`), клієнт не зрозуміє, що сталося, а програма впаде з `NullPointerException`. `Optional` це коробочка з написом «тут може бути значення, а може й не бути». Ти бачиш це у типі й змушений обробити обидва випадки.",`String s = null;
System.out.println(s.length());`,null),
K("Як створити Optional","Є три способи. `Optional.of(x)` для значення, яке точно не `null` (якщо передати `null`, буде помилка). `Optional.empty()` для порожньої коробочки. `Optional.ofNullable(x)` коли не знаєш: поверне порожню, якщо `x` дорівнює `null`.",`Optional<String> a = Optional.of("latte");
Optional<String> b = Optional.empty();
System.out.println(a);
System.out.println(b);`,"Optional[latte]\nOptional.empty"),
K("Як дістати значення","Найзручніше віддати запасний варіант: `orElse(запас)` поверне вміст або запас, якщо коробочка порожня. `ifPresent(дія)` виконає дію, лише коли значення є. `isPresent()` просто відповідає true або false.",`Optional<String> a = Optional.of("latte");
Optional<String> b = Optional.empty();
System.out.println(a.orElse("none"));
System.out.println(b.orElse("none"));
a.ifPresent(x -> System.out.println("got " + x));`,"latte\nnone\ngot latte"),
K("Optional разом зі stream","Багато операцій потоку повертають `Optional`, бо результату може й не бути. Наприклад, `findFirst()` бере перший елемент, а якщо потік порожній, дає порожню коробочку. Метод `map` працює й на `Optional`: перетворює вміст, якщо він є, а порожню коробочку лишає порожньою. Тут для `b` фільтр нічого не знайшов, тож `map` пропускається, і спрацьовує `orElse`.",`List<String> d = List.of("tea", "latte", "mocha");
Optional<String> a = d.stream().filter(x -> x.length() > 4).findFirst();
Optional<String> b = d.stream().filter(x -> x.length() > 9).findFirst();
System.out.println(a.map(String::toUpperCase).orElse("none"));
System.out.println(b.map(String::toUpperCase).orElse("none"));`,"LATTE\nnone"),
K("Пастка: get() на порожньому","Метод `get()` на порожньому `Optional` кидає `NoSuchElementException`, тобто ти просто змінюєш один збій на інший. Тому спершу перевір `isPresent()` або, ще краще, користуйся `orElse`, `map`, `ifPresent`. І пам'ятай: `Optional.of(null)` теж одразу падає, для невідомого значення бери `ofNullable`.",`Optional<String> e = Optional.empty();
System.out.println(e.isPresent());
System.out.println(e.orElse("none"));`,"false\nnone")
],
ex:[
C("Навіщо в Java придумали `Optional`?",["Щоб у типі було видно, що значення може бути відсутнім, і не впасти на `null`","Щоб прискорити роботу програми","Щоб замінити всі масиви","Щоб значення ніколи не можна було змінити"],"`Optional` робить можливу відсутність значення явною: компілятор і читач бачать, що її треба обробити."),
O(`Optional<String> o = Optional.of("mocha");
System.out.println(o);`,["Optional[mocha]","mocha","Optional.empty","Optional(mocha)"],"Рядкове представлення непорожнього `Optional` має вигляд `Optional[значення]`."),
C("Що станеться при виклику `Optional.of(null)`?",["Програма кине NullPointerException","Створиться порожній Optional","Поверниться null","Код не скомпілюється"],"`of` вимагає значення, що точно існує. Для можливого `null` призначений `ofNullable`."),
O(`Optional<String> o = Optional.empty();
System.out.println(o.orElse("tea"));`,["tea","Optional.empty","null","Нічого не виведе"],"Коробочка порожня, тому `orElse` повертає запасне значення tea."),
F("Зроби безпечний `Optional` зі змінної, яка може бути `null`, і дістань значення із запасом.",`String name = null;
Optional<String> o = Optional.[[0]](name);
String r = o.[[1]]("guest");
System.out.println(r);`,["ofNullable","orElse"],["empty","get","isPresent"],"`ofNullable` дозволяє `null` і дає порожню коробочку. Далі `orElse` підставляє guest."),
F("Знайди перший напій на літеру m і виведи його, якщо він є.",`Optional<String> f = d.stream().filter(x -> x.startsWith("m")).[[0]]();
f.[[1]](x -> System.out.println(x));`,["findFirst","ifPresent"],["count","orElse","map"],"`findFirst` повертає `Optional`, а `ifPresent` виконає дію лише тоді, коли значення справді є."),
R("Збери код: знайди перше довге слово або виведи none.",['List<String> d = List.of("tea", "mocha");','Optional<String> f = d.stream().filter(x -> x.length() > 3).findFirst();','String s = f.orElse("none");','System.out.println(s);'],"Спочатку список, потім пошук з `Optional`, потім дістаємо значення із запасом, і лише тоді друкуємо."),
T("Допиши вираз, який поверне значення з `o` або рядок none, якщо `o` порожній.",`Optional<String> o = Optional.empty();
String r = [[0]];
System.out.println(r);`,["o.orElse(\"none\")","o.orElseGet(() -> \"none\")"],"`orElse` віддає вміст або запасне значення, тож `NullPointerException` тут неможливий."),
T("Допиши метод, який відповідає true, якщо в коробочці є значення.",`Optional<String> o = Optional.of("tea");
boolean has = o.[[0]]();`,["isPresent"],"`isPresent()` повертає true для непорожнього `Optional` і false для порожнього."),
B(null,['Optional<String> a = Optional.of("tea");','String s = a.orElse("none");','int n = a.map(String::length);','System.out.println(s + n);'],2,"`map` на `Optional` повертає знову `Optional` (тут `Optional<Integer>`), а не `int`. Треба дописати `.orElse(0)`."),
O(`List<String> d = List.of("tea", "latte", "mocha");
Optional<String> x = d.stream().filter(s -> s.startsWith("m")).findFirst();
Optional<String> y = d.stream().filter(s -> s.startsWith("z")).findFirst();
System.out.println(x.map(String::length).orElse(-1));
System.out.println(y.map(String::length).orElse(-1));
System.out.println(y.isPresent());`,["5\n-1\nfalse","5\n-1\ntrue","mocha\n-1\nfalse","5\n0\nfalse"],"Для `x` знайдено mocha, `map` дає довжину 5. Для `y` слів на z немає, коробочка порожня, `map` пропускається, і `orElse` дає -1. `isPresent()` для `y` це false.")
]},

{unit:14, after:'14-1', key:'14-n0', title:'Wildcards і <T extends Comparable<T>>',
learn:[
K("Обмежений тип: T extends Comparable<T>","Уяви конкурс «найкращий напій»: брати участь можуть лише ті, кого можна порівняти між собою. Запис `<T extends Comparable<T>>` каже саме це: `T` може бути будь-яким типом, але тільки таким, що вміє порівнювати себе з іншим (має метод `compareTo`). Тоді один метод `max` працює і з числами, і з рядками.",`static <T extends Comparable<T>> T max(T a, T b) {
    return a.compareTo(b) >= 0 ? a : b;
}
System.out.println(max(3, 8));
System.out.println(max("tea", "latte"));`,"8\ntea"),
K("Навіщо потрібне extends","Без обмеження `T` може бути чим завгодно, навіть звичайним `Object`, а в нього немає `compareTo`. Компілятор не дозволить викликати метод, який він не гарантує. Слово `extends` у дужках `<>` і є гарантією. Сам `compareTo` повертає число: менше нуля, якщо перший менший; нуль, якщо рівні; більше нуля, якщо перший більший. Важливий лише знак.",`System.out.println("a".compareTo("b") < 0);
System.out.println("b".compareTo("a") > 0);
Integer x = 5;
System.out.println(x.compareTo(5));`,"true\ntrue\n0"),
K("Wildcard ?: будь-який тип","Є дивна річ: `Integer` це `Number`, але `List<Integer>` НЕ є `List<Number>`. Тому метод з параметром `List<Number>` не прийме список цілих. Знак питання `?` означає «список чого завгодно». З такого списку можна читати елементи як `Object`.",`static void printAll(List<?> list) {
    for (Object o : list) System.out.println(o);
}
printAll(List.of(1, 2));
printAll(List.of("a"));`,"1\n2\na"),
K("? extends: читаємо, не пишемо","`List<? extends Number>` означає «список Number або чогось успадкованого: Integer, Double...». Читати можна: кожен елемент точно хоча б `Number`. Крок за кроком для `sum(List.of(1, 2, 3))`: s=0, потім додаємо 1, 2, 3 і маємо 6.0. А от додати в такий список нічого не можна (крім null): компілятор не знає, чи це список Integer, чи Double, тож боїться покласти не те.",`static double sum(List<? extends Number> nums) {
    double s = 0;
    for (Number n : nums) s += n.doubleValue();
    return s;
}
System.out.println(sum(List.of(1, 2, 3)));
System.out.println(sum(List.of(1.5, 2.5)));`,"6.0\n4.0"),
K("? super: пишемо, але читати важко","`List<? super Integer>` означає «список Integer або будь-якого його предка: Number, Object». Туди безпечно додавати `Integer`, бо він підійде в кожен такий список. Зате читати можна лише як `Object`. Запам'ятай правило: джерело даних, з якого читаєш, це `extends`, а приймач, куди кладеш, це `super`.",`static void fill(List<? super Integer> list) {
    list.add(1);
    list.add(2);
}
List<Number> nums = new ArrayList<>();
fill(nums);
System.out.println(nums);`,"[1, 2]")
],
ex:[
C("Що означає запис `<T extends Comparable<T>>`?",["T може бути лише типом, об'єкти якого вміють порівнювати себе","T може бути будь-яким типом без обмежень","T мусить бути числом","T мусить бути рядком"],"Після `extends` стоїть умова: тип має мати `compareTo`, тоді метод може порівнювати елементи."),
O(`static <T extends Comparable<T>> T bigger(T a, T b) {
    return a.compareTo(b) > 0 ? a : b;
}
System.out.println(bigger("mocha", "latte"));
System.out.println(bigger(4, 4));`,["mocha\n4","latte\n4","mocha\n0","latte\n0"],"Рядок mocha за абеткою після latte, тож він більший. Для 4 та 4 `compareTo` дає 0, умова `> 0` хибна, і повертається `b`, тобто теж 4."),
C("Є метод `static <T extends Comparable<T>> T min(T a, T b)`. Який виклик скомпілюється?",["min(2, 7)","min(new Object(), new Object())","min(new int[0], new int[1])","min(new ArrayList<>(), new ArrayList<>())"],"`Integer` вміє порівнювати себе, а `Object`, масиви та `ArrayList` не реалізують `Comparable`.",null,true),
O(`static double sum(List<? extends Number> nums) {
    double s = 0;
    for (Number n : nums) s += n.doubleValue();
    return s;
}
System.out.println(sum(List.of(2, 3)));
System.out.println(sum(List.of(0.5, 0.25)));`,["5.0\n0.75","5\n0.75","5.0\n0.5","23.0\n0.75"],"Метод повертає `double`. Для 2 та 3 це 5.0, для 0.5 та 0.25 це 0.75."),
F("Оголоси метод, який вибирає більше з двох значень.",`static <T [[0]] Comparable<T>> T maxOf(T a, T b) {
    return a.[[1]](b) > 0 ? a : b;
}`,["extends","compareTo"],["implements","equals","super","compare"],"У параметрі типу для обмеження пишуть `extends`, навіть якщо `Comparable` це інтерфейс. А порівняння дає `compareTo`, бо `equals` повертає boolean."),
F("Зроби метод, що приймає список чисел будь-якого виду (Integer, Double...) і лише читає його.",`static double total(List<[[0]] [[1]] Number> nums) {
    double s = 0;
    for (Number n : nums) s += n.doubleValue();
    return s;
}`,["?","extends"],["super","implements","T"],"`? extends Number` означає «Number або його нащадки», тож кожен елемент можна прочитати як `Number`. Із `super` цикл не скомпілюється."),
R("Склади метод, що повертає більший з двох елементів.",['static <T extends Comparable<T>> T max(T a, T b) {','    if (a.compareTo(b) > 0) return a;','    return b;','}'],"Спочатку заголовок з обмеженням, всередині умова, потім запасне повернення `b`, і закриваюча дужка."),
T("Впиши тип параметра так, щоб метод приймав список будь-чого й лише рахував його розмір.",`static int count(List<[[0]]> list) {
    return list.size();
}`,["?"],"Знак питання означає «список чогось невідомого», і для `size()` нам більше нічого не треба."),
T("Впиши тип параметра, щоб у метод можна було передати і List<Integer>, і List<Number>, і List<Object>, а всередині додавати цілі числа.",`static void put(List<[[0]]> list) {
    list.add(5);
}`,["? super Integer","?super Integer"],"`? super Integer` приймає список Integer та його предків, і в кожен з них безпечно додати Integer."),
B(null,['static <T> T bigger(T a, T b) {','    return a.compareTo(b) > 0 ? a : b;','}'],1,"Без `extends Comparable<T>` компілятор знає про `T` лише те, що це `Object`, а в `Object` немає `compareTo`."),
C("У методі параметр `List<? extends Number> nums`. Який рядок НЕ скомпілюється?",["nums.add(5);","Number n = nums.get(0);","for (Number x : nums) { }","int size = nums.size();"],"Із `? extends` читати можна, а додавати ні: компілятор не знає, чи це список Integer, Double чи ще чогось.",null,true)
]},

{unit:15, after:'15-1', key:'15-n0', title:'Гонка даних: volatile, AtomicInteger, synchronized',
learn:[
K("Що таке гонка даних","Дві бариста ведуть спільну лічильну дошку чашок. Обидва бачать число 5, обидва беруть крейду й пишуть 6. Було продано дві чашки, а на дошці лише на одну більше. Це і є race condition (гонка): результат залежить від того, хто встиг раніше. У програмі так само, якщо два потоки змінюють одну змінну без захисту. Код нижче в різні запуски може виводити різне число, не завжди 2000.",`static int n = 0;
Thread t1 = new Thread(() -> { for (int i = 0; i < 1000; i++) n++; });
Thread t2 = new Thread(() -> { for (int i = 0; i < 1000; i++) n++; });
t1.start();
t2.start();
t1.join();
t2.join();
System.out.println(n);`,null),
K("Чому n++ небезпечний","На вигляд `n++` одна дія, але для процесора це три кроки: прочитати значення, додати 1, записати назад. Якщо потоки перемішають кроки, одне додавання загубиться. Ось як це відбувається, коли обидва потоки зробили `n++` одночасно (n було 5):",`n = 5
Потік A: читає n, бачить 5
Потік B: читає n, бачить 5
Потік A: записує 5 + 1, тепер n = 6
Потік B: записує 5 + 1, тепер n = 6
Результат: 6, а мало бути 7`,null),
K("AtomicInteger: неподільна дія","`AtomicInteger` це число, яке змінюється одним неподільним кроком: ніхто не втрутиться посередині. Замість `n++` пиши `incrementAndGet()`. Є ще `get()` (прочитати), `addAndGet(k)` (додати k і повернути нове), `getAndIncrement()` (повернути старе й збільшити). Метод `join()` змушує головний потік дочекатися кінця потоку, тому ми читаємо результат лише коли всі закінчили. Тут завжди рівно 2000.",`AtomicInteger n = new AtomicInteger(0);
Runnable r = () -> { for (int i = 0; i < 1000; i++) n.incrementAndGet(); };
Thread t1 = new Thread(r);
Thread t2 = new Thread(r);
t1.start(); t2.start();
t1.join(); t2.join();
System.out.println(n.get());`,"2000"),
K("synchronized: один за раз","Інший спосіб: поставити біля цінного місця охоронця. Метод зі словом `synchronized` може виконувати лише один потік одночасно, решта чекають у черзі. Тому три кроки `n++` вже ніхто не розірве, і результат знову рівно 2000. Для складних дій з кількома змінними саме `synchronized` і потрібен, а `AtomicInteger` добре підходить для одного лічильника.",`static int n = 0;
static synchronized void inc() { n++; }
Runnable r = () -> { for (int i = 0; i < 1000; i++) inc(); };
Thread t1 = new Thread(r);
Thread t2 = new Thread(r);
t1.start(); t2.start();
t1.join(); t2.join();
System.out.println(n);`,"2000"),
K("volatile і пастка","`volatile` каже: ця змінна не кешується, кожен потік завжди бачить свіже значення. Це корисно для прапорців на кшталт `done`. Але `volatile` НЕ робить `n++` безпечним: три кроки читання, додавання й запису так само можуть перемішатися. Отже, `volatile` гарантує видимість, а `synchronized` та `AtomicInteger` ще й неподільність.",`static volatile boolean done = false;
Thread t = new Thread(() -> { done = true; });
t.start();
t.join();
System.out.println(done);`,"true")
],
ex:[
C("Що таке race condition (гонка даних)?",["Результат залежить від того, в якому порядку потоки встигли виконати свої кроки","Один потік працює швидше за інший","Програма виконується занадто повільно","Потік завершується з помилкою"],"Гонка виникає, коли кілька потоків без захисту змінюють спільні дані, і підсумок залежить від випадкового чергування."),
O(`static int total = 0;
Thread t = new Thread(() -> {

t.start();
t.join();

C("Два потоки роблять `n++` над спільною змінною `int n`. Що найпростіше виправить гонку?",["Замінити int на AtomicInteger і викликати incrementAndGet()","Замінити n++ на n = n + 1","Зробити змінну private","Додати слово final"],"`n = n + 1` це ті самі три кроки, а `AtomicInteger` робить збільшення неподільним."),
O(`AtomicInteger a = new AtomicInteger(10);

F("Створи лічильник, збільш його на 1 та додай ще 4.",`AtomicInteger n = new AtomicInteger(0);
n.[[0]]();
n.[[1]](4);
System.out.println(n.get());`,["incrementAndGet","addAndGet"],["increment","add","plus"],"`incrementAndGet()` без аргументів додає 1, `addAndGet(4)` додає 4. Вийде 5."),
F("Запусти потік, дочекайся його й надрукуй прапорець, який бачать усі потоки.",`static [[0]] boolean done = false;
Thread t = new Thread(() -> { done = true; });
t.[[1]]();
t.[[2]]();
System.out.println(done);`,["volatile","start","join"],["synchronized","finish","await"],"`volatile` стосується змінної, `synchronized` на поле не ставлять. `start` запускає потік, `join` чекає його завершення."),

T("Впиши слово, щоб метод `inc` одночасно виконував лише один потік.",`static int n = 0;

int x = n.[[0]];
System.out.println(x);`,["incrementAndGet()","addAndGet(1)"],"`incrementAndGet()` спершу додає, потім повертає нове значення 8. Той самий результат дасть `addAndGet(1)`."),
B(null,['AtomicInteger n = new AtomicInteger(0);','n.incrementAndGet();','n++;','System.out.println(n.get());'],2,"`AtomicInteger` це об'єкт, а не число, тому оператор `++` до нього не застосовується. Потрібен `incrementAndGet()`."),

{unit:15, after:'15-n0', key:'15-n1', title:'CompletableFuture: supplyAsync, thenApply, join',
learn:[
K("Квитанція на майбутню каву","Ти робиш замовлення і отримуєш квитанцію. Каву ще готують, але ти вже вільний: можеш займатися справами, а потім забрати напій за квитанцією. `CompletableFuture<T>` і є такою квитанцією на результат типу `T`, який з'явиться пізніше. `supplyAsync(() -> ...)` віддає роботу в інший потік і одразу повертає квитанцію. Метод `join()` чекає, поки результат готовий, і повертає його.",`CompletableFuture<String> f = CompletableFuture.supplyAsync(() -> "latte");
System.out.println(f.join());`,"latte"),
K("thenApply: обробка результату","`thenApply` схожий на `map` у потоках: коли результат буде готовий, перетвори його функцією, а на виході знову квитанція. Є ще `thenAccept`: вона лише користується результатом (наприклад, друкує) і нічого не повертає.",`CompletableFuture<Integer> f = CompletableFuture.supplyAsync(() -> "mocha").thenApply(String::length);
System.out.println(f.join());
CompletableFuture.supplyAsync(() -> "tea").thenAccept(s -> System.out.println("got " + s)).join();`,"5\ngot tea"),
K("Ланцюжок крок за кроком","Етапи можна нанизувати один на інший, як стадії приготування кави. Кожен наступний етап отримує результат попереднього. Тут: `supplyAsync` дає 10, перший `thenApply` робить 10 + 5 = 15, другий робить 15 * 2 = 30, а `join` приносить 30. Порядок етапів завжди той, що в коді, тож результат передбачуваний.",`CompletableFuture<Integer> f = CompletableFuture
    .supplyAsync(() -> 10)
    .thenApply(x -> x + 5)
    .thenApply(x -> x * 2);
System.out.println(f.join());`,"30"),
K("thenCombine: об'єднуємо дві квитанції","Дві незалежні роботи можуть виконуватися одночасно, наприклад, молоти зерно й гріти молоко. Коли обидві готові, `thenCombine(інша, (x, y) -> ...)` зводить їхні результати докупи. Отже, першу квитанцію викликаємо, другу передаємо в аргументі, а лямбда отримує обидва значення.",`CompletableFuture<Integer> a = CompletableFuture.supplyAsync(() -> 3);
CompletableFuture<Integer> b = CompletableFuture.supplyAsync(() -> 4);
System.out.println(a.thenCombine(b, (x, y) -> x + y).join());`,"7"),
K("Пастка: помилки й очікування","Якщо код усередині `supplyAsync` зламається, помилка не з'явиться одразу: вона сховається в квитанції й вистрибне лише на `join()` як `CompletionException`. Захист: `exceptionally(e -> запас)` підставить запасне значення замість помилки. І ще: якщо головний потік завершиться, не викликавши `join`, асинхронна робота може не встигнути.",`CompletableFuture<Integer> f = CompletableFuture.supplyAsync(() -> 10 / 0);
System.out.println(f.exceptionally(e -> -1).join());`,"-1")
],
ex:[
C("Що робить `CompletableFuture.supplyAsync(() -> ...)`?",["Запускає код в іншому потоці й одразу повертає квитанцію на майбутній результат","Зупиняє програму, поки код не виконається","Створює новий клас","Видаляє результат"],"`supplyAsync` не чекає: робота йде фоном, а ти отримуєш `CompletableFuture`, з якого пізніше можна забрати результат."),
O(`CompletableFuture<String> f = CompletableFuture.supplyAsync(() -> "espresso");
System.out.println(f.join());`,["espresso","CompletableFuture[espresso]","null","f"],"`join()` дочікується результату й повертає саме рядок espresso."),
C("Яка операція `Stream` за ідеєю найближча до `thenApply`?",["map","filter","sorted","collect"],"Обидві беруть готове значення й повертають його перетвореним, яке йде далі в ланцюжку.",null,true),
O(`int r = CompletableFuture.supplyAsync(() -> 4)
    .thenApply(x -> x * x)
    .thenApply(x -> x + 1)
    .join();
System.out.println(r);`,["17","16","9","5"],"Спочатку 4, потім 4 * 4 = 16, потім 16 + 1 = 17."),
F("Порахуй 6 * 7 в іншому потоці й виведи результат.",`CompletableFuture<Integer> f = CompletableFuture.[[0]](() -> 6).[[1]](x -> x * 7);
System.out.println(f.[[2]]());`,["supplyAsync","thenApply","join"],["runAsync","thenAccept","wait"],"`supplyAsync` створює значення 6, `thenApply` множить його на 7, а `join` забирає результат 42."),
F("Помнож результати двох незалежних завдань.",`CompletableFuture<Integer> a = CompletableFuture.supplyAsync(() -> 2);
CompletableFuture<Integer> b = CompletableFuture.supplyAsync(() -> 5);
CompletableFuture<Integer> s = a.[[0]](b, (x, y) -> x * y);
System.out.println(s.[[1]]());`,["thenCombine","join"],["thenApply","thenAccept","await"],"Для двох квитанцій одразу підходить `thenCombine`, а `thenApply` і `thenAccept` приймають лише одну функцію."),
R("Склади код: отримай latte, зроби великими літерами та виведи.",['CompletableFuture<String> f = CompletableFuture.supplyAsync(() -> "latte");','CompletableFuture<String> g = f.thenApply(String::toUpperCase);','String s = g.join();','System.out.println(s);'],"Спочатку створюємо квитанцію, потім додаємо етап обробки, потім забираємо результат, і лише тоді друкуємо."),
T("Впиши метод, який перетворює результат (було 1, має стати 2).",`CompletableFuture<Integer> f = CompletableFuture.supplyAsync(() -> 1).[[0]](x -> x + 1);
System.out.println(f.join());`,["thenApply","thenApplyAsync"],"`thenApply` бере готове значення й повертає нове, тож з 1 вийде 2."),
T("Впиши метод, який підставить 0, якщо в `supplyAsync` станеться помилка.",`CompletableFuture<Integer> f = CompletableFuture.supplyAsync(() -> 1 / 0);
System.out.println(f.[[0]](e -> 0).join());`,["exceptionally"],"`exceptionally` перехоплює помилку й замість неї повертає запасне значення, тож `join` не впаде."),
B(null,['CompletableFuture<Integer> f = CompletableFuture.supplyAsync(() -> 8);','int a = f.join();','String s = f.thenApply(x -> x * 2).join();','System.out.println(a + s);'],2,"Тип результату `thenApply(x -> x * 2)` це `Integer`, тому `join()` повертає число, яке не можна покласти в `String`."),
O(`CompletableFuture<Integer> a = CompletableFuture.supplyAsync(() -> 10);
CompletableFuture<Integer> b = CompletableFuture.supplyAsync(() -> 10 / 0);
int r = a.thenCombine(b.exceptionally(e -> 5), (x, y) -> x * y).join();
System.out.println(r);`,["50","100","0","Програма впаде з помилкою"],"Друге завдання ділить на нуль, але `exceptionally` підставляє 5. Далі `thenCombine` множить 10 на 5 і виходить 50.")
]}
];

{unit:16, after:'16-1', key:'16-n0', title:"Параметризовані тести й моки (Mockito)", learn:[
K("Навіщо потрібні параметризовані тести й моки",
"Уяви, що перевіряєш кавомашину з різною кількістю води: 100, 200, 300 мл. Писати окремий тест на кожне число нудно, тому один тест запускають з багатьма наборами даних. А якщо кавомашина залежить від справжнього постачальника зерна, у тесті ми підставляємо «несправжнього», який відповідає заготовленими словами. Такий підставний об'єкт називають моком.",
null,null),
K("@ParameterizedTest і @ValueSource",
"Замість `@Test` пишемо `@ParameterizedTest`, а дані беремо з `@ValueSource`. Кожне значення запускає тест окремо, а метод отримує його як параметр.",
`@ParameterizedTest
@ValueSource(ints = {2, 4, 10})
void evenNumbers(int n) {
    assertTrue(n % 2 == 0);
}`,"Тест запуститься 3 рази: для 2, 4 і 10"),
K("@CsvSource: кілька значень за запуск",
"Коли потрібно кілька значень одразу (вхід і очікуваний результат), беремо `@CsvSource`. Кожен рядок це один запуск, значення розділені комами й самі перетворюються на типи параметрів: перше в `a`, друге в `b`, третє в `expected`.",
`@ParameterizedTest
@CsvSource({"2,3,5", "10,5,15", "0,0,0"})
void sum(int a, int b, int expected) {
    assertEquals(expected, a + b);
}`,"3 запуски: (2,3,5), (10,5,15), (0,0,0)"),
K("Мок у Mockito: mock, when, verify",
"`mock(Клас.class)` створює підставний об'єкт. `when(...).thenReturn(...)` каже, що він має відповісти на певний виклик. Коли `cafe.brew()` попросить у мока зерно, він віддасть 5. Наприкінці `verify(...)` перевіряє, що такий виклик справді був.",
`BeanSupplier s = mock(BeanSupplier.class);
when(s.beans()).thenReturn(5);
Cafe cafe = new Cafe(s);
cafe.brew();
verify(s).beans();`,"Тест пройде, якщо brew() хоч раз викликав s.beans()"),
K("Типова пастка: мок, якому нічого не сказали",
"Мок без `when` не падає, а повертає «порожнє»: 0 для чисел, false для boolean і null для об'єктів. Також `verify` перевіряє лише те, що виклик був, а не те, що результат правильний. І не став `@Test` разом з `@ParameterizedTest`: потрібна лише одна з них.",
`BeanSupplier s = mock(BeanSupplier.class);
int n = s.beans();
String name = s.name();`,"n == 0, name == null"),
], ex:[

["4","1","7","16"],

C("Треба перевірити метод add(a, b) для кількох пар чисел і очікуваної суми. Яке джерело даних зручніше?",
["@CsvSource","@ValueSource","@Mock","@Autowired"],
"@ValueSource дає по одному значенню на запуск, а тут потрібні три разом (a, b і очікувана сума). @CsvSource саме так і працює: рядок це один запуск."),
F("Заповни пропуски, щоб тест запускався для двох рядків даних.",

"Кілька значень через кому в одному рядку читає саме @CsvSource."),

{unit:17, after:'17-1', key:'17-n0', title:"JOIN, GROUP BY і транзакції (commit/rollback)", learn:[
K("Навіщо з'єднувати таблиці",
"У кав'ярні клієнти й замовлення лежать в окремих таблицях, щоб нічого не дублювати. Але щоб дізнатися, хто що замовив, треба зіставити рядки двох таблиць. Це робить `JOIN`: він склеює рядки там, де збігається ключ.",
`clients              orders
id | name            id | client_id | drink   | price
1  | Анна            1  | 1         | Лате    | 70
2  | Богдан          2  | 1         | Еспресо | 40
3  | Олена           3  | 2         | Лате    | 70`,null),
K("JOIN ... ON",
"Після `JOIN` пишемо другу таблицю, а після `ON` умову зв'язку: у замовлення є `client_id`, у клієнта є `id`. Для Анни (id 1) знайшлося 2 замовлення, для Богдана одне, для Олени жодного, тому її в результаті немає.",
`SELECT clients.name, orders.drink
FROM clients
JOIN orders ON orders.client_id = clients.id;`,"Анна | Лате\nАнна | Еспресо\nБогдан | Лате"),
K("GROUP BY: рахуємо по групах",
"`GROUP BY` складає рядки з однаковим значенням у групи, а функції `COUNT` (скільки рядків) і `SUM` (сума) рахують окремо в кожній групі. Усі замовлення Анни стають одним рядком.",
`SELECT clients.name, COUNT(*), SUM(orders.price)
FROM clients
JOIN orders ON orders.client_id = clients.id
GROUP BY clients.name;`,"Анна | 2 | 110\nБогдан | 1 | 70"),
K("Транзакція: commit і rollback",
"Транзакція це група змін, яка виконується або вся, або взагалі ні, як чек у касі. У JDBC вимикаємо автозбереження, а потім викликаємо `commit()`, якщо все вдалося, або `rollback()`, якщо ні. Якщо другий UPDATE впаде, ми потрапимо в `catch`, і перший UPDATE теж скасується.",

`SELECT clients.name, orders.drink

], ex:[

{unit:18, after:'18-0', key:'18-n0', title:"Dependency Injection: @Component, @Autowired, конструктор", learn:[
K("Навіщо потрібен Dependency Injection",
"Бариста потребує кавомашини. Він може сам піти й купити її, а може отримати від кав'ярні вже готову. Dependency Injection (DI) це друге: залежності (те, без чого клас не працює) передають класу ззовні, а не створюють усередині. Тоді кавомашину легко замінити, наприклад на підставну в тесті.",
null,null),
K("Без DI і з DI",
"Коли клас сам робить `new`, він жорстко прив'язаний до конкретної залежності. Коли залежність приходить через конструктор, клас про неї лише знає, що вона є, а хто саме її створив, йому байдуже.",
`class Barista {
    private final EspressoMachine machine = new EspressoMachine();
}

class Barista {
    private final EspressoMachine machine;
    Barista(EspressoMachine machine) { this.machine = machine; }
}`,null),
K("@Component: Spring керує об'єктом",
"Анотація `@Component` над класом каже Spring: «створи об'єкт цього класу сам і зберігай у себе». Такі об'єкти називають бінами (bean). Під час запуску Spring знаходить усі класи з `@Component` і створює по одному бін.",
`@Component
class EspressoMachine {
    // Spring створить один такий об'єкт
}`,null),
K("@Autowired і конструктор",
"Коли Spring створює `Barista`, він дивиться на конструктор, бачить параметр `EspressoMachine` і сам підставляє туди готовий бін. Анотація `@Autowired` на конструкторі прямо про це просить (якщо конструктор єдиний, у нових версіях Spring вона не обов'язкова).",
`@Component
class Barista {
    private final EspressoMachine machine;

    @Autowired
    Barista(EspressoMachine machine) {
        this.machine = machine;
    }
}`,null),
K("Типова пастка: Spring бачить лише своє",
"Spring підставить лише те, що сам створив. Якщо над класом немає `@Component`, бін не з'явиться, і програма не запуститься з помилкою «не знайдено біна». Те саме, якщо зробити `new Barista(...)` вручну: такий об'єкт Spring не знає й нічого в нього не підставить. А якщо підходящих бінів два, Spring теж не вгадає, який брати.",
`class EspressoMachine { }      // немає @Component

@Component
class Barista {
    Barista(EspressoMachine m) { }
}`,"Помилка запуску: Spring не знайшов біна EspressoMachine"),
], ex:[
C("Що таке Dependency Injection?",
["Клас отримує потрібні залежності ззовні, а не створює їх сам","Клас копіює код іншого класу в себе","Клас успадковує всі методи від Spring","Клас створює всі об'єкти у своєму конструкторі"],
"DI означає, що залежності передають класу. Так клас не прив'язаний до того, хто і як їх створює."),
C("Що тут погано з погляду DI?",
["Barista сам створює кавомашину і жорстко прив'язаний до неї","Поле machine не може бути final","Клас не має методів","Назва класу занадто коротка"],
"Рядок new EspressoMachine() усередині класу не дозволяє підставити іншу машину, наприклад підставну для тесту.",
`class Barista {
    private final EspressoMachine machine = new EspressoMachine();
}`),
C("Що робить анотація @Component над класом?",
["Каже Spring створити об'єкт цього класу й керувати ним","Створює таблицю в базі даних","Запускає клас як тест","Робить усі поля класу static"],
"@Component позначає клас як бін: Spring знайде його при запуску, створить об'єкт і підставлятиме куди потрібно."),
F("Заповни пропуски: Cafe має створюватися Spring і отримати Barista через конструктор.",
`[[0]]
class Cafe {
    private final Barista barista;

    [[1]]
    Cafe(Barista barista) {
        this.barista = barista;
    }
}`,["@Component","@Autowired"],["@Entity","@Test","@Override"],
"@Component робить клас бінам, а @Autowired на конструкторі просить Spring підставити параметр."),
F("Заповни пропуски в конструкторі, щоб залежність прийшла ззовні й збереглася в полі.",
`@Component
class Barista {
    private final EspressoMachine machine;

    Barista([[0]] [[1]]) {
        this.machine = machine;
    }
}`,["EspressoMachine","machine"],["Component","new","Autowired"],
"Параметр має тип залежності й ім'я, яке потім присвоюємо полю: EspressoMachine machine."),
R("Збери клас Barista, який отримує кавомашину через конструктор.",
["@Component","class Barista {","    private final EspressoMachine machine;","    Barista(EspressoMachine machine) {","        this.machine = machine;","    }","}"],
"Спершу анотація й заголовок класу, потім поле, а за ним конструктор, який це поле заповнює."),
T("Допиши назву анотації, щоб Spring створив об'єкт цього класу.",
`@[[0]]
class EspressoMachine { }`,["Component"],
"@Component робить клас бінам, який створює Spring."),
T("Допиши анотацію, якою просимо Spring підставити параметри конструктора.",
`@[[0]]
Barista(EspressoMachine machine) {
    this.machine = machine;
}`,["Autowired"],
"@Autowired показує, що значення параметрів Spring візьме серед своїх бінів."),
B(null,[
"@Component",
"class Barista {",
"    private final EspressoMachine machine;",
"    Barista(EspressoMachine machine) { this.machine = machine; }",
"    void reset() { machine = new EspressoMachine(); }",
"}"],4,
"Поле machine оголошено як final: його можна присвоїти лише один раз, у конструкторі. У reset() компілятор не дозволить його змінити."),
C("Дві різні кавомашини мають @Component і реалізують інтерфейс Machine. Що станеться на старті?",
["Помилка: Spring не знає, який із двох бінів підставити","Spring візьме першу за алфавітом","Spring створить третю, порожню машину","Нічого, у Barista потрапить null"],
"Для параметра Machine підходять два біни, і Spring не вирішує за тебе. Треба явно вказати, який саме потрібен.",
`interface Machine { }

@Component class EspressoMachine implements Machine { }
@Component class FilterMachine implements Machine { }

@Component
class Barista {
    Barista(Machine machine) { }
}`),
C("Що станеться під час запуску застосунку?",
["Помилка: Spring не знайшов біна Barista для Cafe","Усе запуститься, Barista буде створено автоматично","Cafe створиться, а в barista буде null","Помилка компіляції в рядку з Cafe"],
"У Barista немає @Component, тому Spring не зробив його бінам. Коли Cafe просить Barista у конструкторі, підставляти нічого, і запуск зупиняється з помилкою.",
`class Barista { }

@Component
class Cafe {
    @Autowired
    Cafe(Barista barista) { }
}`),
]},

{unit:18, after:'18-1', key:'18-n1', title:"Spring Data JPA: @Entity, репозиторій", learn:[
K("Навіщо потрібен JPA",
"У кав'ярні меню лежить у таблиці бази, а в програмі ми працюємо з об'єктами `Drink`. Писати SQL для кожної дії довго. JPA це перекладач: клас перетворюється на таблицю, об'єкт на рядок, а Spring Data JPA ще й сам пише типові запити за нас.",
null,null),
K("@Entity і @Id: клас як таблиця",
"`@Entity` каже, що об'єкти класу зберігаються в таблиці, а поля стають колонками. `@Id` позначає поле-ключ, за яким рядки відрізняють один від одного. `@GeneratedValue` просить базу видавати цей номер самій.",
`@Entity
public class Drink {
    @Id
    @GeneratedValue
    private Long id;
    private String name;
}`,null),
K("Репозиторій: інтерфейс без реалізації",
"Щоб читати й зберігати `Drink`, пишемо інтерфейс, що розширює `JpaRepository<Drink, Long>`: перший тип це сутність, другий тип її `@Id`. Тіла в методів писати не треба, Spring створить реалізацію сам.",
`public interface DrinkRepository
        extends JpaRepository<Drink, Long> {
}`,null),
K("Готові методи в дії",
"Репозиторій уже має `save` (зберегти), `findById` (знайти за ключем), `findAll`, `count` і `deleteById`. Розберемо по кроках. Після першого `save` в базі один рядок, і йому видано id. Після другого рядків два. `findById` повертає `Optional`, бо рядка з таким id може й не бути.",
`repo.save(new Drink("Лате"));
repo.save(new Drink("Еспресо"));
System.out.println(repo.count());
Optional<Drink> d = repo.findById(1L);
System.out.println(d.isPresent());`,"2\ntrue"),
K("Типова пастка: Optional і назви методів",
"`findById` повертає не `Drink`, а `Optional<Drink>`, тому його не можна присвоїти змінній типу `Drink`. Ще можна додавати власні запити лише за назвою методу: `findByName` означає «знайди за полем name». Якщо поля `name` у сутності немає, Spring зупинить запуск з помилкою.",
`Drink d = repo.findById(1L).get();        // пряме .get() ризиковано
Optional<Drink> maybe = repo.findById(99L);   // порожній Optional

], ex:[

F("Заповни пропуски: клас стає таблицею, а id його ключем.",
`@[[0]]
public class Drink {
    @[[1]]
    private Long id;

"@Entity робить клас таблицею, а @Id показує, яке поле є ключем."),

{unit:19, after:'19-0', key:'19-n0', title:"Патерни: Singleton, Factory, Builder", learn:[
K("Навіщо потрібні патерни",
"Патерн це перевірений рецепт розв'язання задачі, яка постійно повторюється. У кав'ярні така сама логіка: одна каса на всіх (Singleton), бариста готує напій за назвою (Factory), а складне замовлення збирають крок за кроком (Builder). Нижче розберемо їх по черзі.",
null,null),
K("Singleton: об'єкт тільки один",
"Іноді об'єкт має бути єдиним, як каса. Для цього конструктор робимо `private`, щоб ніхто не зробив `new` ззовні, а єдиний об'єкт зберігаємо в `static` полі й віддаємо через `getInstance()`. Перший виклик створює об'єкт, наступні повертають його ж.",
`class Register {
    private static Register instance;

const $app=document.getElementById('app');
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const KW='public|private|protected|static|void|class|int|double|float|long|boolean|char|String|final|if|else|switch|case|default|break|continue|for|while|do|return|new|true|false|null|import|package|this';
const RX=new RegExp('(\\/\\/[^\\n]*)|("(?:\\\\.|[^"\\\\\\n])*")|(\'(?:\\\\.|[^\'\\\\\\n])\')|\\b('+KW+')\\b|\\b(\\d+(?:\\.\\d+)?)\\b|\\b([A-Z][A-Za-z0-9_]*)\\b','g');
function hl(src){
  let out='',last=0,m;RX.lastIndex=0;
  while((m=RX.exec(src))){
    out+=esc(src.slice(last,m.index));
    const t=m[1]?'com':(m[2]||m[3])?'str':m[4]?'kw':m[5]?'num':'ty';
    out+='<span class="t-'+t+'">'+esc(m[0])+'</span>';
    last=m.index+m[0].length;
  }
  return out+esc(src.slice(last));
}
function shuffle(a,avoidSame){
  const orig=a.slice();let r;let tries=0;
  do{r=orig.slice();for(let i=r.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[r[i],r[j]]=[r[j],r[i]];}tries++;}
  while(avoidSame&&r.length>1&&tries<12&&r.every((x,i)=>x===orig[i]));
  return r;
}

function addDay(ds,n){const d=new Date(ds+'T12:00:00');d.setDate(d.getDate()+n);return dayStr(d);}
const inPause=()=>!!(S.pause&&today()<=addDay(S.pause,1));
function shownStreak(){
  if(S.last===today()||S.last===dAgo(1))return S.streak;
  if(inPause()&&S.streak>0)return S.streak;
  if(S.last===dAgo(2)&&S.freeze>0)return S.streak;
  return 0;
}
function bumpStreak(){
  const r={froze:false,earned:false};
  if(S.last===today())return r;
  if(S.last===dAgo(1))S.streak++;
  else if(S.last===dAgo(2)&&S.freeze>0){S.freeze--;S.streak++;r.froze=true;}
  else if(inPause()&&S.streak>0)S.streak++;
  else S.streak=1;
  S.last=today();
  if(S.streak%7===0&&S.freeze<2){S.freeze++;r.earned=true;}
  return r;
}

/* ---------- sound ---------- */
let actx=null;
const SEQ={
  ok:[[660,0,.1],[880,.09,.16]],
  bad:[[196,0,.18],[147,.15,.26]],
  done:[[523,0,.12],[659,.11,.12],[784,.22,.12],[1047,.33,.34]],
  star:[[784,0,.1],[988,.1,.1],[1319,.2,.24]]
};
function snd(k){
  if(!S.sound||!SEQ[k])return;
  try{
    actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    if(actx.state==='suspended')actx.resume();
    const t0=actx.currentTime;
    SEQ[k].forEach(n=>{
      const o=actx.createOscillator(),g=actx.createGain();
      o.type=k==='bad'?'triangle':'sine';o.frequency.value=n[0];
      g.gain.setValueAtTime(0.0001,t0+n[1]);
      g.gain.exponentialRampToValueAtTime(0.12,t0+n[1]+0.015);
      g.gain.exponentialRampToValueAtTime(0.0001,t0+n[1]+n[2]);
      o.connect(g);g.connect(actx.destination);
      o.start(t0+n[1]);o.stop(t0+n[1]+n[2]+0.03);
    });
  }catch(e){}
}

/* ---------- toast ---------- */
const toasts=[];let toastBusy=false;
function toast(title,msg,kind){toasts.push({title,msg,kind});pumpToast();}
function pumpToast(){
  if(toastBusy||!toasts.length)return;
  toastBusy=true;
  const t=toasts.shift(),el=document.createElement('div');
  el.className='toast'+(t.kind==='ach'?' ach':'');
  el.setAttribute('role','status');
  el.innerHTML='<div class="t-ico">'+(t.kind==='ach'?IC.star:IC.check)+'</div><div class="t-tx"><b>'+esc(t.title)+'</b><span>'+esc(t.msg)+'</span></div>';
  document.body.appendChild(el);
  setTimeout(()=>{el.classList.add('out');},3200);
  setTimeout(()=>{if(el.parentNode)el.parentNode.removeChild(el);toastBusy=false;pumpToast();},3700);
}

function pickVariant(ex){
  try{

    else if(ex.ui===100)src=PROJECTS.flatMap(p=>p.steps.flatMap(s=>s.ex));

    const free=e=>e!==ex&&!L.queue.includes(e)&&!(L.asked&&L.asked.has(e));
    let c=src.filter(e=>free(e)&&e.t===ex.t);
    if(!c.length)c=src.filter(free);

      const wide=ALL.filter(l=>l.ui===ex.ui).flatMap(l=>l.lesson.ex).filter(free);
      c=wide.filter(e=>e.t===ex.t);if(!c.length)c=wide;

function wrapJava(code){
  if(!code)return null;
  if(/\bclass\s+\w+/.test(code)&&/static\s+void\s+main/.test(code))return code;
  if(/\bclass\s+\w+|\binterface\s+\w+|\brecord\s+\w+/.test(code))return null;
  if(/\[\[\d\]\]/.test(code))return null;
  const imp='import java.util.*;\nimport java.util.stream.*;\nimport java.util.function.*;\n';
  return imp+'public class Main {\n    public static void main(String[] args) throws Exception {\n'+code.split('\n').map(l=>'        '+l).join('\n')+'\n    }\n}\n';
}

  ['пн','','ср','','пт','',''].forEach((t,i)=>{if(t)svg+='<text x="0" y="'+(14+i*(cell+gap)+cell*.7)+'">'+t+'</text>';});
  const tk=today();

function codeBlock(code,cp){
  let carry='';
  const lines=hl(code).split('\n').map(l=>{let t=carry+l;const o=(t.match(/<span /g)||[]).length,c=(t.match(/<\/span>/g)||[]).length;
    if(o>c){const m=t.match(/<span class="t-\w+">/g);carry=m[m.length-1];t+='</span>'.repeat(o-c);}else carry='';return '<span class="l">'+t+'</span>';});
  return '<div class="cw">'+(cp?'<div class="cprow"><button class="cpy" data-act="cpy" aria-label="Копіювати код">Копіювати</button></div>':'')+'<pre class="code ln"><code>'+lines.join('\n')+'</code></pre></div>';
}
function fmt(s){return esc(s).replace(/`([^`]+)`/g,'<code>$1</code>');}
function fillCode(ex,c){
  const parts=ex.code.split(/\[\[(\d)\]\]/);let h='';
  parts.forEach((p,i)=>{
    if(i%2===0){h+=hl(p);}
    else{
      const k=+p,id=c.slots[k],w=id==null?null:c.words.find(x=>x.id===id).w;
      let cls='blank';
      if(c.checked&&w!=null){
        const ok=w===ex.ans[k];
        cls+=ok?' good':' bad';
        if(fx.res)cls+=ok?' pop':' shake';
      }else if(fx.slot===k)cls+=' set';
      h+='<button class="'+cls+'" data-act="unslot" data-i="'+k+'"'+(c.checked?' disabled':'')+' aria-label="Пропуск '+(k+1)+'">'+(w==null?'&nbsp;':esc(w))+'</button>';
    }
  });
  return '<pre class="code"><code>'+h+'</code></pre>';
}
function typeCode(ex,c){
  const parts=ex.code.split('[[0]]');
  const cls='tslot'+(c.checked?(c.ok?' good':' bad'):'');
  const val=c.val?esc(c.val):'&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;';
  return '<pre class="code"><code>'+hl(parts[0])+'<span class="'+cls+'" id="tslot">'+val+'</span>'+hl(parts[1]||'')+'</code></pre>';
}
function ready(c){
  const ex=c.ex;
  if(ex.t==='mc'||ex.t==='out'||ex.t==='bug')return c.sel!=null;
  if(ex.t==='fill')return c.slots.every(x=>x!=null);
  if(ex.t==='type')return c.val.trim().length>0;
  return c.bank.length===0;
}

      else if(ex.t==='bug')a='Рядок '+(ex.bad+1)+': '+ex.lines[ex.bad].trim();
      else if(ex.t==='type')a=ex.acc[0];
      else a=ex.lines.join('\n');
      ans='<span class="ans">'+esc(a)+'</span>';
    }
    const praise=['Правильно!','Чудово!','Так тримати!','Точно!'][L.done%4];
    const gain=L.retried.has(ex)||L.hinted.has(ex)?5:10;
    const plus=(ok&&fx.res&&!L.placement)?'<span class="plus" aria-hidden="true">+'+gain+(fx.fast?' ⚡':'')+'</span>':'';
    let body;
    if(ok)body='<p>'+esc(ex.why)+'</p>';
    else{
      let right;
      if(ex.t==='fill')right='<div class="fbx-chips">'+ex.ans.map(w=>'<code>'+esc(w)+'</code>').join('')+'</div>';
      else if(ex.t==='order')right='<pre class="fbx-code">'+esc(ex.lines.join('\n'))+'</pre>';
      else if(ex.t==='bug')right='<p>Рядок '+(ex.bad+1)+'</p><pre class="fbx-code">'+esc(ex.lines[ex.bad].trim())+'</pre>';
      else if(ex.t==='type')right='<pre class="fbx-code">'+esc(ex.acc[0])+'</pre>';
      else right='<p><b>'+esc(c.opts.find(o=>o.ok).text)+'</b></p>';
      const mine=yours(ex,c);
      body='<div class="fbx">'+(mine?'<div class="fbx-r mine"><i>Що не так</i><div class="yours">'+mine+'</div></div>':'')
        +'<div class="fbx-r right"><i>Правильно</i>'+right+'</div>'
        +'<div class="fbx-r why"><i>Чому</i><p>'+esc(ex.why)+'</p></div></div>'
        +((L.iv||L.hearts<=0)?'':'<p class="hint">Далі буде схоже завдання, щоб ти '+G('зрозуміла','зрозумів')+' суть, а не '+G('завчила','завчив')+' відповідь.</p>')+moreHtml(ex,c);
    }
    h+='<div class="bar slide '+(ok?'good':'bad')+'"><div class="bar-in">'+plus+'<div class="fb"><div class="badge m">'+mascot(ok?'happy':'sad',48)+'</div><div class="fb-text"><h3>'+(ok?praise:'Не зовсім')+'</h3>'+body+'</div></div><button class="btn '+(ok?'good':'bad')+'" data-act="next">'+(!L.placement&&L.hearts<=0&&!ok?'Зрозуміло':'Далі')+'</button></div></div>';
  }
  return h;
}

/* ---------- motion helpers ---------- */
function animateBars(){
  const bars=$app.querySelectorAll('.fill[data-to]');
  if(!bars.length)return;
  void $app.offsetWidth;
  requestAnimationFrame(()=>{bars.forEach(b=>{b.style.width=b.dataset.to+'%';});});
}
function runCounters(){
  if(isReduced())return;
  $app.querySelectorAll('[data-count]').forEach(el=>{
    const to=+el.dataset.count,from=+(el.dataset.from||0),pre=el.dataset.pre||'',suf=el.dataset.suf||'';
    if(from===to)return;
    const t0=performance.now(),dur=900;
    (function step(now){
      const p=Math.min(1,Math.max(0,(now-t0)/dur)),e=1-Math.pow(1-p,3);
      el.textContent=pre+Math.round(from+(to-from)*e)+suf;
      if(p<1)requestAnimationFrame(step);
    })(t0);
  });
}
function confetti(){
  if(isReduced())return;
  const box=document.createElement('div');
  box.className='confetti';box.setAttribute('aria-hidden','true');
  let s='';
  for(let i=0;i<(fx.beans?80:46);i++){
    const w=6+Math.random()*7;
    s+='<i'+(fx.beans?' class="bean"':'')+' style="left:'+(Math.random()*100).toFixed(1)+'%;width:'+w.toFixed(1)+'px;height:'+(w*1.6).toFixed(1)+'px;background:var(--u'+(1+i%6)+');animation-duration:'+(1.9+Math.random()*1.5).toFixed(2)+'s;animation-delay:'+(Math.random()*0.6).toFixed(2)+'s;--r:'+Math.round(Math.random()*720-360)+'deg;--dx:'+Math.round((Math.random()*2-1)*90)+'px"></i>';
  }
  box.innerHTML=s;
  document.body.appendChild(box);
  setTimeout(()=>{if(box.parentNode)box.parentNode.removeChild(box);},4500);
}

/* ================= Lesson logic ================= */
function prep(){
  const ex=L.queue[0],c={ex,checked:false,ok:null,t0:performance.now(),hints:0,gone:[]};
  if(ex.t==='mc'||ex.t==='out'){c.opts=shuffle(ex.opts.map((text,i)=>({text,ok:i===0})));c.sel=null;}
  else if(ex.t==='fill'){c.words=shuffle(ex.ans.concat(ex.extra).map((w,i)=>({id:i,w})));c.slots=ex.ans.map(()=>null);}
  else if(ex.t==='order'){c.bank=shuffle(ex.lines.map((text,i)=>({id:i,text})),true);c.built=[];}
  else if(ex.t==='bug'){c.sel=null;}
  else{c.val='';c.hintTxt='';}
  if(L.asked)L.asked.add(ex);c.var=!!(L.varSet&&L.varSet.has(ex));c.chal=!!(L.chalEx&&L.chalEx===ex);
  L.cur=c;fx.stage=true;
}
function reviewPick(){
  const pool=reviewPool(),due=dueList();
  let q=due.slice(0,8);
  if(q.length<8){const m=pool.filter(e=>S.miss[e.id]>0&&!q.includes(e)).sort((x,y)=>S.miss[y.id]-S.miss[x.id]);q=q.concat(m.slice(0,8-q.length));}
  if(q.length<8){
    const lessons=ALL.filter(l=>S.done[l.uid]&&!S.done[l.uid].skip).sort((x,y)=>S.done[x.uid].t-S.done[y.uid].t).slice(0,6);
    const lists=lessons.map(l=>shuffle(l.lesson.ex.filter(e=>!q.includes(e))));
    const want=Math.min(8,pool.length)-q.length,rest=[];
    for(let r=0;rest.length<want&&r<20;r++)lists.forEach(li=>{if(rest.length<want&&li[r])rest.push(li[r]);});
    q=q.concat(rest);
  }
  return shuffle(q);
}
const STG=[{n:'Розпізнаємо',d:'Читаємо код і вибираємо правильну відповідь.'},{n:'Складаємо',d:'Тепер самі доповнюємо й збираємо код.'},{n:'Пишемо сам',d:'Остання сходинка: пишемо код і шукаємо помилки.'}];
const stageOf=ex=>ex.t==='mc'||ex.t==='out'?0:ex.t==='fill'||ex.t==='order'?1:2;
function newRun(info,queue,extra){
  const mx=LEVELS[S.level].hearts;
  L=Object.assign({info,mode:'practice',queue,total:queue.length,done:0,first:0,earn:0,hearts:mx,max:mx,retried:new Set(),hinted:new Set(),asked:new Set(),varSet:new Set(),sok:0,chal:false,chalEx:null,leave:false,cur:null,si:0,peek:false,fast:0,review:false,placement:false},extra||{});
  delete barsMem.lesson;
  screen='lesson';fx.view=true;prep();render();window.scrollTo(0,0);
}
function startReview(){
  const q=reviewPick();if(!q.length)return;
  newRun({uid:'review',n:-1,lesson:{title:'Змішані завдання з пройдених уроків',ex:[]}},q,{review:true,allEx:q.slice()});
}
function startPlacement(){
  const q=[];
  for(let ui=0;ui<8&&ui<UNITS.length;ui++){
    const ls=UNITS[ui].lessons.filter(x=>!x.isNew),lsn=ls[ls.length-1];
    const pool=lsn.ex.filter(e=>e.t==='mc'||e.t==='out'||e.t==='fill');
    q.push(pool[Math.floor(Math.random()*pool.length)]);
  }
  newRun({uid:'placement',n:-1,lesson:{title:'Тест рівня',ex:[]}},q,{placement:true,hearts:99,max:99,pl:[]});
}
function startLesson(uid){
  if(uid==='review'){startReview();return;}
  const info=ALL.find(l=>l.uid===uid);if(!info||!isUnlocked(info.n))return;
  if(ALL.find(l=>l.ui===info.ui)===info&&!S.story[info.ui]&&STORY[info.ui]){pendingUid=uid;screen='story';fx.view=true;render();window.scrollTo(0,0);return;}
  const q=info.lesson.ex.map((e,i)=>({e,i})).sort((a,b)=>stageOf(a.e)-stageOf(b.e)||a.i-b.i).map(x=>x.e);
  newRun(info,q,{mode:'study',staged:true,stSeen:{},stList:[...new Set(q.map(stageOf))]});
}
function endStudy(){
  L.mode='practice';L.peek=false;L.si=0;
  fx.view=true;fx.stage=true;
  render();window.scrollTo(0,0);
}
function hint(){
  const c=L.cur,ex=c.ex;
  if(!c||c.checked||canHint(c)!==true)return;
  if(S.level==='normal')fx.xpPop='−'+(ptsFor(c.hints)-ptsFor(c.hints+1));
  c.hints++;S.stats.hints++;
  if(S.level!=='easy')L.hinted.add(ex);
  if(ex.t==='mc'||ex.t==='out'){
    const wrong=c.opts.map((o,i)=>i).filter(i=>!c.opts[i].ok&&i!==c.sel&&!c.gone.includes(i));
    shuffle(wrong).slice(0,1).forEach(i=>c.gone.push(i));
  }else if(ex.t==='bug'){
    const wrong=ex.lines.map((l,i)=>i).filter(i=>i!==ex.bad&&i!==c.sel&&ex.lines[i].trim());
    const rem=wrong.filter(i=>!c.gone.includes(i));
    shuffle(rem).slice(0,[Math.ceil(rem.length/3),Math.ceil(rem.length/2),rem.length][c.hints-1]).forEach(i=>c.gone.push(i));
    if(c.gone.includes(c.sel))c.sel=null;
  }else if(ex.t==='fill'){
    const k=ex.ans.findIndex((w,i)=>{const id=c.slots[i];return id==null||c.words.find(x=>x.id===id).w!==w;});
    if(k<0)return;
    c.slots[k]=null;
    let chip=c.words.find(x=>x.w===ex.ans[k]&&!c.slots.includes(x.id));
    if(!chip){
      const j=c.slots.findIndex(id=>id!=null&&c.words.find(x=>x.id===id).w===ex.ans[k]);
      if(j>=0)c.slots[j]=null;
      chip=c.words.find(x=>x.w===ex.ans[k]&&!c.slots.includes(x.id));
    }
    if(chip){c.slots[k]=chip.id;fx.slot=k;}
  }else if(ex.t==='order'){
    let i=0;while(i<c.built.length&&c.built[i].text===ex.lines[i])i++;
    while(c.built.length>i)c.bank.push(c.built.pop());
    const bi=c.bank.findIndex(b=>b.text===ex.lines[i]);
    if(bi>=0){const b=c.bank.splice(bi,1)[0];c.built.push(b);fx.line=b.id;}
  }else{
    const a=ex.acc[0];
    c.hintTxt=a.slice(0,Math.max(2,Math.ceil(a.length*[.35,.65,.9][c.hints-1])))+'…';
  }
  render();
}
function check(){
  const c=L.cur,ex=c.ex;if(c.checked||!ready(c))return;
  let ok;
  if(ex.t==='mc'||ex.t==='out')ok=c.opts[c.sel].ok;
  else if(ex.t==='fill')ok=c.slots.every((id,k)=>c.words.find(w=>w.id===id).w===ex.ans[k]);
  else if(ex.t==='order')ok=c.built.map(b=>b.text).join('\n')===ex.lines.join('\n');
  else if(ex.t==='bug')ok=c.sel===ex.bad;
  else ok=ex.acc.some(a=>strip(a)===strip(c.val));
  c.checked=true;c.ok=ok;fx.res=ok?'pop':'shake';
  const firstTry=!L.retried.has(ex);
  recordAnswer(ex,ok,firstTry,c);
  if(L.placement){
    L.done++;L.pl.push(ok);
  }else if(ok){
    L.done++;
    {let g=L.retried.has(ex)?5:10;if(S.level!=='easy'&&c.hints>0)g=Math.min(g,ptsFor(c.hints));L.earn=(L.earn||0)+g;fx.xpPop='+'+g;}
    if(firstTry&&c.hints===0&&!L.review&&!L.placement)L.sok++;else if(!firstTry||c.hints>0)L.sok=0;
    if(L.sok>=3&&!L.chal&&!L.review&&!L.placement){const ch=pickChallenge(ex);if(ch){L.chal=true;L.chalEx=ch;L.queue.splice(1,0,ch);L.total++;toast('Виклик','Складніше завдання за серію правильних відповідей','ach');}}
    if(firstTry&&!L.hinted.has(ex)){
      L.first++;
      const dt=(performance.now()-c.t0)/1000;
      if(dt<8&&ex.t!=='type'&&ex.t!=='order'){L.fast++;fx.fast=true;}
    }
    if(firstTry){
      if(S.miss[ex.id]>0){S.miss[ex.id]--;if(!S.miss[ex.id])delete S.miss[ex.id];}
      if(ex.t==='bug')S.stats.bugs++;
      if(ex.t==='type')S.stats.typed++;
    }
  }else{
    L.hearts--;fx.hit=L.hearts;
    S.miss[ex.id]=Math.min(5,(S.miss[ex.id]||0)+1);
    L.sok=0;
    if(L.hearts>0&&!L.iv){const v=pickVariant(ex);L.retried.add(ex);if(v!==ex){L.retried.add(v);L.varSet.add(v);}L.queue.push(v);}
  }
  if(!L.placement){
    if(ok){S.stats.run++;S.stats.runBest=Math.max(S.stats.runBest,S.stats.run);}else S.stats.run=0;
  }
  save();
  snd(ok?'ok':'bad');
  render();
  checkAch();
}
function next(){
  const c=L.cur;if(!c.checked)return;
  L.queue.shift();
  if(!L.placement&&L.hearts<=0&&!c.ok){screen='fail';fx.view=true;render();window.scrollTo(0,0);return;}
  if(!L.queue.length){finish();return;}
  prep();render();window.scrollTo(0,0);
}
function finishPlacement(){
  let known=0;
  for(const ok of L.pl){if(ok)known++;else break;}
  ALL.filter(l=>l.ui<known&&!S.done[l.uid]).forEach(l=>{S.done[l.uid]={a:0,skip:1,t:Date.now()};});
  S.stats.placement=1;save();
  res={placement:true,known,total:L.pl.length,right:L.pl.filter(Boolean).length,next:UNITS[known]?UNITS[known].title:null};
  screen='result';fx.view=true;fx.confetti=known>0;snd('done');
  render();window.scrollTo(0,0);
}
function finish(){
  if(L.placement){finishPlacement();return;}
  const acc=Math.round(L.first/L.total*100);
  const mult=(S.level==='hard'?1.5:1)*(isWeekend()?2:1);
  const gain=Math.round(((L.earn||0)+5+L.fast*2)*mult);
  const notes=[];
  if(L.fast)notes.push('Бонус за швидкі відповіді: +'+L.fast*2);
  if(S.level==='hard')notes.push('Складний режим: досвід ×1,5');
  if(isWeekend())notes.push('Вихідні: досвід ×2');
  const lv0=lvlInfo(S.xp).n;
  S.xp+=gain;
  const li=lvlInfo(S.xp);
  foxRun=true;
  if(li.n>lv0)notes.push('Новий рівень: '+li.n+' («'+li.title+'»)');
  const dxp=S.day.d===today()?S.day.xp:0;
  const goalHit=dxp<S.goal&&dxp+gain>=S.goal;
  S.day={d:today(),xp:dxp+gain};
  {const H=S.hist[today()]||(S.hist[today()]={xp:0,ok:0,bad:0,sec:0});H.xp+=gain;}
  if(goalHit){S.stats.goals++;notes.push('Ціль дня виконано');}
  const st=bumpStreak();
  if(st.froze)notes.push('Заморожування врятувало серію');
  if(st.earned)notes.push('Нове заморожування серії за тиждень занять');
  if(L.review&&!L.custom){
    S.stats.reviews++;
    const seen={};L.allEx.forEach(e=>{seen[e.id.split(':')[0]]=1;});
    Object.keys(seen).forEach(uid=>{if(S.done[uid])S.done[uid].t=Date.now();});
  }else if(L.custom){
    if(L.custom==='daily'&&S.daily!==today()){S.daily=today();S.xp+=15;S.day={d:today(),xp:S.day.xp+15};notes.push('Бонус за задачу дня: +15 XP');}
    if(L.custom==='pj'){const[pid,si]=L.pj;S.pj=S.pj||{};if((S.pj[pid]||0)<=si){S.pj[pid]=si+1;}if(S.pj[pid]>=4)notes.push('Проєкт зібрано повністю');}
    if(L.custom==='iv')S.stats.iv=(S.stats.iv||0)+1;
  }else{
    const prev=S.done[L.info.uid];
    S.done[L.info.uid]={a:Math.max(prev&&!prev.skip?prev.a:0,acc),t:Date.now()};
    S.stats.lessons++;
    if(acc===100)S.stats.perfect++;
  }
  {const w=wkState();w.n++;if(w.n>=WK_GOAL&&!w.got){w.got=true;S.xp+=50;S.stats.wk=(S.stats.wk||0)+1;notes.push('Виклик тижня виконано: +50 XP');}}
  const ivr=L.iv?{time:fmtTime(Date.now()-L.t0),grade:acc>=90?'Відмінно':acc>=70?'Добре':acc>=50?'Непогано':'Потрібно ще потренуватись'}:null;
  save();
  res={info:L.info,ttl:L.ttl||'',iv:ivr,acc,gain,hearts:L.hearts,max:L.max,review:!!L.review,notes,lvl:li.n>lv0?{n:li.n,title:li.title}:null};
  screen='result';fx.view=true;fx.confetti=true;fx.beans=!!res.lvl;
  snd('done');
  render();window.scrollTo(0,0);
  if(li.n>lv0)toast('Новий рівень',li.n+' · '+li.title,'ach');

/* ---------- cloud: account + progress sync (Supabase REST, no library) ---------- */
const CFG=window.BARISTA_CONFIG||{};
const CLOUD=!!(CFG.url&&CFG.key);
const AKEY='barista-auth';
let AUTH=null;try{AUTH=JSON.parse(localStorage.getItem(AKEY));}catch(e){}
const AUI={mode:'in',email:'',msg:'',busy:false,sync:AUTH?'idle':''};
let pushTimer=0;
function authSave(){try{if(AUTH)localStorage.setItem(AKEY,JSON.stringify(AUTH));else localStorage.removeItem(AKEY);}catch(e){}}
function authErr(j){
  const m=String((j&&(j.msg||j.error_description||j.message||j.error))||'');
  if(/invalid login/i.test(m))return 'Невірна пошта або пароль.';
  if(/already registered|already been registered/i.test(m))return 'Ця пошта вже зареєстрована. Спробуй увійти.';
  if(/at least 6|weak/i.test(m))return 'Пароль має бути щонайменше 6 символів.';
  if(/valid email|invalid.*email|unable to validate email/i.test(m))return 'Перевір, чи правильно записана пошта.';
  if(/not confirmed/i.test(m))return 'Підтверди пошту за листом, потім увійди.';
  if(/rate limit|too many/i.test(m))return 'Забагато спроб. Зачекай хвилину.';
  return 'Не вийшло: '+(m||'немає зв\'язку з сервером');
}
async function api(path,opt,authed){
  const h=Object.assign({apikey:CFG.key,'Content-Type':'application/json'},(opt&&opt.headers)||{});
  if(authed){
    if(AUTH&&AUTH.expires_at&&AUTH.expires_at-60<Date.now()/1000)await refreshAuth();
    if(!AUTH)throw new Error('no session');
    h.Authorization='Bearer '+AUTH.access_token;
  }
  const r=await fetch(CFG.url+path,Object.assign({},opt,{headers:h}));
  let j=null;try{j=await r.json();}catch(e){}
  if(!r.ok){const er=new Error('http');er.status=r.status;er.body=j;throw er;}
  return j;
}
function takeSession(j){
  if(!j||!j.access_token)return false;
  AUTH={access_token:j.access_token,refresh_token:j.refresh_token,expires_at:j.expires_at||Math.floor(Date.now()/1000)+(j.expires_in||3600),email:(j.user&&j.user.email)||(AUTH&&AUTH.email)||'',uid:(j.user&&j.user.id)||(AUTH&&AUTH.uid)||''};
  authSave();return true;
}
async function refreshAuth(){
  try{const j=await api('/auth/v1/token?grant_type=refresh_token',{method:'POST',body:JSON.stringify({refresh_token:AUTH.refresh_token})});takeSession(j);}
  catch(e){if(e.status===400||e.status===401){AUTH=null;authSave();AUI.sync='';}else throw e;}
}
function mergeProgress(a,b){ // a = local, b = cloud (both normalised)
  const o=norm(JSON.parse(JSON.stringify(b)));
  for(const k in a.done){const x=a.done[k],y=o.done[k];
    if(!y)o.done[k]=x;
    else if(y.skip&&!x.skip)o.done[k]=x;
    else if(!y.skip&&!x.skip)o.done[k]={a:Math.max(x.a||0,y.a||0),t:Math.max(x.t||0,y.t||0)};}
  for(const k in a.miss)if(!(k in o.miss))o.miss[k]=a.miss[k];
  if(!o.nm&&a.nm){o.nm=a.nm;o.nv=a.nv;o.sex=a.sex;}
  o.pj=Object.assign({},o.pj||{});for(const k in (a.pj||{}))o.pj[k]=Math.max(o.pj[k]||0,a.pj[k]||0);
  o.terms=Object.assign({},o.terms||{});for(const k in (a.terms||{}))o.terms[k]=Math.max(o.terms[k]||0,a.terms[k]||0);
  o.bm=Object.assign({},a.bm||{},o.bm||{});
  if((a.wk&&a.wk.id)&&(!o.wk||a.wk.id>o.wk.id||(a.wk.id===o.wk.id&&a.wk.n>o.wk.n)))o.wk=a.wk;
  if((a.daily||'')>(o.daily||''))o.daily=a.daily;
  if((a.pause||'')>(o.pause||''))o.pause=a.pause;
  o.xp=Math.max(a.xp,b.xp);
  if(a.last>b.last||(a.last===b.last&&a.streak>b.streak)){o.last=a.last;o.streak=a.streak;o.freeze=a.freeze;}
  if(a.day&&b.day){if(a.day.d>b.day.d||(a.day.d===b.day.d&&a.day.xp>b.day.xp))o.day=a.day;}
  for(const k in a.ach)if(!o.ach[k])o.ach[k]=a.ach[k];
  for(const k in a.srs)if(!o.srs[k]||(a.srs[k].d||0)>(o.srs[k].d||0))o.srs[k]=a.srs[k];
  for(const k in a.hist){const x=a.hist[k],y=o.hist[k]||(o.hist[k]={xp:0,ok:0,bad:0,sec:0});['xp','ok','bad','sec'].forEach(f=>{y[f]=Math.max(y[f]||0,x[f]||0);});}
  for(const k in a.us){const x=a.us[k],y=o.us[k]||(o.us[k]={ok:0,bad:0});y.ok=Math.max(y.ok,x.ok);y.bad=Math.max(y.bad,x.bad);}
  for(const k in a.story)o.story[k]=1;
  for(const k in a.stats)o.stats[k]=Math.max(a.stats[k]||0,o.stats[k]||0);
  return o;
}
async function cloudPull(){
  AUI.sync='saving';
  try{
    const rows=await api('/rest/v1/progress?select=data&user_id=eq.'+encodeURIComponent(AUTH.uid),{method:'GET'},true);
    if(rows&&rows[0]&&rows[0].data&&rows[0].data.done){S=mergeProgress(S,norm(rows[0].data));save(true);applyPrefs();resetShown();}
    await cloudPush();
  }catch(e){AUI.sync='err';}
  PULLED=true;
  if(screen!=='lesson'){fx.view=false;render();}
}
async function cloudPush(){
  if(!AUTH)return;
  AUI.sync='saving';
  try{
    await api('/rest/v1/progress?on_conflict=user_id',{method:'POST',headers:{Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify({user_id:AUTH.uid,data:S,updated_at:new Date().toISOString()})},true);
    AUI.sync='ok';
  }catch(e){AUI.sync='err';}

}

async function doAuth(){
  const em=(document.getElementById('em')||{}).value||'',pw=(document.getElementById('pw')||{}).value||'';
  AUI.email=em.trim();
  if(!AUI.email||!pw){AUI.msg='Введи пошту й пароль.';fx.view=false;render();return;}
  AUI.busy=true;AUI.msg='';fx.view=false;render();
  try{
    if(AUI.mode==='up'){
      const j=await api('/auth/v1/signup',{method:'POST',body:JSON.stringify({email:AUI.email,password:pw})});
      if(!takeSession(j)){AUI.busy=false;AUI.mode='in';AUI.msg='Майже готово! Відкрий лист від нас, підтверди пошту й увійди.';fx.view=false;render();return;}
    }else{
      const j=await api('/auth/v1/token?grant_type=password',{method:'POST',body:JSON.stringify({email:AUI.email,password:pw})});
      takeSession(j);
    }
    AUI.busy=false;screen='home';toast('Готово','Ти '+G('ввійшла','ввійшов')+'. Прогрес зберігається в хмарі');
    await cloudPull();
  }catch(e){AUI.busy=false;AUI.msg=authErr(e.body);fx.view=false;render();}
}
async function doSignOut(){
  try{await cloudPush();}catch(e){}

  S=fresh();save(true);applyPrefs();resetShown();screen='home';
  fx.view=true;render();
}

function declWord(w,sex){
  const o={n:w,g:w,d:w,a:w,i:w,l:w,v:w};
  if(w.length<2)return o;
  const e=w.slice(-1),st=w.slice(0,-1),lc=st.slice(-1).toLowerCase(),low=w.toLowerCase();
  const SIB='жчшщ';
  if(e==='я'||e==='Я'){
    if(lc==='і'){return {n:w,g:st+'ї',d:st+'ї',a:st+'ю',i:st+'єю',l:st+'ї',v:st+'є'};}
    return {n:w,g:st+'і',d:st+'і',a:st+'ю',i:st+'ею',l:st+'і',v:st+'ю'};
  }
  if(e==='а'||e==='А'){
    const lat=SIB.includes(lc);
    const mut={'г':'з','к':'ц','х':'с'};
    const sd=mut[lc]?st.slice(0,-1)+mut[lc]:st;
    return {n:w,g:st+(lat?'і':'и'),d:sd+'і',a:st+'у',i:st+(lat?'ею':'ою'),l:sd+'і',v:st+'о'};
  }
  if(sex==='m'){
    if(e==='й'){return {n:w,g:st+'я',d:st+'ю',a:st+'я',i:st+'єм',l:st+'ю',v:st+'ю'};}
    if(e==='ь'){return {n:w,g:st+'я',d:st+'ю',a:st+'я',i:st+'ем',l:st+'ю',v:st+'ю'};}
    if(e==='о'){return {n:w,g:st+'а',d:st+'у',a:st+'а',i:st+'ом',l:st+'у',v:st+'е'};}
    if(!'аеєиіїоуюя'.includes(e)){
      const vm={'г':'же','к':'че','х':'ше'};
      const v=vm[e]?st+vm[e]:w+'е';
      return {n:w,g:w+'а',d:w+'у',a:w+'а',i:w+'ом',l:w+'у',v:v};
    }
    return o;
  }
  if(low.endsWith('ов')&&low.startsWith('любов')){return {n:w,g:w+'і',d:w+'і',a:w,i:w+'’ю',l:w+'і',v:w+'е'};}
  return o;
}
function declName(raw,sex){
  const parts=String(raw||'').trim().split(/([\s-]+)/);
  const r={n:'',g:'',d:'',a:'',i:'',l:'',v:''};
  parts.forEach(p=>{
    if(!p)return;
    if(/^[\s-]+$/.test(p)){for(const k in r)r[k]+=p;return;}
    const x=declWord(p,sex);for(const k in r)r[k]+=x[k];
  });
  return r;
}

function speak(k){
  if(!('speechSynthesis' in window)){toast('Немає озвучення','Цей браузер його не підтримує');return;}
  const ss=window.speechSynthesis;
  if(ss.speaking){ss.cancel();return;}
  const u=new SpeechSynthesisUtterance(k.h+'. '+k.p.replace(/`/g,'')+(k.code?' Приклад коду показано на екрані.':''));
  const v=ss.getVoices().find(x=>/^uk/i.test(x.lang));
  if(v){u.voice=v;u.lang=v.lang;}else{u.lang='uk-UA';if(ss.getVoices().length)toast('Українського голосу немає','Прочитаю стандартним');}
  u.rate=S.rate||.95;ss.speak(u);
}
function speakText(t){
  if(!t||!('speechSynthesis' in window)){toast('Немає озвучення','Цей браузер його не підтримує');return;}

}

const unb64=s=>{try{return s?decodeURIComponent(escape(atob(s))):'';}catch(e){return '';}};
async function javaLang(){
  if(IDE.lang)return IDE.lang;
  try{
    const r=await fetch(RUNNER+'/languages');const j=await r.json();
    const ids=j.filter(x=>/^Java \(OpenJDK/i.test(x.name)).map(x=>x.id);
    IDE.lang=ids.length?Math.max.apply(null,ids):62;
  }catch(e){IDE.lang=62;}
  return IDE.lang;
}
async function execJava(code,stdin){
  try{
    const lang=await javaLang();const ctrl=new AbortController();const to=setTimeout(()=>ctrl.abort(),25000);
    const r=await fetch(RUNNER+'/submissions?base64_encoded=true&wait=true',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({source_code:b64(code),language_id:lang,stdin:b64(stdin||'')}),signal:ctrl.signal});
    clearTimeout(to);if(!r.ok)throw new Error('http');
    const j=await r.json();const so=unb64(j.stdout),se=unb64(j.stderr),co=unb64(j.compile_output);
    if(co)return 'Помилка компіляції:\n'+co;
    if(se)return (so?so+'\n':'')+'Помилка виконання:\n'+se;
    return so||'(програма нічого не вивела)';
  }catch(e){return 'Не вдалося зв’язатися із сервером запуску коду. Перевір інтернет.';}
}
async function runCode(){
  if(IDE.busy)return;
  IDE.busy=true;IDE.out='Запускаю…';IDE.kind='';IDE.errLine=0;
  const ca=document.getElementById('ide-code'),si=document.getElementById('ide-in');
  if(ca)IDE.code=ca.value;if(si)IDE.stdin=si.value;
  render();
  try{
    const lang=await javaLang();
    const ctrl=new AbortController();const to=setTimeout(()=>ctrl.abort(),25000);
    const r=await fetch(RUNNER+'/submissions?base64_encoded=true&wait=true',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({source_code:b64(IDE.code),language_id:lang,stdin:b64(IDE.stdin)}),signal:ctrl.signal});
    clearTimeout(to);
    if(!r.ok)throw new Error('http '+r.status);
    const j=await r.json();
    const so=unb64(j.stdout),se=unb64(j.stderr),co=unb64(j.compile_output);
    if(co){IDE.kind='err';IDE.out='Помилка компіляції:\n'+co;IDE.errLine=+((co.match(/Main\.java:(\d+):/)||[])[1]||0);}
    else if(se){IDE.kind='err';IDE.out=(so?so+'\n':'')+'Помилка виконання:\n'+se;}
    else{IDE.kind='ok';IDE.out=so||'(програма нічого не вивела)';}
  }catch(e){
    IDE.kind='err';IDE.out='Не вдалося зв’язатися із сервером запуску коду. Перевір інтернет і спробуй ще раз.';
  }
  IDE.busy=false;
  if(screen==='ide'){fx.view=false;render();}
}

  const rows=Object.keys(S.us).map(k=>+k).filter(k=>UNITS[k]).sort((a,b)=>a-b);
  h+='<section class="card"><h2>Точність за розділами</h2>';
  if(!rows.length)h+='<p class="desc">Пройди кілька уроків, і тут з’явиться статистика.</p>';
  rows.forEach(k=>{const u=S.us[k],n=u.ok+u.bad,p=Math.round(u.ok/n*100);
    h+='<div class="urow"><span class="un">'+(k+1)+'. '+esc(UNITS[k].title)+'</span><div class="track"><div class="fill'+(p<70?' low':'')+'" style="width:'+p+'%"></div></div><span class="up">'+p+'%</span></div>';});
  const wk=weakUnits();
  if(wk.length)h+='<p class="desc">Найслабше: '+wk.slice(0,2).map(x=>esc(UNITS[x.ui].title)).join(', ')+'.</p><button class="btn" style="margin-top:12px" data-act="weak">Потренувати слабкі місця</button>';
  else if(rows.length)h+='<p class="desc">Слабких місць не видно. Так тримати.</p>';
  h+='</section>';
  // wardrobe
  const lv=lvlInfo(S.xp).n;
  h+='<section class="card"><h2>Гардероб лисички</h2><div class="ward-m'+(fx.spin?' spin':'')+'">'+mascot('happy',150)+'</div><p class="desc">Нові речі відкриваються з рівнями. Зараз у тебе рівень '+lv+'.</p>';
  Object.keys(FIT).forEach(slot=>{
    h+='<p class="ward-s">'+FITSLOT[slot]+'</p><div class="ward-r">';
    FIT[slot].forEach(it=>{const un=fitUnlocked(it),on=fitNow(slot)===it.id;
      h+='<button class="uchip'+(on?' on':'')+'" data-act="fit" data-slot="'+slot+'" data-v="'+it.id+'"'+(un?'':' disabled')+'>'+esc(it.t)+(un?'':(it.ac?' · '+ACH.find(a=>a.id===it.ac).t:' · рівень '+it.lv))+'</button>';});
    h+='</div>';
  });
  h+='</section>';
  // achievements
  const got=ACH.filter(a=>S.ach[a.id]).length;
  h+='<h2 class="pg-s">Досягнення · '+got+' / '+ACH.length+'</h2><div class="agrid">';
  ACH.forEach((a,i)=>{const on=!!S.ach[a.id],dt=on?new Date(S.ach[a.id]):null;
    h+='<button class="medal'+(on?' on':'')+'" style="--i:'+i+'" data-act="medal" data-i="'+i+'" aria-label="'+esc(a.t+'. '+a.d)+'"><span class="mc">'+(on?IC.star:IC.lock)+'</span><b>'+esc(a.t)+'</b><small>'+(on?String(dt.getDate()).padStart(2,'0')+'.'+String(dt.getMonth()+1).padStart(2,'0'):'закрито')+'</small></button>';});
  h+='</div></div>'+tabs('stats');
  return h;
}

/* ---------- service worker (only on a real https site, never in the artifact viewer) ---------- */
try{
  if('serviceWorker' in navigator&&location.protocol==='https:'&&(window.BARISTA_CONFIG||/github\.io$/.test(location.hostname))){
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  }
}catch(e){}

render();
checkUpdate();
document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkUpdate();});
setInterval(checkUpdate,600000);
function netBanner(){const e=document.getElementById('net');if(!navigator.onLine){if(!e){const d=document.createElement('div');d.id='net';d.setAttribute('role','status');d.textContent='Без інтернету: прогрес зберігається на пристрої';document.body.appendChild(d);}}else if(e)e.remove();}
window.addEventListener('offline',netBanner);
window.addEventListener('online',()=>{netBanner();try{if(CLOUD&&AUTH)cloudPush();}catch(e){}});
netBanner();
setInterval(skyUpdate,600000);
})();

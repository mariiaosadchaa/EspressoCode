/* ---------- sound ---------- */
let actx=null;
const SEQ={
  ok:[[660,0,.1],[880,.09,.16]],
  bad:[[196,0,.18],[147,.15,.26]],
  done:[[523,0,.12],[659,.11,.12],[784,.22,.12],[1047,.33,.34]],
  star:[[784,0,.1],[988,.1,.1],[1319,.2,.24]]
};
function snd(k){
  if(!S.sound||!SEQ[k])return;
  try{
    actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    if(actx.state==='suspended')actx.resume();
    const t0=actx.currentTime;
    SEQ[k].forEach(n=>{
      const o=actx.createOscillator(),g=actx.createGain();
      o.type=k==='bad'?'triangle':'sine';o.frequency.value=n[0];
      g.gain.setValueAtTime(0.0001,t0+n[1]);
      g.gain.exponentialRampToValueAtTime(0.12,t0+n[1]+0.015);
      g.gain.exponentialRampToValueAtTime(0.0001,t0+n[1]+n[2]);
      o.connect(g);g.connect(actx.destination);
      o.start(t0+n[1]);o.stop(t0+n[1]+n[2]+0.03);
    });
  }catch(e){}
}

/* ---------- toast ---------- */
const toasts=[];let toastBusy=false;
function toast(title,msg,kind){toasts.push({title,msg,kind});pumpToast();}
function pumpToast(){
  if(toastBusy||!toasts.length)return;
  toastBusy=true;
  const t=toasts.shift(),el=document.createElement('div');
  el.className='toast'+(t.kind==='ach'?' ach':'');
  el.setAttribute('role','status');
  el.innerHTML='<div class="t-ico">'+(t.kind==='ach'?IC.star:IC.check)+'</div><div class="t-tx"><b>'+esc(t.title)+'</b><span>'+esc(t.msg)+'</span></div>';
  document.body.appendChild(el);
  setTimeout(()=>{el.classList.add('out');},3200);
  setTimeout(()=>{if(el.parentNode)el.parentNode.removeChild(el);toastBusy=false;pumpToast();},3700);
}

function pickVariant(ex){
  try{
    const maxN=L.info&&L.info.n>=0?L.info.n:1e9;
    let src=[];
    if(TRNUI[ex.ui])src=TRNUI[ex.ui]();
    else if(ex.ui===100)src=PROJECTS.flatMap(p=>p.steps.flatMap(s=>s.ex));
    else if(UNITS[ex.ui])src=ALL.filter(l=>l.ui===ex.ui&&l.n<=maxN&&(maxN<1e9||S.done[l.uid])).flatMap(l=>l.lesson.ex);
    const free=e=>e!==ex&&!L.queue.includes(e)&&!(L.asked&&L.asked.has(e));
    let c=src.filter(e=>free(e)&&e.t===ex.t);
    if(!c.length)c=src.filter(free);
    if(!c.length&&UNITS[ex.ui]){
      const wide=ALL.filter(l=>l.ui===ex.ui).flatMap(l=>l.lesson.ex).filter(free);
      c=wide.filter(e=>e.t===ex.t);if(!c.length)c=wide;
    }
    if(!c.length)return ex;
    const w=s=>new Set(String(s).toLowerCase().split(/[^a-zа-яіїєґ0-9]+/).filter(x=>x.length>3));
    const wq=w(ex.q+' '+(ex.why||''));
    c=shuffle(c).map(e=>({e,s:[...w(e.q+' '+(e.why||''))].filter(x=>wq.has(x)).length})).sort((a,b)=>b.s-a.s);
    return c[0].e;
  }catch(e){return ex;}
}
function pickChallenge(ex){
  try{
    const maxN=L.info&&L.info.n>=0?L.info.n:-1;if(maxN<0||L.review||L.placement)return null;
    const c=ALL.filter(l=>l.ui===ex.ui&&l.n<=maxN).flatMap(l=>l.lesson.ex).filter(e=>['bug','type','fill','order'].includes(e.t)&&!L.queue.includes(e)&&!(L.asked&&L.asked.has(e)));
    return c.length?shuffle(c)[0]:null;
  }catch(e){return null;}
}
const ptsFor=n=>n<=0?10:n===1?5:n===2?3:1;
function wrapJava(code){
  if(!code)return null;
  if(/\bclass\s+\w+/.test(code)&&/static\s+void\s+main/.test(code))return code;
  if(/\bclass\s+\w+|\binterface\s+\w+|\brecord\s+\w+/.test(code))return null;
  if(/\[\[\d\]\]/.test(code))return null;
  const imp='import java.util.*;\nimport java.util.stream.*;\nimport java.util.function.*;\n';
  return imp+'public class Main {\n    public static void main(String[] args) throws Exception {\n'+code.split('\n').map(l=>'        '+l).join('\n')+'\n    }\n}\n';
}
function exCode(ex,c){
  try{
    if(ex.t==='out'||ex.t==='mc')return ex.code||null;
    if(ex.t==='fill'){let k=0;return ex.code.replace(/\[\[(\d)\]\]/g,(m,i)=>ex.ans[+i]);}
    if(ex.t==='order')return ex.lines.join('\n');
    if(ex.t==='type')return ex.code?ex.code.replace(/_{2,}|\[\[\d\]\]/,ex.acc[0]):null;
  }catch(e){}
  return null;
}

function moreHtml(ex,c){

      const wq=new Set(String(ex.q+' '+(ex.why||'')+' '+(ex.code||'')).toLowerCase().split(/[^a-zа-яіїєґ0-9.]+/).filter(x=>x.length>3));
      const sc=cards.map((k,i)=>({k,i,s:[...new Set(String(k.h+' '+k.p).toLowerCase().split(/[^a-zа-яіїєґ0-9.]+/).filter(x=>x.length>3))].filter(x=>wq.has(x)).length}));
      sc.sort((a,b)=>b.s-a.s||a.i-b.i);
      h+='<h4>З теорії уроку</h4>';
      sc.slice(0,2).forEach(x=>{h+='<div class="more-c"><b>'+esc(x.k.h)+'</b><p>'+fmt(x.k.p)+'</p>'+(x.k.code?codeBlock(x.k.code):'')+'</div>';});

  }catch(e){}
  {const tl=termsIn(exText(ex),3);if(tl.length)h+='<h4>Слова із завдання</h4>'+termRows(tl);}
  const code=isSh(exCode(ex,c))||isSh(ex.code)?null:wrapJava(exCode(ex,c));

{t:'Ключове слово',c:'Основи',d:'Слово, яке Java зарезервувала для себе, наприклад class, if чи return. Назвати ним змінну не можна.',ex:null,k:['зарезерв','змінн','class','return'],s:'Це слово «зачинено» на дверях: воно вже має своє значення, і його не можна брати для іншого.'},
{t:'Ідентифікатор',c:'Основи',d:'Ім\'я, яке програміст дає змінній, методу чи класу. Воно не може починатися з цифри й не може бути ключовим словом.',ex:'int cupCount = 2;',k:['змінн','метод','цифр','ключов'],s:'Це підпис на кухлі, щоб за ним знайти саме свій напій.'},
{t:'System.out.println',c:'Основи',d:'Команда, яка друкує текст на екран і переходить на новий рядок. Через неї програма розмовляє з користувачем.',ex:'System.out.println("Привіт");',k:['друку','екран','рядок','текст'],s:'Це бариста, який голосно вигукує: «Латте готове!»'},
{t:'Вираз',c:'Основи',d:'Частина коду, яка дає одне значення. Наприклад, 2 + 3 дає 5, а x > 1 дає true або false.',ex:'int r = 2 + 3 * 4;',k:['значенн','дає','код','true'],s:'Це підрахунок чека: з кількох цифр виходить одна сума.'},
{t:'Оператор',c:'Основи',d:'Знак, який виконує дію над значеннями: +, -, *, /, %, ==. Значення, над якими він працює, називають операндами.',ex:'int a = 7 % 3;',k:['дію','значенн','операнд','працює'],s:'Це кнопка на касі: плюс складає суми, мінус віднімає знижку.'},
{t:'Параметр і аргумент',c:'Основи',d:'Параметр це змінна в дужках методу, а аргумент це значення, яке передають при виклику. Так метод отримує дані для роботи.',ex:'static int twice(int x) {\n    return x * 2;\n}\n// twice(5): тут 5 це аргумент',k:['змінн','аргумент','виклик','метод'],s:'Параметр це порожній рядок у бланку замовлення, а аргумент те, що клієнт туди вписав.'},
{t:'int',c:'Типи й змінні',d:'Тип для цілих чисел приблизно від мінус двох до плюс двох мільярдів. Дробової частини в нього немає.',ex:'int cups = 12;',k:['цілих','чисел','мільярд','частин'],s:'Це лічба цілих чашок: можна три, не можна три з половиною.'},
{t:'double',c:'Типи й змінні',d:'Тип для дробових чисел. Він зберігає значення приблизно, тому в обчисленнях можливі крихітні похибки.',ex:'double t = 0.1 + 0.2;',k:['дробових','приблизно','похибк','значенн'],s:'Це мірний стакан з поділками: молока можна налити 0,3 л, але ніколи ідеально точно.'},
{t:'char',c:'Типи й змінні',d:'Тип для одного символу, записаного в одинарних лапках. Під капотом це число з таблиці символів.',ex:'char c = \'A\';\nint code = c;',k:['одного','символ','лапк','число'],s:'Це одна літера на стікері, який клеять на стакан.'},
{t:'long',c:'Типи й змінні',d:'Тип для дуже великих цілих чисел. Літерал для нього записують з буквою L наприкінці.',ex:'long big = 3000000000L;',k:['великих','цілих','букв','записують'],s:'Це великий склад, де лічать не чашки, а мільйони зерен.'},
{t:'Приведення типів',c:'Типи й змінні',d:'Перетворення значення одного типу в інший. Ширший тип у вужчий треба писати вручну, і дробова частина при цьому відкидається.',ex:'double d = 9.8;\nint i = (int) d;',k:['значенн','типу','вручну','дробова'],s:'Це коли 9,8 склянки округлюють до 9 цілих, бо половина склянки на облік не йде.'},
{t:'Клас-обгортка',c:'Типи й змінні',d:'Об\'єктна версія примітивного типу: Integer для int, Double для double. Потрібна там, де дозволені лише об\'єкти, наприклад у списках.',ex:'Integer n = 5;\nList<Integer> list = new ArrayList<>();',k:['об\'єкт','примітивн','типу','списк'],s:'Це кавове зерно в подарунковій коробці: усередині те саме, але коробку можна покласти на полицю.'},
{t:'Область видимості',c:'Типи й змінні',d:'Місце в коді, де змінну можна використовувати. Змінна, оголошена у фігурних дужках, зникає за їхніми межами.',ex:'{\n    int inside = 1;\n}\n// тут inside вже не існує',k:['змінн','фігурн','оголош','коді'],s:'Це фартух бариста: працює лише в межах його зміни за барною стійкою.'},
{t:'var',c:'Типи й змінні',d:'Слово, яке просить Java самій визначити тип локальної змінної за значенням праворуч. Тип від цього не зникає, просто його не пишуть.',ex:'var name = "Оля";',k:['тип','локальн','значенн','визначит'],s:'Це коли не пишеш на стакані «еспресо», бо за запахом і так видно, що всередині.'},
{t:'Переповнення',c:'Типи й змінні',d:'Ситуація, коли результат не вміщується в тип і перекручується в протилежний бік. Помилки при цьому немає, число просто стає хибним.',ex:'int max = Integer.MAX_VALUE;\nint wrong = max + 1;',k:['результат','тип','вміщуєт','число'],s:'Це кухоль, куди доливають зайве: кава тече через край і на столі з\'являється біда.'},
{t:'Константа',c:'Типи й змінні',d:'Змінна, значення якої задають один раз і більше не змінюють. У Java її роблять словами static final, а ім\'я пишуть великими буквами.',ex:'static final int MAX_CUPS = 5;',k:['значенн','раз','final','велик'],s:'Це ціна, надрукована в меню: її не міняють посеред дня.'},
{t:'if/else',c:'Керування потоком',d:'Умовна інструкція: якщо умова істинна, виконується одна гілка коду, інакше інша.',ex:'int t = 20;\nif (t > 25) {\n    System.out.println("жарко");\n} else {\n    System.out.println("нормально");\n}',k:['умов','гілк','істинн','інакш'],s:'Якщо жарко, наливаємо холодну каву, інакше гарячу.'},
{t:'switch',c:'Керування потоком',d:'Конструкція, яка порівнює одне значення з кількома варіантами case і запускає підходящий. Вона зручніша за довгий ланцюжок if.',ex:'int d = 2;\nswitch (d) {\n    case 1 -> System.out.println("пн");\n    case 2 -> System.out.println("вт");\n    default -> System.out.println("інший");\n}',k:['значенн','варіант','case','ланцюж'],s:'Це меню з кнопками: натиснув номер напою, і готується саме він.'},
{t:'while',c:'Керування потоком',d:'Цикл, який повторює код, поки умова істинна. Умову перевіряють перед кожним проходом.',ex:'int i = 0;\nwhile (i < 3) {\n    i++;\n}',k:['повторю','умов','істинн','перевіря'],s:'Поки в черзі є клієнти, бариста продовжує готувати.'},
{t:'do-while',c:'Керування потоком',d:'Цикл, який спочатку виконує тіло, а вже потім перевіряє умову. Тому тіло виконається щонайменше один раз.',ex:'int i = 0;\ndo {\n    i++;\n} while (i < 3);',k:['тіл','умов','перевіря','раз'],s:'Спершу робимо пробну чашку, а потім питаємо, чи треба ще.'},
{t:'for-each',c:'Керування потоком',d:'Цикл, який по черзі бере кожен елемент масиву чи колекції. Номери елементів тут не потрібні.',ex:'int[] nums = {1, 2, 3};\nfor (int n : nums) {\n    System.out.println(n);\n}',k:['кожен','елемент','масив','колекц'],s:'Це обхід полиці: береш кожну банку по черзі, не рахуючи місць.'},
{t:'break',c:'Керування потоком',d:'Інструкція, яка негайно виходить із циклу або з switch. Решта проходів циклу пропускається.',ex:'for (int i = 0; i < 10; i++) {\n    if (i == 3) break;\n}',k:['виходить','цикл','негайно','switch'],s:'Знайшов потрібне зерно на полиці, то далі не шукаєш і йдеш до кавомашини.'},
{t:'continue',c:'Керування потоком',d:'Інструкція, яка пропускає решту поточного проходу циклу й переходить до наступного. Сам цикл при цьому не зупиняється.',ex:'for (int i = 0; i < 5; i++) {\n    if (i == 2) continue;\n    System.out.println(i);\n}',k:['пропуска','проходу','наступн','цикл'],s:'Замовлення без цукру пропускаємо етап із цукром і переходимо до наступного клієнта.'},
{t:'Тернарний оператор',c:'Керування потоком',d:'Короткий запис if/else в одному виразі: умова ? значення1 : значення2. Він повертає одне з двох значень.',ex:'int age = 20;\nString s = age >= 18 ? "дорослий" : "дитина";',k:['запис','умов','вираз','значенн'],s:'Це швидке питання на касі: «З молоком чи без?» і одразу відповідь.'},
{t:'Логічні оператори',c:'Керування потоком',d:'Оператори && (і), || (або) та ! (не). Вони поєднують умови в одну більшу умову.',ex:'boolean ok = (5 > 3) && !(2 > 4);',k:['умов','поєдн','або','більшу'],s:'Знижка діє, якщо клієнт студент І прийшов зранку, або якщо в нього день народження.'},
{t:'return',c:'Керування потоком',d:'Інструкція, яка завершує метод і повертає результат туди, звідки метод викликали.',ex:'static int three() {\n    return 3;\n}',k:['завершу','метод','результат','повертає'],s:'Бариста ставить готову чашку на стійку: робота закінчена, результат у клієнта.'},
{t:'this',c:'ООП',d:'Слово, яке означає цей самий об\'єкт, у якому зараз виконується код. Його пишуть, щоб відрізнити поле від параметра з тим самим іменем.',ex:'class Cup {\n    int ml;\n    void setMl(int ml) {\n        this.ml = ml;\n    }\n}',k:['об\'єкт','поле','параметр','імен'],s:'Це коли бариста каже «мій фартух» про той, що на ньому, а не про чужий.'},
{t:'super',c:'ООП',d:'Слово, яке звертається до батьківського класу. Через нього викликають конструктор або метод батька.',ex:'class A {\n    String hi() { return "A"; }\n}\nclass B extends A {\n    String hi() { return super.hi() + "B"; }\n}',k:['батьків','клас','конструктор','метод'],s:'Це «спочатку зроби, як навчив старший бариста, а потім додай своє».'},
{t:'Модифікатор доступу',c:'ООП',d:'Слово public, private чи protected перед членом класу. Воно вирішує, хто ще може його бачити й використовувати.',ex:'class Safe {\n    private int code = 1234;\n    public int open() { return code; }\n}',k:['public','private','клас','вирішує'],s:'Це таблички: «вхід для всіх» біля зали й «тільки для персоналу» на дверях кухні.'},
{t:'Геттер і сеттер',c:'ООП',d:'Два прості методи для приватного поля: геттер його повертає, сеттер змінює. Через сеттер можна додати перевірку значення.',ex:'class Cup {\n    private int ml;\n    int getMl() { return ml; }\n    void setMl(int ml) {\n        if (ml >= 0) this.ml = ml;\n    }\n}',k:['приватн','поля','повертає','перевірк'],s:'Це віконце на кухні: через нього можна подивитися, скільки молока, і попросити долити.'},
{t:'Композиція',c:'ООП',d:'Спосіб побудови класу, коли в ньому лежить об\'єкт іншого класу як поле. Це відношення «має», на відміну від «є» в наслідуванні.',ex:'class Engine { }\nclass Car {\n    Engine engine = new Engine();\n}',k:['об\'єкт','поле','наслідуван','клас'],s:'У кав\'ярні є кавомашина: вона не різновид кав\'ярні, а її частина.'},
{t:'instanceof',c:'ООП',d:'Оператор, який перевіряє, чи є об\'єкт екземпляром певного класу. Він дає true або false.',ex:'Object o = "кава";\nboolean b = o instanceof String;',k:['перевіря','об\'єкт','клас','true'],s:'Це питання «це точно круасан?» перед тим, як класти випічку на тарілку.'},
{t:'toString',c:'ООП',d:'Метод, який повертає текстовий опис об\'єкта. Його викликають автоматично при друці об\'єкта.',ex:'class Cat {\n    @Override\n    public String toString() { return "кіт"; }\n}',k:['текстов','опис','об\'єкт','друц'],s:'Це підпис на чеку: замість «замовлення №5Ж13» читаємо «Латте, великий».'},
{t:'equals',c:'ООП',d:'Метод, який порівнює два об\'єкти за змістом. Оператор == порівнює лише адреси, а equals може порівнювати поля.',ex:'String a = new String("x");\nString b = new String("x");\nboolean same = a.equals(b);',k:['порівню','об\'єкт','зміст','поля'],s:'Дві різні чашки з однаковим латте вважаємо однаковими замовленнями, хоч чашки різні.'},
{t:'hashCode',c:'ООП',d:'Метод, який повертає число-відбиток об\'єкта. Рівні за equals об\'єкти повинні мати однаковий hashCode.',ex:'int h = "кава".hashCode();',k:['число','відбиток','об\'єкт','однаков'],s:'Це номер полиці, за яким швидко знаходять банку, не перебираючи всі.'},
{t:'Посилання',c:'ООП',d:'Змінна об\'єктного типу зберігає не сам об\'єкт, а посилання на нього. Тому дві змінні можуть вказувати на один об\'єкт.',ex:'StringBuilder a = new StringBuilder("A");\nStringBuilder b = a;\nb.append("!");',k:['посиланн','змінн','об\'єкт','вказув'],s:'Це номер столика на чеку: двоє людей можуть мати один номер і сидіти за одним столом.'},
{t:'ArrayList',c:'Колекції',d:'Список на основі масиву, який сам збільшується при додаванні елементів. Швидко читає за номером, але повільніше вставляє в середину.',ex:'List<String> l = new ArrayList<>();\nl.add("латте");\nString first = l.get(0);',k:['масив','елемент','номер','повільн'],s:'Це ряд стаканчиків на полиці: легко взяти п\'ятий, але важко вставити новий між двома.'},
{t:'HashMap',c:'Колекції',d:'Мапа, яка за ключем знаходить значення майже миттєво завдяки hashCode. Порядок пар у ній не гарантований.',ex:'Map<String, Integer> m = new HashMap<>();\nm.put("еспресо", 50);\nint ml = m.get("еспресо");',k:['ключем','значенн','hashCode','миттєво'],s:'Це картотека рецептів: назвав напій, і одразу дістаєш картку, але в якому порядку вони лежать, невідомо.'},
{t:'HashSet',c:'Колекції',d:'Множина без повторів, яка не пам\'ятає порядок додавання. Перевірка, чи є елемент, відбувається дуже швидко.',ex:'Set<String> s = new HashSet<>();\ns.add("чай");\nboolean has = s.contains("чай");',k:['повторів','порядок','елемент','швидко'],s:'Це список постійних клієнтів: кожне ім\'я записане лише раз, а чи є там людина, видно миттєво.'},
{t:'TreeMap',c:'Колекції',d:'Мапа, яка завжди тримає ключі відсортованими. Вона трохи повільніша, зате дає впорядкований перегляд.',ex:'Map<String, Integer> m = new TreeMap<>();\nm.put("б", 2);\nm.put("а", 1);',k:['ключі','відсортован','впорядкован','повільн'],s:'Це меню за алфавітом: напої завжди стоять рядком від А до Я.'},
{t:'Iterator',c:'Колекції',d:'Об\'єкт, який по черзі віддає елементи колекції. Саме його роботу виконує цикл for-each під капотом.',ex:'List<Integer> l = List.of(1, 2);\nIterator<Integer> it = l.iterator();\nwhile (it.hasNext()) {\n    System.out.println(it.next());\n}',k:['черзі','елемент','колекції','цикл'],s:'Це офіціант із підносом, який по одній подає чашки з довгого столу.'},
{t:'Comparable',c:'Колекції',d:'Інтерфейс, який вчить клас порівнювати свої об\'єкти між собою через метод compareTo. Завдяки йому об\'єкти можна сортувати.',ex:'class Cup implements Comparable<Cup> {\n    int ml;\n    public int compareTo(Cup o) {\n        return Integer.compare(ml, o.ml);\n    }\n}',k:['вчить','порівню','compareTo','сортув'],s:'Чашки самі знають, яка більша: «великий» завжди стоїть за «малим».'},
{t:'Comparator',c:'Колекції',d:'Окремий об\'єкт-правило, який вирішує, який з двох елементів іде першим. Дозволяє сортувати по-різному, не змінюючи сам клас.',ex:'List<String> l = new ArrayList<>(List.of("bb", "a"));\nl.sort(Comparator.comparing(String::length));',k:['правил','елемент','сортув','клас'],s:'Це інструкція адміністратора: сьогодні сортуємо замовлення за часом, завтра за ціною.'},
{t:'Черга (Queue)',c:'Колекції',d:'Колекція, де елемент, який зайшов першим, виходить першим. Додають у кінець, а беруть з початку.',ex:'Queue<String> q = new LinkedList<>();\nq.add("Оля");\nString next = q.poll();',k:['першим','кінець','початк','елемент'],s:'Це жива черга до каси: хто прийшов раніше, того й обслужили.'},
{t:'Collections',c:'Колекції',d:'Клас із готовими допоміжними методами для колекцій: сортування, розвертання, пошук найбільшого. Не плутай його з інтерфейсом Collection.',ex:'List<Integer> l = new ArrayList<>(List.of(3, 1, 2));\nCollections.sort(l);',k:['допоміжн','методами','сортування','колекцій'],s:'Це набір кухонних інструментів, щоб швидко розкласти чашки за розміром чи перевернути стос.'},
{t:'Optional',c:'Колекції',d:'Коробочка, яка або містить значення, або порожня. Вона допомагає не повертати null і не ловити NullPointerException.',ex:'Optional<String> o = Optional.of("кава");\nString v = o.orElse("нічого");',k:['значенн','порожн','null','поверта'],s:'Це закрита коробка з написом: усередині може бути печиво, а може бути порожньо.'},
{t:'throw',c:'Винятки',d:'Слово, яким програміст сам кидає виняток у потрібний момент. Після нього звичайний хід методу переривається.',ex:'static void check(int age) {\n    if (age < 0) throw new IllegalArgumentException("вік");\n}',k:['кидає','виняток','метод','перерива'],s:'Це коли бариста гукає «молоко скисло!» і зупиняє приготування.'},
{t:'throws',c:'Винятки',d:'Слово в заголовку методу, яке попереджає, що метод може кинути певний виняток. Той, хто його викликає, має це врахувати.',ex:'static void read() throws Exception {\n    throw new Exception("помилка");\n}',k:['заголов','попереджає','виняток','метод'],s:'Це табличка на кавомашині: «може зламатися, будь готовий».'},
{t:'finally',c:'Винятки',d:'Блок після try/catch, який виконується завжди: і при помилці, і без неї. У ньому закривають ресурси.',ex:'try {\n    System.out.println("працюю");\n} finally {\n    System.out.println("прибираю");\n}',k:['після','завжди','помилц','ресурс'],s:'Навіть якщо кава пролилась, бариста все одно витирає стійку наприкінці зміни.'},
{t:'Checked exception',c:'Винятки',d:'Виняток, про який компілятор змушує подбати наперед: або обробити його, або оголосити через throws. Типовий приклад це IOException.',ex:'static void f() throws java.io.IOException {\n    throw new java.io.IOException();\n}',k:['компілятор','обробит','throws','змушу'],s:'Це правило санстанції: ти мусиш мати план на випадок пожежі ще до відкриття.'},
{t:'Unchecked exception',c:'Винятки',d:'Виняток, який компілятор не змушує обробляти. До них належать помилки програміста, як ділення на нуль чи вихід за межі масиву.',ex:'int x = 10 / 0;',k:['компілятор','обробля','програміст','нуль'],s:'Це несподіваний прикрий випадок, як упущена чашка: ніхто не вимагав плану заздалегідь.'},
{t:'NullPointerException',c:'Винятки',d:'Помилка, яка виникає при виклику методу через null. Змінна ні на що не вказує, тож нічого викликати.',ex:'String s = null;\nint n = s.length();',k:['null','виклик','вказує','метод'],s:'Це коли просять налити каву з порожнього місця: чашки там немає.'},
{t:'ArrayIndexOutOfBoundsException',c:'Винятки',d:'Помилка, коли звертаються до елемента за номером, якого немає. У масиві з трьох елементів допустимі номери 0, 1 і 2.',ex:'int[] a = new int[3];\nint x = a[3];',k:['елемент','номер','масив','звертаю'],s:'Це спроба взяти чашку з четвертої комірки, коли на полиці лише три.'},
{t:'NumberFormatException',c:'Винятки',d:'Помилка, яка виникає, коли текст не вдається перетворити на число. Наприклад, parseInt("abc").',ex:'int n = Integer.parseInt("abc");',k:['текст','перетвор','число','виникає'],s:'Це коли в замовленні замість кількості чашок написано «багато».'},
{t:'Stack trace',c:'Винятки',d:'Список викликів методів у момент помилки. З нього видно файл і рядок, де все зламалось.',ex:'try {\n    int x = 1 / 0;\n} catch (Exception e) {\n    e.printStackTrace();\n}',k:['викликів','рядок','помилки','файл'],s:'Це журнал зміни: за ним видно, хто, коли й де розбив склянку.'},
{t:'try-with-resources',c:'Винятки',d:'Різновид try, який сам закриває відкритий ресурс після блоку. Так не можна забути викликати close.',ex:'try (Scanner sc = new Scanner("a b")) {\n    System.out.println(sc.next());\n}',k:['закрива','ресурс','блок','close'],s:'Це кран, який сам вимикається, коли відійшов від чашки.'},
{t:'Scanner',c:'Рядки й ввід',d:'Клас, який читає дані: з клавіатури, файлу чи рядка. Він ділить вхідний текст на слова й числа.',ex:'Scanner sc = new Scanner("12 кава");\nint n = sc.nextInt();\nString w = sc.next();',k:['читає','клавіатур','текст','слова'],s:'Це касир, який слухає клієнта і записує слова та числа окремо.'},
{t:'StringBuilder',c:'Рядки й ввід',d:'Клас для збирання тексту по частинах без створення нових рядків щоразу. Він змінюваний, на відміну від String.',ex:'StringBuilder sb = new StringBuilder();\nsb.append("ла").append("те");\nString s = sb.toString();',k:['збиран','текст','змінюван','рядк'],s:'Це одна чашка, до якої доливають по краплі, а не нова чашка на кожну краплю.'},
{t:'Конкатенація',c:'Рядки й ввід',d:'З\'єднання рядків в один. Її виконує оператор +, і число поруч із рядком теж стає текстом.',ex:'String s = "Кава" + 2 + "шт";',k:['рядків','оператор','текстом','число'],s:'Це коли чек складають із шматочків: назва, кількість, ціна в один рядок.'},
{t:'split',c:'Рядки й ввід',d:'Метод String, який ріже рядок на частини за роздільником. Результат це масив рядків.',ex:'String[] parts = "а,б,в".split(",");',k:['рядок','ріже','роздільник','масив'],s:'Це розділення довгого замовлення «латте,чай,круасан» на окремі позиції.'},
{t:'substring',c:'Рядки й ввід',d:'Метод String, який вирізає з рядка шматок від одного номера до іншого. Кінцевий номер у шматок не входить.',ex:'String s = "еспресо".substring(0, 3);',k:['вирізає','шматок','номер','рядк'],s:'Це відрізати шматок стрічки чека між двома позначками.'},
{t:'charAt',c:'Рядки й ввід',d:'Метод String, який повертає символ за номером. Рахунок номерів починається з нуля.',ex:'char c = "кава".charAt(1);',k:['символ','номер','нуля','повертає'],s:'Це спитати «яка літера на третьому стікері?», рахуючи від нуля.'},
{t:'String.format',c:'Рядки й ввід',d:'Метод, який складає рядок за шаблоном із місцями для значень, наприклад %d для числа й %s для тексту. Зручно, коли треба вставити багато значень.',ex:'String s = String.format("%s коштує %d грн", "латте", 70);',k:['шаблон','значен','числа','тексту'],s:'Це бланк чека з порожніми місцями, куди вписують назву й ціну.'},
{t:'Escape-послідовність',c:'Рядки й ввід',d:'Спеціальне сполучення з похилою рискою, яке означає службовий символ. \\n це новий рядок, \\t це табуляція, \\" це лапки.',ex:'System.out.println("a\\tb\\nc");',k:['похилою','символ','рядок','лапки'],s:'Це службові позначки на меню: «новий рядок» і «відступ» не друкуються, а керують виглядом.'},
{t:'Пул рядків',c:'Рядки й ввід',d:'Особлива ділянка пам\'яті, де Java зберігає однакові рядкові літерали лише один раз. Тому два однакові літерали можуть вказувати на один рядок.',ex:'String a = "кава";\nString b = "кава";\nboolean same = (a == b);',k:['пам\'ят','літерал','однакові','рядок'],s:'Це одна пачка кави на полиці, з якої беруть усі, хто просить таку саму.'},
{t:'Текстовий блок',c:'Рядки й ввід',d:'Багаторядковий рядок у потрійних лапках. У ньому можна писати текст у кілька рядків без \\n.',ex:'String t = """\n    Привіт,\n    світе\n    """;',k:['потрійн','лапк','текст','рядків'],s:'Це довге меню, записане на аркуші як є, а не одним довгим рядком із позначками.'},
{t:'Порівняння рядків',c:'Рядки й ввід',d:'Рядки порівнюють методом equals, а не знаком ==. Знак == перевіряє, чи це той самий об\'єкт, а не чи однаковий текст.',ex:'String a = new String("x");\nboolean r1 = a == "x";\nboolean r2 = a.equals("x");',k:['equals','об\'єкт','текст','знак'],s:'Дві чашки з однаковим латте мають однаковий смак, хоч це різні чашки.'},
{t:'Runnable',c:'Потоки й паралельність',d:'Інтерфейс з одним методом run, який описує роботу для окремого потоку. Об\'єкт Runnable передають у Thread.',ex:'Runnable r = () -> System.out.println("працюю");\nThread t = new Thread(r);',k:['методом','run','роботу','потоку'],s:'Це картка із завданням, яку віддають бариста: «приготуй це».'},
{t:'start',c:'Потоки й паралельність',d:'Метод Thread, який запускає новий потік. Якщо викликати run замість start, код піде в тому ж потоці й паралельності не буде.',ex:'Thread t = new Thread(() -> System.out.println("hi"));\nt.start();',k:['запуска','потік','run','паралельн'],s:'Це команда «до роботи!», після якої новий бариста справді стає до кавомашини.'},
{t:'synchronized',c:'Потоки й паралельність',d:'Слово, яке дозволяє входити в метод чи блок лише одному потоку за раз. Решта потоків чекає свою чергу.',ex:'static int count = 0;\nstatic synchronized void inc() {\n    count++;\n}',k:['метод','блок','потоку','черг'],s:'Це одна кабінка на кухні: поки там працює один бариста, інші чекають за дверима.'},
{t:'Гонка даних',c:'Потоки й паралельність',d:'Помилка, коли кілька потоків одночасно змінюють одні дані й заважають один одному. Результат стає випадковим.',ex:'static int counter = 0;\nstatic void bad() {\n    counter++;\n}',k:['потоків','одночасно','дані','випадков'],s:'Двоє бариста одночасно рахують касу, і підсумок щоразу різний.'},
{t:'Deadlock',c:'Потоки й паралельність',d:'Ситуація, коли два потоки чекають один на одного й обидва застрягли назавжди. Програма просто зависає.',ex:null,k:['потоки','чекають','назавжди','зависає'],s:'Один бариста тримає молоко й чекає каву, інший тримає каву й чекає молоко, тож обидва стоять.'},
{t:'ExecutorService',c:'Потоки й паралельність',d:'Готовий басейн потоків, якому віддають завдання. Він сам розподіляє роботу, і потоки не треба створювати вручну.',ex:'ExecutorService ex = Executors.newFixedThreadPool(2);\nex.submit(() -> System.out.println("задача"));\nex.shutdown();',k:['потоків','завдан','розподіл','вручну'],s:'Це зміна з двох бариста: адміністратор роздає замовлення тим, хто вільний.'},
{t:'Future',c:'Потоки й паралельність',d:'Обіцянка результату, який буде готовий пізніше. Метод get чекає, доки результат з\'явиться.',ex:'ExecutorService ex = Executors.newSingleThreadExecutor();\nFuture<Integer> f = ex.submit(() -> 5);\nex.shutdown();',k:['результат','пізніше','get','чекає'],s:'Це талончик на каву: напій ще готується, але ти вже тримаєш обіцянку.'},
{t:'AtomicInteger',c:'Потоки й паралельність',d:'Лічильник, який можна безпечно змінювати з багатьох потоків без synchronized. Операції над ним виконуються цілісно.',ex:'AtomicInteger c = new AtomicInteger();\nc.incrementAndGet();',k:['безпечно','потоків','synchronized','змінювати'],s:'Це електронний лічильник на вході: скільки б людей не зайшло одночасно, число точне.'},
{t:'Thread.join',c:'Потоки й паралельність',d:'Метод потоку, який змушує поточний потік дочекатися завершення іншого. Так головна програма не закінчиться раніше за помічників.',ex:'Thread t = new Thread(() -> {});\nt.start();\nt.join();',k:['дочека','завершенн','потік','програм'],s:'Адміністратор не закриває кав\'ярню, доки помічник не домиє останню чашку.'},
{t:'CompletableFuture',c:'Потоки й паралельність',d:'Розумніший Future: можна описати ланцюжок дій, що виконаються, коли результат буде готовий. Блокувати потік очікуванням не треба.',ex:'CompletableFuture<String> f = CompletableFuture.supplyAsync(() -> "кава")\n    .thenApply(s -> s + "!");',k:['ланцюж','результат','дій','очікуван'],s:'Це «коли кава буде готова, додай корицю і віднеси на третій столик».'},
{t:'Maven',c:'Інструменти й тести',d:'Інструмент, який збирає Java-проєкт і сам завантажує потрібні бібліотеки. Усе налаштування лежить у файлі pom.xml.',ex:null,k:['збирає','бібліотек','pom.xml','проєкт'],s:'Це постачальник, який за списком сам привозить усі інгредієнти на кухню.'},
{t:'Юніт-тест',c:'Інструменти й тести',d:'Невеликий тест, який перевіряє одну маленьку частину коду, наприклад один метод. Його можна запустити за секунду.',ex:null,k:['тест','перевіря','метод','частин'],s:'Це спробувати одну ложку супу, перш ніж подавати весь казан.'},
{t:'JUnit',c:'Інструменти й тести',d:'Найпопулярніша бібліотека для написання юніт-тестів у Java. Метод тесту позначають анотацією @Test.',ex:'@Test\nvoid sumWorks() {\n    assertEquals(4, 2 + 2);\n}',k:['бібліотек','тест','анотац','позначають'],s:'Це контрольний список для кожної зміни: перевірено смак, температуру й піну.'},
{t:'assertEquals',c:'Інструменти й тести',d:'Перевірка в тесті, яка порівнює очікуване значення зі справжнім. Якщо вони різні, тест падає.',ex:'assertEquals(4, 2 + 2);',k:['тест','очікуван','значенн','падає'],s:'Це звірка чека з каси та порахованої готівки: сума має збігтися.'},
{t:'Mock',c:'Інструменти й тести',d:'Підроблений об\'єкт, який замінює справжній під час тесту. Так перевіряють код, не звертаючись до бази чи мережі.',ex:null,k:['об\'єкт','замінює','тест','справжній'],s:'Це тренувальна кавомашина з картону: на ній вчать нових бариста, не витрачаючи справжню каву.'},
{t:'Залежність',c:'Інструменти й тести',d:'Чужа бібліотека, без якої проєкт не працює. Інструмент збирання сам завантажує її за назвою й версією.',ex:null,k:['бібліотек','проєкт','завантажує','версі'],s:'Це молоко від фермера: без нього латте не зробиш, тому його вказують у списку закупівель.'},
{t:'JAR',c:'Інструменти й тести',d:'Архів із файлами .class та іншими ресурсами, зібраний в один файл. Його можна запустити або віддати іншим як готову програму.',ex:null,k:['файлами','.class','файл','програм'],s:'Це набір «кава з собою» в одній запакованій коробці.'},
{t:'Javadoc',c:'Інструменти й тести',d:'Коментар особливого вигляду над класом чи методом, з якого інструмент сам робить сторінку документації. Починається з /** і закінчується */.',ex:'/**\n * Складає два числа.\n */\nstatic int sum(int a, int b) {\n    return a + b;\n}',k:['класом','документац','/**','інструмент'],s:'Це опис страви в меню: що всередині і як це їсти.'},
{t:'Логування',c:'Інструменти й тести',d:'Запис важливих подій програми в журнал: повідомлень, помилок, попереджень. На відміну від println, повідомлення мають рівні важливості.',ex:'Logger log = Logger.getLogger("cafe");\nlog.info("Відкрито");',k:['подій','журнал','помилок','рівні'],s:'Це зошит зміни, куди записують, що і коли сталося, а не пам\'ятають з голови.'},
{t:'TDD',c:'Інструменти й тести',d:'Підхід, коли спочатку пишуть тест, який падає, а потім код, щоб він пройшов. Після цього код покращують.',ex:null,k:['тест','спочатку','код','падає'],s:'Спершу вирішуєш, яким має бути смак, а потім добираєш рецепт.'},
{t:'SQL',c:'Бази даних і веб',d:'Мова запитів до бази даних. Нею просять базу вибрати, додати, змінити чи видалити дані.',ex:'SELECT name FROM drinks;',k:['запитів','баз','даних','видалити'],s:'Це мова, якою просять комірника подати потрібні коробки зі складу.'},
{t:'SELECT',c:'Бази даних і веб',d:'SQL-команда для вибору даних з таблиці. Після слова WHERE можна залишити лише потрібні рядки.',ex:'SELECT name, price\nFROM drinks\nWHERE price < 80;',k:['команд','вибор','таблиц','рядки'],s:'Це прохання «покажи всі напої дешевше за 80 гривень».'},

const escRx=s=>s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
function termAliases(x){
  if(x._al)return x._al;
  const parts=[x.t.toLowerCase()].concat(x.t.toLowerCase().split(/\s*[()\/]\s*/).filter(Boolean));
  const al=[];parts.forEach(p=>{p=p.trim();if(p.length>=3&&!al.includes(p))al.push(p);});
  x._al=al;return al;
}
function termsIn(txt,max){
  const low=String(txt||'').toLowerCase(),found=[];
  TERMS.forEach(x=>{
    let best=-1;
    termAliases(x).forEach(a=>{
      let rx;
      if(/^[a-z0-9 _.$]+$/.test(a))rx=new RegExp('(^|[^a-z0-9_])'+escRx(a)+'($|[^a-z0-9_])');
      else{const st=a.length>5?a.slice(0,a.length-2):a;rx=new RegExp('(^|[^a-zа-яіїєґ\'])'+escRx(st));}
      const m=rx.exec(low);if(m&&(best<0||m.index<best))best=m.index;
    });
    if(best>=0)found.push({x,at:best});
  });
  return found.sort((a,b)=>a.at-b.at).slice(0,max||3).map(f=>f.x);
}

  const g=TM.g;if(!g||g.over||g.flash)return;

  if(!g.sel||g.sel.s===side){g.sel={s:side,i};return;}
  const a=g.sel.s==='l'?g.sel.i:g.right[g.sel.i];

  const d=new Date(),h=d.getHours(),m=d.getMonth();

function heatCard(){

  ['пн','','ср','','пт','',''].forEach((t,i)=>{if(t)svg+='<text x="0" y="'+(14+i*(cell+gap)+cell*.7)+'">'+t+'</text>';});
  const tk=today();
  for(let w=0;w<W;w++)for(let d=0;d<7;d++){
    const dt=new Date(start);dt.setDate(start.getDate()+w*7+d);if(dt>end)continue;
    const k=dayStr(dt),xp=(S.hist[k]&&S.hist[k].xp)||0;

}

const isSh=c=>/^\s*\$ /m.test(String(c||''));
const plainSh=s=>esc(s).replace(/^(\s*)\$ /gm,'$1<span class="sh-p">$</span> ');
function tableHtml(code){
  const ls=String(code||'').split('\n').map(l=>l.trim()).filter(Boolean);
  if(ls.length<3||/[;{}]/.test(code))return null;
  const n=ls[0].split('|').length;
  if(n<2||!ls.every(l=>l.split('|').length===n))return null;
  const row=(l,t)=>'<tr>'+l.split('|').map(c=>'<'+t+'>'+esc(c.trim())+'</'+t+'>').join('')+'</tr>';
  return '<div class="tblw"><table class="trace"><thead>'+row(ls[0],'th')+'</thead><tbody>'+ls.slice(1).map(l=>row(l,'td')).join('')+'</tbody></table></div>';
}
function codeBlock(code,cp){
  const tb=tableHtml(code);if(tb)return tb;
  if(isSh(code))return '<div class="cw"><pre class="code sh"><code>'+plainSh(code)+'</code></pre></div>';
  let carry='';
  const lines=hl(code).split('\n').map(l=>{let t=carry+l;const o=(t.match(/<span /g)||[]).length,c=(t.match(/<\/span>/g)||[]).length;
    if(o>c){const m=t.match(/<span class="t-\w+">/g);carry=m[m.length-1];t+='</span>'.repeat(o-c);}else carry='';return '<span class="l">'+t+'</span>';});
  return '<div class="cw">'+(cp?'<div class="cprow"><button class="cpy" data-act="cpy" aria-label="Копіювати код">Копіювати</button></div>':'')+'<pre class="code ln"><code>'+lines.join('\n')+'</code></pre></div>';
}
function fmt(s){return esc(s).replace(/`([^`]+)`/g,'<code>$1</code>');}
function fillCode(ex,c){
  const parts=ex.code.split(/\[\[(\d)\]\]/);let h='';
  parts.forEach((p,i)=>{
    if(i%2===0){h+=isSh(ex.code)?plainSh(p):hl(p);}
    else{
      const k=+p,id=c.slots[k],w=id==null?null:c.words.find(x=>x.id===id).w;
      let cls='blank';
      if(c.checked&&w!=null){
        const ok=w===ex.ans[k];
        cls+=ok?' good':' bad';
        if(fx.res)cls+=ok?' pop':' shake';
      }else if(fx.slot===k)cls+=' set';
      h+='<button class="'+cls+'" data-act="unslot" data-i="'+k+'"'+(c.checked?' disabled':'')+' aria-label="Пропуск '+(k+1)+'">'+(w==null?'&nbsp;':esc(w))+'</button>';
    }
  });
  return '<pre class="code"><code>'+h+'</code></pre>';
}
function typeCode(ex,c){
  const parts=ex.code.split('[[0]]');
  const cls='tslot'+(c.checked?(c.ok?' good':' bad'):'');
  const val=c.val?esc(c.val):'&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;';
  const H=isSh(ex.code)?plainSh:hl;
  return '<pre class="code'+(isSh(ex.code)?' sh':'')+'"><code>'+H(parts[0])+'<span class="'+cls+'" id="tslot">'+val+'</span>'+H(parts[1]||'')+'</code></pre>';
}
function ready(c){
  const ex=c.ex;
  if(ex.t==='mc'||ex.t==='out'||ex.t==='bug')return c.sel!=null;
  if(ex.t==='fill')return c.slots.every(x=>x!=null);
  if(ex.t==='type')return c.val.trim().length>0;
  return c.bank.length===0;
}

function animateBars(){
  const bars=$app.querySelectorAll('.fill[data-to]');
  if(!bars.length)return;
  void $app.offsetWidth;
  requestAnimationFrame(()=>{bars.forEach(b=>{b.style.width=b.dataset.to+'%';});});
}
function runCounters(){
  if(isReduced())return;
  $app.querySelectorAll('[data-count]').forEach(el=>{
    const to=+el.dataset.count,from=+(el.dataset.from||0),pre=el.dataset.pre||'',suf=el.dataset.suf||'';
    if(from===to)return;
    const t0=performance.now(),dur=900;
    (function step(now){
      const p=Math.min(1,Math.max(0,(now-t0)/dur)),e=1-Math.pow(1-p,3);
      el.textContent=pre+Math.round(from+(to-from)*e)+suf;
      if(p<1)requestAnimationFrame(step);
    })(t0);
  });
}
function confetti(){
  if(isReduced())return;
  const box=document.createElement('div');
  box.className='confetti';box.setAttribute('aria-hidden','true');

  box.innerHTML=s;
  document.body.appendChild(box);
  setTimeout(()=>{if(box.parentNode)box.parentNode.removeChild(box);},4500);
}

/* ================= Lesson logic ================= */
function prep(){
  const ex=L.queue[0],c={ex,checked:false,ok:null,t0:performance.now(),hints:0,gone:[]};
  if(ex.t==='mc'||ex.t==='out'){c.opts=shuffle(ex.opts.map((text,i)=>({text,ok:i===0})));c.sel=null;}
  else if(ex.t==='fill'){c.words=shuffle(ex.ans.concat(ex.extra).map((w,i)=>({id:i,w})));c.slots=ex.ans.map(()=>null);}
  else if(ex.t==='order'){c.bank=shuffle(ex.lines.map((text,i)=>({id:i,text})),true);c.built=[];}
  else if(ex.t==='bug'){c.sel=null;}
  else{c.val='';c.hintTxt='';}
  if(L.asked)L.asked.add(ex);c.var=!!(L.varSet&&L.varSet.has(ex));c.chal=!!(L.chalEx&&L.chalEx===ex);
  L.cur=c;fx.stage=true;
}
function reviewPick(){
  const pool=reviewPool(),due=dueList();
  let q=due.slice(0,8);
  if(q.length<8){const m=pool.filter(e=>S.miss[e.id]>0&&!q.includes(e)).sort((x,y)=>S.miss[y.id]-S.miss[x.id]);q=q.concat(m.slice(0,8-q.length));}
  if(q.length<8){
    const lessons=ALL.filter(l=>S.done[l.uid]&&!S.done[l.uid].skip).sort((x,y)=>S.done[x.uid].t-S.done[y.uid].t).slice(0,6);
    const lists=lessons.map(l=>shuffle(l.lesson.ex.filter(e=>!q.includes(e))));
    const want=Math.min(8,pool.length)-q.length,rest=[];
    for(let r=0;rest.length<want&&r<20;r++)lists.forEach(li=>{if(rest.length<want&&li[r])rest.push(li[r]);});
    q=q.concat(rest);
  }
  return shuffle(q);
}
const STG=[{n:'Розпізнаємо',d:'Читаємо код і вибираємо правильну відповідь.'},{n:'Складаємо',d:'Тепер самі доповнюємо й збираємо код.'},{n:'Пишемо сам',d:'Остання сходинка: пишемо код і шукаємо помилки.'}];
const stageOf=ex=>ex.t==='mc'||ex.t==='out'?0:ex.t==='fill'||ex.t==='order'?1:2;
function newRun(info,queue,extra){
  const mx=LEVELS[S.level].hearts;
  L=Object.assign({info,mode:'practice',queue,total:queue.length,done:0,first:0,earn:0,hearts:mx,max:mx,retried:new Set(),hinted:new Set(),asked:new Set(),varSet:new Set(),sok:0,chal:false,chalEx:null,leave:false,cur:null,si:0,peek:false,fast:0,review:false,placement:false},extra||{});
  delete barsMem.lesson;
  screen='lesson';fx.view=true;prep();render();window.scrollTo(0,0);
}
function startReview(){
  const q=reviewPick();if(!q.length)return;
  newRun({uid:'review',n:-1,lesson:{title:'Змішані завдання з пройдених уроків',ex:[]}},q,{review:true,allEx:q.slice()});
}
function startPlacement(){
  const q=[];
  for(let ui=0;ui<8&&ui<UNITS.length;ui++){
    const ls=UNITS[ui].lessons.filter(x=>!x.isNew),lsn=ls[ls.length-1];
    const pool=lsn.ex.filter(e=>e.t==='mc'||e.t==='out'||e.t==='fill');
    q.push(pool[Math.floor(Math.random()*pool.length)]);
  }
  newRun({uid:'placement',n:-1,lesson:{title:'Тест рівня',ex:[]}},q,{placement:true,hearts:99,max:99,pl:[]});
}
function startLesson(uid){
  if(uid==='review'){startReview();return;}
  const info=ALL.find(l=>l.uid===uid);if(!info||!isUnlocked(info.n))return;
  if(S.track!=='git'&&ALL.find(l=>l.ui===info.ui)===info&&!S.story[info.ui]&&STORY[info.ui]){pendingUid=uid;screen='story';fx.view=true;render();window.scrollTo(0,0);return;}
  const q=info.lesson.ex.map((e,i)=>({e,i})).sort((a,b)=>stageOf(a.e)-stageOf(b.e)||a.i-b.i).map(x=>x.e);
  newRun(info,q,{mode:'study',staged:true,stSeen:{},stList:[...new Set(q.map(stageOf))]});
}
function endStudy(){
  L.mode='practice';L.peek=false;L.si=0;
  fx.view=true;fx.stage=true;
  render();window.scrollTo(0,0);
}
function hint(){
  const c=L.cur,ex=c.ex;
  if(!c||c.checked||canHint(c)!==true)return;
  if(S.level==='normal')fx.xpPop='−'+(ptsFor(c.hints)-ptsFor(c.hints+1));
  c.hints++;S.stats.hints++;
  if(S.level!=='easy')L.hinted.add(ex);
  if(ex.t==='mc'||ex.t==='out'){
    const wrong=c.opts.map((o,i)=>i).filter(i=>!c.opts[i].ok&&i!==c.sel&&!c.gone.includes(i));
    shuffle(wrong).slice(0,1).forEach(i=>c.gone.push(i));
  }else if(ex.t==='bug'){
    const wrong=ex.lines.map((l,i)=>i).filter(i=>i!==ex.bad&&i!==c.sel&&ex.lines[i].trim());
    const rem=wrong.filter(i=>!c.gone.includes(i));
    shuffle(rem).slice(0,[Math.ceil(rem.length/3),Math.ceil(rem.length/2),rem.length][c.hints-1]).forEach(i=>c.gone.push(i));
    if(c.gone.includes(c.sel))c.sel=null;
  }else if(ex.t==='fill'){
    const k=ex.ans.findIndex((w,i)=>{const id=c.slots[i];return id==null||c.words.find(x=>x.id===id).w!==w;});
    if(k<0)return;
    c.slots[k]=null;
    let chip=c.words.find(x=>x.w===ex.ans[k]&&!c.slots.includes(x.id));
    if(!chip){
      const j=c.slots.findIndex(id=>id!=null&&c.words.find(x=>x.id===id).w===ex.ans[k]);
      if(j>=0)c.slots[j]=null;
      chip=c.words.find(x=>x.w===ex.ans[k]&&!c.slots.includes(x.id));
    }
    if(chip){c.slots[k]=chip.id;fx.slot=k;}
  }else if(ex.t==='order'){
    let i=0;while(i<c.built.length&&c.built[i].text===ex.lines[i])i++;
    while(c.built.length>i)c.bank.push(c.built.pop());
    const bi=c.bank.findIndex(b=>b.text===ex.lines[i]);
    if(bi>=0){const b=c.bank.splice(bi,1)[0];c.built.push(b);fx.line=b.id;}
  }else{
    const a=ex.acc[0];
    c.hintTxt=a.slice(0,Math.max(2,Math.ceil(a.length*[.35,.65,.9][c.hints-1])))+'…';
  }
  render();
}
function check(){
  const c=L.cur,ex=c.ex;if(c.checked||!ready(c))return;
  let ok;
  if(ex.t==='mc'||ex.t==='out')ok=c.opts[c.sel].ok;
  else if(ex.t==='fill')ok=c.slots.every((id,k)=>c.words.find(w=>w.id===id).w===ex.ans[k]);
  else if(ex.t==='order')ok=c.built.map(b=>b.text).join('\n')===ex.lines.join('\n');
  else if(ex.t==='bug')ok=c.sel===ex.bad;
  else ok=ex.acc.some(a=>strip(a)===strip(c.val));
  c.checked=true;c.ok=ok;fx.res=ok?'pop':'shake';
  const firstTry=!L.retried.has(ex);
  recordAnswer(ex,ok,firstTry,c);
  if(L.placement){
    L.done++;L.pl.push(ok);
  }else if(ok){
    L.done++;
    {let g=L.retried.has(ex)?5:10;if(S.level!=='easy'&&c.hints>0)g=Math.min(g,ptsFor(c.hints));L.earn=(L.earn||0)+g;fx.xpPop='+'+g;}
    if(firstTry&&c.hints===0&&!L.review&&!L.placement)L.sok++;else if(!firstTry||c.hints>0)L.sok=0;
    if(L.sok>=3&&!L.chal&&!L.review&&!L.placement){const ch=pickChallenge(ex);if(ch){L.chal=true;L.chalEx=ch;L.queue.splice(1,0,ch);L.total++;toast('Виклик','Складніше завдання за серію правильних відповідей','ach');}}
    if(firstTry&&!L.hinted.has(ex)){
      L.first++;
      const dt=(performance.now()-c.t0)/1000;
      if(dt<8&&ex.t!=='type'&&ex.t!=='order'){L.fast++;fx.fast=true;}
    }
    if(firstTry){
      if(S.miss[ex.id]>0){S.miss[ex.id]--;if(!S.miss[ex.id])delete S.miss[ex.id];}
      if(ex.t==='bug')S.stats.bugs++;
      if(ex.t==='type')S.stats.typed++;
    }
  }else{
    L.hearts--;fx.hit=L.hearts;
    S.miss[ex.id]=Math.min(5,(S.miss[ex.id]||0)+1);
    L.sok=0;
    if(L.hearts>0&&!L.iv){const v=pickVariant(ex);L.retried.add(ex);if(v!==ex){L.retried.add(v);L.varSet.add(v);}L.queue.push(v);}
  }
  if(!L.placement){
    if(ok){S.stats.run++;S.stats.runBest=Math.max(S.stats.runBest,S.stats.run);}else S.stats.run=0;
  }
  save();
  snd(ok?'ok':'bad');
  render();
  checkAch();
}
function next(){
  const c=L.cur;if(!c.checked)return;
  L.queue.shift();
  if(!L.placement&&L.hearts<=0&&!c.ok){screen='fail';fx.view=true;render();window.scrollTo(0,0);return;}
  if(!L.queue.length){finish();return;}
  prep();render();window.scrollTo(0,0);
}
function finishPlacement(){
  let known=0;
  for(const ok of L.pl){if(ok)known++;else break;}
  ALL.filter(l=>l.ui<known&&!S.done[l.uid]).forEach(l=>{S.done[l.uid]={a:0,skip:1,t:Date.now()};});
  S.stats.placement=1;save();
  res={placement:true,known,total:L.pl.length,right:L.pl.filter(Boolean).length,next:UNITS[known]?UNITS[known].title:null};
  screen='result';fx.view=true;fx.confetti=known>0;snd('done');
  render();window.scrollTo(0,0);
}
function finish(){
  if(L.placement){finishPlacement();return;}
  const acc=Math.round(L.first/L.total*100);
  const mult=(S.level==='hard'?1.5:1)*(isWeekend()?2:1);
  const gain=Math.round(((L.earn||0)+5+L.fast*2)*mult);
  const notes=[];
  if(L.fast)notes.push('Бонус за швидкі відповіді: +'+L.fast*2);
  if(S.level==='hard')notes.push('Складний режим: досвід ×1,5');
  if(isWeekend())notes.push('Вихідні: досвід ×2');
  const lv0=lvlInfo(S.xp).n;
  S.xp+=gain;
  const li=lvlInfo(S.xp);
  foxRun=true;
  if(li.n>lv0)notes.push('Новий рівень: '+li.n+' («'+li.title+'»)');
  const dxp=S.day.d===today()?S.day.xp:0;
  const goalHit=dxp<S.goal&&dxp+gain>=S.goal;
  S.day={d:today(),xp:dxp+gain};
  {const H=S.hist[today()]||(S.hist[today()]={xp:0,ok:0,bad:0,sec:0});H.xp+=gain;}
  if(goalHit){S.stats.goals++;notes.push('Ціль дня виконано');}
  const st=bumpStreak();
  if(st.froze)notes.push('Заморожування врятувало серію');
  if(st.earned)notes.push('Нове заморожування серії за тиждень занять');
  if(L.review&&!L.custom){
    S.stats.reviews++;
    const seen={};L.allEx.forEach(e=>{seen[e.id.split(':')[0]]=1;});
    Object.keys(seen).forEach(uid=>{if(S.done[uid])S.done[uid].t=Date.now();});
  }else if(L.custom){

const CFG=window.BARISTA_CONFIG||{};
const CLOUD=!!(CFG.url&&CFG.key);
const AKEY='barista-auth';
let AUTH=null;try{AUTH=JSON.parse(localStorage.getItem(AKEY));}catch(e){}
const AUI={mode:'in',email:'',msg:'',busy:false,sync:AUTH?'idle':''};
let pushTimer=0;
function authSave(){try{if(AUTH)localStorage.setItem(AKEY,JSON.stringify(AUTH));else localStorage.removeItem(AKEY);}catch(e){}}
function authErr(j){
  const m=String((j&&(j.msg||j.error_description||j.message||j.error))||'');
  if(/invalid login/i.test(m))return 'Невірна пошта або пароль.';
  if(/already registered|already been registered/i.test(m))return 'Ця пошта вже зареєстрована. Спробуй увійти.';
  if(/at least 6|weak/i.test(m))return 'Пароль має бути щонайменше 6 символів.';
  if(/valid email|invalid.*email|unable to validate email/i.test(m))return 'Перевір, чи правильно записана пошта.';
  if(/not confirmed/i.test(m))return 'Підтверди пошту за листом, потім увійди.';
  if(/rate limit|too many/i.test(m))return 'Забагато спроб. Зачекай хвилину.';
  return 'Не вийшло: '+(m||'немає зв\'язку з сервером');
}
async function api(path,opt,authed){
  const h=Object.assign({apikey:CFG.key,'Content-Type':'application/json'},(opt&&opt.headers)||{});
  if(authed){
    if(AUTH&&AUTH.expires_at&&AUTH.expires_at-60<Date.now()/1000)await refreshAuth();
    if(!AUTH)throw new Error('no session');
    h.Authorization='Bearer '+AUTH.access_token;
  }
  const r=await fetch(CFG.url+path,Object.assign({},opt,{headers:h}));
  let j=null;try{j=await r.json();}catch(e){}
  if(!r.ok){const er=new Error('http');er.status=r.status;er.body=j;throw er;}
  return j;
}
function takeSession(j){
  if(!j||!j.access_token)return false;
  AUTH={access_token:j.access_token,refresh_token:j.refresh_token,expires_at:j.expires_at||Math.floor(Date.now()/1000)+(j.expires_in||3600),email:(j.user&&j.user.email)||(AUTH&&AUTH.email)||'',uid:(j.user&&j.user.id)||(AUTH&&AUTH.uid)||''};
  authSave();return true;
}
async function refreshAuth(){
  try{const j=await api('/auth/v1/token?grant_type=refresh_token',{method:'POST',body:JSON.stringify({refresh_token:AUTH.refresh_token})});takeSession(j);}
  catch(e){if(e.status===400||e.status===401){AUTH=null;authSave();AUI.sync='';}else throw e;}
}
function mergeProgress(a,b){ // a = local, b = cloud (both normalised)
  const o=norm(JSON.parse(JSON.stringify(b)));

function declWord(w,sex){
  const o={n:w,g:w,d:w,a:w,i:w,l:w,v:w};
  if(w.length<2)return o;
  const e=w.slice(-1),st=w.slice(0,-1),lc=st.slice(-1).toLowerCase(),low=w.toLowerCase();
  const SIB='жчшщ';
  if(e==='я'||e==='Я'){
    if(lc==='і'){return {n:w,g:st+'ї',d:st+'ї',a:st+'ю',i:st+'єю',l:st+'ї',v:st+'є'};}
    return {n:w,g:st+'і',d:st+'і',a:st+'ю',i:st+'ею',l:st+'і',v:st+'ю'};
  }
  if(e==='а'||e==='А'){
    const lat=SIB.includes(lc);
    const mut={'г':'з','к':'ц','х':'с'};
    const sd=mut[lc]?st.slice(0,-1)+mut[lc]:st;
    return {n:w,g:st+(lat?'і':'и'),d:sd+'і',a:st+'у',i:st+(lat?'ею':'ою'),l:sd+'і',v:st+'о'};
  }
  if(sex==='m'){
    if(e==='й'){return {n:w,g:st+'я',d:st+'ю',a:st+'я',i:st+'єм',l:st+'ю',v:st+'ю'};}
    if(e==='ь'){return {n:w,g:st+'я',d:st+'ю',a:st+'я',i:st+'ем',l:st+'ю',v:st+'ю'};}
    if(e==='о'){return {n:w,g:st+'а',d:st+'у',a:st+'а',i:st+'ом',l:st+'у',v:st+'е'};}
    if(!'аеєиіїоуюя'.includes(e)){
      const vm={'г':'же','к':'че','х':'ше'};
      const v=vm[e]?st+vm[e]:w+'е';
      return {n:w,g:w+'а',d:w+'у',a:w+'а',i:w+'ом',l:w+'у',v:v};
    }
    return o;
  }
  if(low.endsWith('ов')&&low.startsWith('любов')){return {n:w,g:w+'і',d:w+'і',a:w,i:w+'’ю',l:w+'і',v:w+'е'};}
  return o;
}
function declName(raw,sex){
  const parts=String(raw||'').trim().split(/([\s-]+)/);
  const r={n:'',g:'',d:'',a:'',i:'',l:'',v:''};
  parts.forEach(p=>{
    if(!p)return;
    if(/^[\s-]+$/.test(p)){for(const k in r)r[k]+=p;return;}
    const x=declWord(p,sex);for(const k in r)r[k]+=x[k];
  });
  return r;
}

function parse(src){

  function parseType(){

  function assign(){

function vzPaint(){
  const r=VZ.res;if(screen!=='viz'||!r||r.unsup){vzStop();return;}
  const n=r.steps.length;VZ.i=Math.max(0,Math.min(n-1,VZ.i));
  const s=r.steps[VZ.i],prev=VZ.i>0?r.steps[VZ.i-1]:null;
  const df=vzDiff(prev,s);
  const code=document.getElementById('vzcode');
  if(code){
    const old=code.querySelector('.vl.cur');if(old)old.classList.remove('cur','crash');
    const el=document.getElementById('vl'+s.line);
    if(el){el.classList.add('cur');if(s.kind==='crash'||s.kind==='err')el.classList.add('crash');
      const top=el.offsetTop-code.clientHeight/2+el.clientHeight/2;
      if(Math.abs(code.scrollTop-top)>code.clientHeight*0.3||el.offsetTop<code.scrollTop||el.offsetTop+el.clientHeight>code.scrollTop+code.clientHeight)code.scrollTo({top:Math.max(0,top),behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'});}
  }
  const nt=document.getElementById('vznote');
  if(nt){nt.className='vz-note k-'+s.kind;nt.innerHTML='<div class="vz-fox">'+mascot(s.kind==='crash'||s.kind==='err'?'sad':s.kind==='end'?'cheer':'idle',44)+'</div><p>'+esc(s.note||'')+'</p>';nt.classList.remove('pop');void nt.offsetWidth;nt.classList.add('pop');}
  const mem=document.getElementById('vzmem');if(mem)mem.innerHTML=vzMem(s,df);
  const out=document.getElementById('vzout');
  if(out){const po=prev?prev.out:'';const o=s.out;let hh='<span class="con-l">Вивід програми</span><pre>';
    if(!o&&!s.err)hh+='<i class="muted">(поки нічого не виведено)</i>';
    else{const keep=o.startsWith(po)?po:'';hh+=esc(keep)+(o.length>keep.length?'<span class="newout">'+esc(o.slice(keep.length))+'</span>':'');
      if(s.err)hh+='<span class="errout">'+esc(s.err)+'</span>';}
    hh+='</pre>';out.innerHTML=hh;}
  const rg=document.getElementById('vzr');if(rg&&+rg.value!==VZ.i)rg.value=VZ.i;
  const ct=document.getElementById('vzcnt');if(ct)ct.textContent='Крок '+(VZ.i+1)+' з '+n+(r.truncated?' (далі програма занадто довга для показу)':'');
  const pl=document.getElementById('vzplay');if(pl){pl.innerHTML=VZ.play?IC.vpause:IC.vplay;pl.setAttribute('aria-label',VZ.play?'Пауза':'Грати');}
  document.querySelectorAll('[data-act="vzgo"]').forEach(b=>{const d=b.dataset.d;if(d==='first'||d==='prev')b.disabled=VZ.i===0;if(d==='next'||d==='last')b.disabled=VZ.i>=n-1;});
  [0.5,1,2,4].forEach(x=>{const b=document.getElementById('vzsp'+x);if(b)b.classList.toggle('on',VZ.speed===x);});
}
function vzGo(d){
  const r=VZ.res;if(!r||r.unsup)return;const n=r.steps.length;
  if(d==='play'){
    if(VZ.play){vzStop();vzPaint();return;}
    if(VZ.i>=n-1)VZ.i=0;
    VZ.play=true;vzTick();return;}
  vzStop();
  if(d==='first')VZ.i=0;else if(d==='last')VZ.i=n-1;else if(d==='prev')VZ.i--;else if(d==='next')VZ.i++;
  vzPaint();
}
function vzTick(){
  if(VZ.timer)clearInterval(VZ.timer);
  const step=()=>{if(screen!=='viz'){vzStop();return;}
    if(VZ.i>=VZ.res.steps.length-1){vzStop();vzPaint();return;}
    VZ.i++;vzPaint();};
  vzPaint();
  VZ.timer=setInterval(step,Math.round(1500/VZ.speed));
}
function vzKey(e){
  if(screen!=='viz'||!VZ.res||VZ.res.unsup)return false;
  const t=e.target;if(t&&(t.tagName==='TEXTAREA'||t.tagName==='INPUT'&&t.type!=='range'))return false;
  if(e.key==='ArrowRight'||e.key==='ArrowDown'&&false){e.preventDefault();vzGo('next');return true;}
  if(e.key==='ArrowLeft'){e.preventDefault();vzGo('prev');return true;}
  if(e.key===' '&&(!t||t.tagName!=='BUTTON')){e.preventDefault();vzGo('play');return true;}
  return false;
}

async function javaLang(){
  if(IDE.lang)return IDE.lang;
  try{
    const r=await fetch(RUNNER+'/languages');const j=await r.json();
    const ids=j.filter(x=>/^Java \(OpenJDK/i.test(x.name)).map(x=>x.id);
    IDE.lang=ids.length?Math.max.apply(null,ids):62;
  }catch(e){IDE.lang=62;}
  return IDE.lang;
}
async function execJava(code,stdin){
  try{
    const lang=await javaLang();const ctrl=new AbortController();const to=setTimeout(()=>ctrl.abort(),25000);
    const r=await fetch(RUNNER+'/submissions?base64_encoded=true&wait=true',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({source_code:b64(code),language_id:lang,stdin:b64(stdin||'')}),signal:ctrl.signal});
    clearTimeout(to);if(!r.ok)throw new Error('http');
    const j=await r.json();const so=unb64(j.stdout),se=unb64(j.stderr),co=unb64(j.compile_output);
    if(co)return 'Помилка компіляції:\n'+co;
    if(se)return (so?so+'\n':'')+'Помилка виконання:\n'+se;
    return so||'(програма нічого не вивела)';
  }catch(e){return 'Не вдалося зв’язатися із сервером запуску коду. Перевір інтернет.';}
}
async function runCode(){
  if(IDE.busy)return;
  IDE.busy=true;IDE.out='Запускаю…';IDE.kind='';IDE.errLine=0;
  const ca=document.getElementById('ide-code'),si=document.getElementById('ide-in');
  if(ca)IDE.code=ca.value;if(si)IDE.stdin=si.value;
  render();
  try{
    const lang=await javaLang();
    const ctrl=new AbortController();const to=setTimeout(()=>ctrl.abort(),25000);
    const r=await fetch(RUNNER+'/submissions?base64_encoded=true&wait=true',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({source_code:b64(IDE.code),language_id:lang,stdin:b64(IDE.stdin)}),signal:ctrl.signal});
    clearTimeout(to);
    if(!r.ok)throw new Error('http '+r.status);
    const j=await r.json();
    const so=unb64(j.stdout),se=unb64(j.stderr),co=unb64(j.compile_output);
    if(co){IDE.kind='err';IDE.out='Помилка компіляції:\n'+co;IDE.errLine=+((co.match(/Main\.java:(\d+):/)||[])[1]||0);}
    else if(se){IDE.kind='err';IDE.out=(so?so+'\n':'')+'Помилка виконання:\n'+se;}
    else{IDE.kind='ok';IDE.out=so||'(програма нічого не вивела)';}
  }catch(e){
    IDE.kind='err';IDE.out='Не вдалося зв’язатися із сервером запуску коду. Перевір інтернет і спробуй ще раз.';
  }
  IDE.busy=false;
  if(screen==='ide'){fx.view=false;render();}
}

function statsView(){
  const us=Object.values(US()),okN=us.reduce((n,u)=>n+u.ok,0),badN=us.reduce((n,u)=>n+u.bad,0);
  const acc=okN+badN?Math.round(okN/(okN+badN)*100):0;
  const secs=Object.values(S.hist).reduce((n,d)=>n+(d.sec||0),0),mins=Math.round(secs/60);
  const doneN=ALL.filter(l=>S.done[l.uid]&&!S.done[l.uid].skip).length;

    +'<div class="tile"><b>'+S.xp+'</b><span>Досвід</span></div><div class="tile"><b>'+doneN+'</b><span>Уроків</span></div>'
    +'<div class="tile"><b>'+(okN+badN?acc+'%':'0%')+'</b><span>Точність</span></div><div class="tile"><b>'+mins+'</b><span>Хвилин</span></div></div>';
  // week chart

  const mx=Math.max(30,S.goal,...days.map(d=>d.xp));

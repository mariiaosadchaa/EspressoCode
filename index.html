 K("Generic-метод","Метод теж може мати свій тип `<T>`. Його пишуть перед типом результату. Тоді метод працює з будь-яким типом, а компілятор сам здогадується, який саме.",

   'static <T> T first(List<T> list) {\n    return list.get(0);\n}\n\n// у main:\nString s = first(List.of("a", "b"));\nInteger n = first(List.of(10, 20));\nSystem.out.println(s);\nSystem.out.println(n + 1);','a\n11'),

   'static <T extends Number> double twice(T x) {\n    return x.doubleValue() * 2;\n}\n\nstatic <T extends Comparable<T>> T max(T a, T b) {\n    return a.compareTo(b) > 0 ? a : b;\n}\n\n// у main:\nSystem.out.println(twice(3));\nSystem.out.println(max(3, 7));\nSystem.out.println(max("apple", "pear"));','6.0\n7\npear'),

 K("Гонка даних","Запис `n++` це три кроки: прочитати, додати, записати. Якщо два потоки роблять це одночасно, вони можуть перезаписати результат один одного, і частина додавань загубиться. Це називається гонкою даних (race condition). Результат стає непередбачуваним.",

'16-0':[
 K('Навіщо потрібні тести','Тест це маленька програма, яка сама перевіряє твій код. Ти запускаєш усі тести за секунди й одразу бачиш, чи щось зламалось після змін. Без тестів доводиться перевіряти все руками.','class Calculator {\n    int add(int a, int b) {\n        return a + b;\n    }\n}'),
 K('Перший тест у JUnit 5','JUnit це бібліотека для тестів. Метод з анотацією `@Test` стає тестом. Імпорт беруть із пакета `org.junit.jupiter.api`. Клас називають за звичаєм `CalculatorTest`, тобто імʼя класу плюс слово Test.','import org.junit.jupiter.api.Test;\nimport static org.junit.jupiter.api.Assertions.assertEquals;\n\nclass CalculatorTest {\n    @Test\n    void addsTwoNumbers() {\n        Calculator calc = new Calculator();\n        assertEquals(5, calc.add(2, 3));\n    }\n}'),
 K('assertEquals і assertTrue','`assertEquals(очікуване, фактичне)` перевіряє, що два значення рівні. Очікуване значення завжди перше. `assertTrue(умова)` перевіряє, що умова true, а `assertFalse` що false. Якщо перевірка не пройшла, тест стає червоним.','assertEquals(10, calc.multiply(2, 5));\nassertTrue(list.isEmpty());\nassertFalse(isAdult(10));'),
 K('Arrange, Act, Assert','Добрий тест має три частини. Arrange: готуємо дані. Act: викликаємо код, який перевіряємо. Assert: перевіряємо результат. Так тест легко читати, а назва метода описує, що саме він перевіряє.','@Test\nvoid addsTwoNumbers() {\n    // Arrange\n    Calculator calc = new Calculator();\n    // Act\n    int result = calc.add(2, 3);\n    // Assert\n    assertEquals(5, result);\n}')
],
'16-1':[
 K('Перевіряємо винятки','Іноді код має кинути помилку, наприклад при діленні на нуль. Для цього є `assertThrows`. Ти вказуєш клас винятку й код у лямбді. Тест пройде, лише якщо виняток справді буде кинуто.','@Test\nvoid divideByZero() {\n    assertThrows(ArithmeticException.class,\n        () -> calc.divide(5, 0));\n}'),

 K('Хто створює об\'єкти','Великий застосунок складається з багатьох класів, які потребують один одного. Якщо кожен клас сам пише `new`, їх важко замінити й тестувати. Spring бере створення об\'єктів на себе.','class OrderService {\n    // клас сам створює залежність\n    private PaymentService payment = new PaymentService();\n}'),
 K('Dependency injection','Залежність це об\'єкт, який потрібен класу для роботи. У Spring ми просто просимо його в конструкторі, а Spring створює й передає його сам. Це і є dependency injection. Так легко підставити інший клас, наприклад у тесті.','@Service\nclass OrderService {\n    private final PaymentService payment;\n\n    OrderService(PaymentService payment) {\n        this.payment = payment;\n    }\n}'),
 K('Bean і @Component','Об\'єкт, яким керує Spring, називається bean. Щоб клас став bean-ом, познач його `@Component` (або `@Service`, `@Repository`). Анотація `@Autowired` просить Spring підставити залежність. Якщо в класі один конструктор, її можна не писати.','@Component\nclass PaymentService {\n    boolean pay(int sum) {\n        return true;\n    }\n}'),
 K('Spring Boot і starter','Spring Boot прибирає зайві налаштування. Starter це готовий набір бібліотек для певної задачі. Наприклад, `spring-boot-starter-web` дає все для веб-застосунку. Клас з `@SpringBootApplication` запускає програму, а Spring сам знаходить твої bean-и.','@SpringBootApplication\npublic class ShopApp {\n    public static void main(String[] args) {\n        SpringApplication.run(ShopApp.class, args);\n    }\n}')
],
'18-1':[
 K('@RestController і @GetMapping','Клас з `@RestController` приймає HTTP-запити й повертає дані. `@GetMapping("/hello")` звʼязує метод із GET-запитом за адресою /hello. Те, що повертає метод, Spring відправляє у відповідь.','@RestController\nclass HelloController {\n    @GetMapping("/hello")\n    String hello() {\n        return "Привіт";\n    }\n}'),
 K('@PathVariable і @RequestParam','`@PathVariable` бере значення зі шляху, наприклад /users/7. `@RequestParam` бере значення з рядка запиту після знака питання, наприклад /search?name=Оля.','@GetMapping("/users/{id}")\nUser find(@PathVariable int id) {\n    return service.find(id);\n}\n\n@GetMapping("/search")\nList<User> search(@RequestParam String name) {\n    return service.findByName(name);\n}'),
 K('POST, @RequestBody і JSON','Щоб створити новий запис, використовують POST. JSON це текстовий формат даних. `@RequestBody` перетворює JSON із тіла запиту на Java-об\'єкт, а відповідь Spring сам перетворює назад на JSON.','// запит: POST /users\n// тіло: {"name": "Оля", "age": 20}\n@PostMapping("/users")\nUser create(@RequestBody User user) {\n    return service.save(user);\n}'),
 K('HTTP-статуси','Відповідь має код статусу. 200 означає успіх, 201 створено, 400 поганий запит, 404 не знайдено, 500 помилка сервера. Керувати статусом можна через `ResponseEntity`.','@GetMapping("/users/{id}")\nResponseEntity<User> find(@PathVariable int id) {\n    User user = service.find(id);\n    if (user == null) {\n        return ResponseEntity.notFound().build();\n    }\n    return ResponseEntity.ok(user);\n}')
],
'19-0':[
 K('== чи equals','Відповідь для співбесіди: оператор `==` порівнює посилання, тобто чи це той самий об\'єкт. Метод `equals` за замовчуванням робить те саме, але в String та інших класах його перевизначено, щоб порівнювати вміст. Для рядків і об\'єктів зміст перевіряють через `equals`.','String a = new String("hi");\nString b = new String("hi");\nSystem.out.println(a == b);\nSystem.out.println(a.equals(b));','false\ntrue'),
 K('Контракт equals і hashCode','Відповідь: якщо два об\'єкти рівні за `equals`, їхні `hashCode` мають збігатися. Обернене не обов\'язкове. Якщо перевизначити лише equals, об\'єкти не працюватимуть правильно в HashMap і HashSet. Тому ці методи завжди перевизначають разом.','class User {\n    String name;\n\n    User(String name) {\n        this.name = name;\n    }\n\n    @Override\n    public boolean equals(Object o) {\n        if (!(o instanceof User)) return false;\n        User u = (User) o;\n        return name.equals(u.name);\n    }\n\n    @Override\n    public int hashCode() {\n        return name.hashCode();\n    }\n}\n\n// у main:\nUser a = new User("Оля");\nUser b = new User("Оля");\nSystem.out.println(a.equals(b));\nSystem.out.println(a.hashCode() == b.hashCode());','true\ntrue'),
 K('Абстрактний клас чи інтерфейс','Відповідь: клас може успадкувати лише один клас, але реалізувати багато інтерфейсів. Абстрактний клас може мати поля зі станом, конструктор і готові методи. Інтерфейс описує, що об\'єкт уміє. Створити об\'єкт через new для обох неможливо. `final` для змінної робить її константою, для класу забороняє успадкування.','abstract class Animal {\n    String name;\n    abstract void sound();\n}\n\ninterface Swimmer {\n    void swim();\n}\n\nclass Duck extends Animal implements Swimmer {\n    void sound() {}\n    public void swim() {}\n}'),
 K('Винятки і finally','Відповідь: перевірені (checked) винятки, як IOException, треба обробити або оголосити через `throws`. Неперевірені (unchecked), як NullPointerException, наслідують RuntimeException і обробляти їх не змушують. Блок `finally` виконується завжди, і його використовують для очищення.','try {\n    System.out.println("try");\n    throw new IllegalStateException();\n} catch (IllegalStateException e) {\n    System.out.println("catch");\n} finally {\n    System.out.println("finally");\n}','try\ncatch\nfinally')
],
'19-1':[
 K('Чому String незмінний','Відповідь: об\'єкт String після створення не змінюється. Методи на кшталт `concat` чи `toUpperCase` повертають новий рядок. Це робить рядки безпечними для потоків, дозволяє кешувати hashCode і використовувати рядки як ключі в HashMap.','String s = "Java";\ns.concat("!");\nSystem.out.println(s);\ns = s.concat("!");\nSystem.out.println(s);','Java\nJava!'),
 K('Пул рядків','Відповідь: літерали з однаковим текстом Java зберігає в пулі рядків і використовує один об\'єкт. Це економить пам\'ять. Оператор `new String(...)` створює окремий об\'єкт поза пулом. Метод `intern()` повертає версію з пулу. У циклі для склеювання тексту беруть `StringBuilder`.','String a = "hi";\nString b = "hi";\nString c = new String("hi");\nSystem.out.println(a == b);\nSystem.out.println(a == c);\nSystem.out.println(a.equals(c));\nSystem.out.println(a == c.intern());','true\nfalse\ntrue\ntrue'),
 K('ArrayList чи LinkedList','Відповідь: ArrayList зберігає дані в масиві, тому `get(i)` швидкий, а вставка в середину повільніша. LinkedList складається з вузлів, вставка по вузлу швидка, але доступ за індексом повільний. У більшості випадків обирають ArrayList.','List<String> list = new ArrayList<>();\nlist.add("a");\nlist.add("b");\nSystem.out.println(list.get(1));','b'),
 K('HashMap і HashSet','Відповідь: HashMap зберігає пари ключ і значення. Він рахує `hashCode` ключа, знаходить кошик і порівнює ключі через `equals`. Ключі унікальні, повторний `put` замінює значення. HashSet зберігає унікальні елементи і всередині працює так само.','Map<String, Integer> m = new HashMap<>();\nm.put("a", 1);\nm.put("a", 2);\nSystem.out.println(m.get("a"));\nSet<Integer> set = new HashSet<>(List.of(1, 2, 2));\nSystem.out.println(set.size());','2\n2')
],
'19-2':[
 K('Stack і heap','Відповідь: у стеку (stack) лежать локальні змінні й виклики методів, кожен потік має свій стек. У купі (heap) лежать усі об\'єкти, створені через new. Java передає аргументи за значенням: для обʼєктів копіюється посилання. Тому метод може змінити вміст об\'єкта, але не саму змінну ззовні.','class Demo {\n    static void change(int n, StringBuilder sb) {\n        n = 99;\n        sb.append("!");\n    }\n}\n\n// у main:\nint x = 1;\nStringBuilder s = new StringBuilder("hi");\nDemo.change(x, s);\nSystem.out.println(x);\nSystem.out.println(s);','1\nhi!'),
 K('Збирач сміття','Відповідь: garbage collector автоматично видаляє об\'єкти в купі, на які більше немає посилань. Програмісту не потрібно звільняти пам\'ять вручну. Файли та з\'єднання збирач не закриває, їх закривають через try-with-resources.','String s = new String("data");\ns = null;\n// на об\'єкт "data" більше немає посилань,\n// тепер його може прибрати збирач сміття'),
 K('final, finally, finalize','Відповідь: це три різні речі. `final` це модифікатор: змінну не можна перепризначити, метод перевизначити, клас успадкувати. `finally` це блок після try, що виконується завжди. `finalize()` це застарілий метод, яким не користуються.','final int max = 10;\ntry {\n    System.out.println(max);\n} finally {\n    System.out.println("finally");\n}','10\nfinally'),
 K('synchronized і volatile','Відповідь: `synchronized` пускає в метод або блок лише один потік одночасно. Це захищає від гонки даних, коли потоки псують спільну змінну. `volatile` гарантує, що зміну побачать усі потоки, але не робить `count++` атомарним.','class Counter {\n    private int count = 0;\n\n    synchronized void inc() {\n        count++;\n    }\n\n    int get() {\n        return count;\n    }\n}\n\n// у main (main має throws InterruptedException):\nCounter c = new Counter();\nThread t1 = new Thread(() -> { for (int i = 0; i < 1000; i++) c.inc(); });\nThread t2 = new Thread(() -> { for (int i = 0; i < 1000; i++) c.inc(); });\nt1.start();\nt2.start();\nt1.join();\nt2.join();\nSystem.out.println(c.get());','2000')
]
};

/* ================= Helpers ================= */
const $app=document.getElementById('app');
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const KW='public|private|protected|static|void|class|int|double|float|long|boolean|char|String|final|if|else|switch|case|default|break|continue|for|while|do|return|new|true|false|null|import|package|this';
const RX=new RegExp('(\\/\\/[^\\n]*)|("(?:\\\\.|[^"\\\\\\n])*")|(\'(?:\\\\.|[^\'\\\\\\n])\')|\\b('+KW+')\\b|\\b(\\d+(?:\\.\\d+)?)\\b|\\b([A-Z][A-Za-z0-9_]*)\\b','g');
function hl(src){
  let out='',last=0,m;RX.lastIndex=0;
  while((m=RX.exec(src))){
    out+=esc(src.slice(last,m.index));
    const t=m[1]?'com':(m[2]||m[3])?'str':m[4]?'kw':m[5]?'num':'ty';
    out+='<span class="t-'+t+'">'+esc(m[0])+'</span>';
    last=m.index+m[0].length;
  }
  return out+esc(src.slice(last));
}
function shuffle(a,avoidSame){
  const orig=a.slice();let r;let tries=0;
  do{r=orig.slice();for(let i=r.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[r[i],r[j]]=[r[j],r[i]];}tries++;}
  while(avoidSame&&r.length>1&&tries<12&&r.every((x,i)=>x===orig[i]));
  return r;
}

function norm(s){
  const r=Object.assign(fresh(),s);

}

function shownStreak(){
  if(S.last===today()||S.last===dAgo(1))return S.streak;

}
function bumpStreak(){
  const r={froze:false,earned:false};
  if(S.last===today())return r;
  if(S.last===dAgo(1))S.streak++;
  else if(S.last===dAgo(2)&&S.freeze>0){S.freeze--;S.streak++;r.froze=true;}

  return r;
}

let actx=null;
const SEQ={
  ok:[[660,0,.1],[880,.09,.16]],
  bad:[[196,0,.18],[147,.15,.26]],
  done:[[523,0,.12],[659,.11,.12],[784,.22,.12],[1047,.33,.34]],
  star:[[784,0,.1],[988,.1,.1],[1319,.2,.24]]

function snd(k){
  if(!S.sound||!SEQ[k])return;
  try{
    actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    if(actx.state==='suspended')actx.resume();
    const t0=actx.currentTime;
    SEQ[k].forEach(n=>{
      const o=actx.createOscillator(),g=actx.createGain();
      o.type=k==='bad'?'triangle':'sine';o.frequency.value=n[0];
      g.gain.setValueAtTime(0.0001,t0+n[1]);
      g.gain.exponentialRampToValueAtTime(0.12,t0+n[1]+0.015);
      g.gain.exponentialRampToValueAtTime(0.0001,t0+n[1]+n[2]);
      o.connect(g);g.connect(actx.destination);
      o.start(t0+n[1]);o.stop(t0+n[1]+n[2]+0.03);
    });
  }catch(e){}
}

const toasts=[];let toastBusy=false;
function toast(title,msg,kind){toasts.push({title,msg,kind});pumpToast();}
function pumpToast(){
  if(toastBusy||!toasts.length)return;
  toastBusy=true;
  const t=toasts.shift(),el=document.createElement('div');
  el.className='toast'+(t.kind==='ach'?' ach':'');
  el.setAttribute('role','status');
  el.innerHTML='<div class="t-ico">'+(t.kind==='ach'?IC.star:IC.check)+'</div><div class="t-tx"><b>'+esc(t.title)+'</b><span>'+esc(t.msg)+'</span></div>';
  document.body.appendChild(el);
  setTimeout(()=>{el.classList.add('out');},3200);
  setTimeout(()=>{if(el.parentNode)el.parentNode.removeChild(el);toastBusy=false;pumpToast();},3700);
}

function codeBlock(code){return '<pre class="code"><code>'+hl(code)+'</code></pre>';}
function fmt(s){return esc(s).replace(/`([^`]+)`/g,'<code>$1</code>');}
function fillCode(ex,c){
  const parts=ex.code.split(/\[\[(\d)\]\]/);let h='';
  parts.forEach((p,i)=>{
    if(i%2===0){h+=hl(p);}
    else{
      const k=+p,id=c.slots[k],w=id==null?null:c.words.find(x=>x.id===id).w;
      let cls='blank';
      if(c.checked&&w!=null){
        const ok=w===ex.ans[k];
        cls+=ok?' good':' bad';
        if(fx.res)cls+=ok?' pop':' shake';
      }else if(fx.slot===k)cls+=' set';
      h+='<button class="'+cls+'" data-act="unslot" data-i="'+k+'"'+(c.checked?' disabled':'')+' aria-label="Пропуск '+(k+1)+'">'+(w==null?'&nbsp;':esc(w))+'</button>';
    }
  });
  return '<pre class="code"><code>'+h+'</code></pre>';
}
function typeCode(ex,c){
  const parts=ex.code.split('[[0]]');
  const cls='tslot'+(c.checked?(c.ok?' good':' bad'):'');
  const val=c.val?esc(c.val):'&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;';
  return '<pre class="code"><code>'+hl(parts[0])+'<span class="'+cls+'" id="tslot">'+val+'</span>'+hl(parts[1]||'')+'</code></pre>';
}
function ready(c){
  const ex=c.ex;
  if(ex.t==='mc'||ex.t==='out'||ex.t==='bug')return c.sel!=null;
  if(ex.t==='fill')return c.slots.every(x=>x!=null);
  if(ex.t==='type')return c.val.trim().length>0;
  return c.bank.length===0;
}
function xpChip(){
  const pp=fx.xpPop?'<i class="pp '+(fx.xpPop[0]==='+'?'plus':'minus')+'">'+fx.xpPop+' XP</i>':'';

function heartsHtml(){

/* ---------- motion helpers ---------- */
function animateBars(){
  const bars=$app.querySelectorAll('.fill[data-to]');
  if(!bars.length)return;
  void $app.offsetWidth;
  requestAnimationFrame(()=>{bars.forEach(b=>{b.style.width=b.dataset.to+'%';});});
}
function runCounters(){
  if(isReduced())return;
  $app.querySelectorAll('[data-count]').forEach(el=>{
    const to=+el.dataset.count,from=+(el.dataset.from||0),pre=el.dataset.pre||'',suf=el.dataset.suf||'';
    if(from===to)return;
    const t0=performance.now(),dur=900;
    (function step(now){
      const p=Math.min(1,Math.max(0,(now-t0)/dur)),e=1-Math.pow(1-p,3);
      el.textContent=pre+Math.round(from+(to-from)*e)+suf;
      if(p<1)requestAnimationFrame(step);
    })(t0);
  });
}
function confetti(){
  if(isReduced())return;
  const box=document.createElement('div');
  box.className='confetti';box.setAttribute('aria-hidden','true');
  let s='';
  for(let i=0;i<46;i++){
    const w=6+Math.random()*7;

/* ================= Lesson logic ================= */
function prep(){
  const ex=L.queue[0],c={ex,checked:false,ok:null,t0:performance.now(),hints:0,gone:[]};
  if(ex.t==='mc'||ex.t==='out'){c.opts=shuffle(ex.opts.map((text,i)=>({text,ok:i===0})));c.sel=null;}
  else if(ex.t==='fill'){c.words=shuffle(ex.ans.concat(ex.extra).map((w,i)=>({id:i,w})));c.slots=ex.ans.map(()=>null);}
  else if(ex.t==='order'){c.bank=shuffle(ex.lines.map((text,i)=>({id:i,text})),true);c.built=[];}
  else if(ex.t==='bug'){c.sel=null;}
  else{c.val='';c.hintTxt='';}
  L.cur=c;fx.stage=true;
}
function reviewPick(){
  const pool=reviewPool(),due=dueList();
  let q=due.slice(0,8);
  if(q.length<8){const m=pool.filter(e=>S.miss[e.id]>0&&!q.includes(e)).sort((x,y)=>S.miss[y.id]-S.miss[x.id]);q=q.concat(m.slice(0,8-q.length));}
  if(q.length<8){
    const lessons=ALL.filter(l=>S.done[l.uid]&&!S.done[l.uid].skip).sort((x,y)=>S.done[x.uid].t-S.done[y.uid].t).slice(0,6);
    const lists=lessons.map(l=>shuffle(l.lesson.ex.filter(e=>!q.includes(e))));
    const want=Math.min(8,pool.length)-q.length,rest=[];
    for(let r=0;rest.length<want&&r<20;r++)lists.forEach(li=>{if(rest.length<want&&li[r])rest.push(li[r]);});
    q=q.concat(rest);
  }
  return shuffle(q);
}
function newRun(info,queue,extra){
  const mx=LEVELS[S.level].hearts;
  L=Object.assign({info,mode:'practice',queue,total:queue.length,done:0,first:0,earn:0,hearts:mx,max:mx,retried:new Set(),hinted:new Set(),leave:false,cur:null,si:0,peek:false,fast:0,review:false,placement:false},extra||{});
  delete barsMem.lesson;
  screen='lesson';fx.view=true;prep();render();window.scrollTo(0,0);
}
function startReview(){
  const q=reviewPick();if(!q.length)return;
  newRun({uid:'review',n:-1,lesson:{title:'Змішані завдання з пройдених уроків',ex:[]}},q,{review:true,allEx:q.slice()});
}
function startPlacement(){
  const q=[];
  for(let ui=0;ui<8&&ui<UNITS.length;ui++){
    const ls=UNITS[ui].lessons,lsn=ls[ls.length-1];
    const pool=lsn.ex.filter(e=>e.t==='mc'||e.t==='out'||e.t==='fill');
    q.push(pool[Math.floor(Math.random()*pool.length)]);
  }
  newRun({uid:'placement',n:-1,lesson:{title:'Тест рівня',ex:[]}},q,{placement:true,hearts:99,max:99,pl:[]});
}
function startLesson(uid){
  if(uid==='review'){startReview();return;}
  const info=ALL.find(l=>l.uid===uid);if(!info||!isUnlocked(info.n))return;
  if(ALL.find(l=>l.ui===info.ui)===info&&!S.story[info.ui]&&STORY[info.ui]){pendingUid=uid;screen='story';fx.view=true;render();window.scrollTo(0,0);return;}
  newRun(info,info.lesson.ex.slice(),{mode:'study'});
}
function endStudy(){
  L.mode='practice';L.peek=false;L.si=0;
  fx.view=true;fx.stage=true;
  render();window.scrollTo(0,0);
}
function hint(){
  const c=L.cur,ex=c.ex;
  if(!c||c.checked||canHint(c)!==true)return;
  c.hints++;S.stats.hints++;
  if(S.level==='normal'&&!L.hinted.has(ex))fx.xpPop='−5';
  if(S.level!=='easy')L.hinted.add(ex);
  if(ex.t==='mc'||ex.t==='out'){
    const wrong=c.opts.map((o,i)=>i).filter(i=>!c.opts[i].ok&&i!==c.sel);
    shuffle(wrong).slice(0,2).forEach(i=>c.gone.push(i));
  }else if(ex.t==='bug'){
    const wrong=ex.lines.map((l,i)=>i).filter(i=>i!==ex.bad&&i!==c.sel&&ex.lines[i].trim());
    shuffle(wrong).slice(0,Math.ceil(wrong.length/2)).forEach(i=>c.gone.push(i));
    if(c.gone.includes(c.sel))c.sel=null;
  }else if(ex.t==='fill'){
    const k=ex.ans.findIndex((w,i)=>{const id=c.slots[i];return id==null||c.words.find(x=>x.id===id).w!==w;});
    if(k<0)return;
    c.slots[k]=null;
    let chip=c.words.find(x=>x.w===ex.ans[k]&&!c.slots.includes(x.id));
    if(!chip){
      const j=c.slots.findIndex(id=>id!=null&&c.words.find(x=>x.id===id).w===ex.ans[k]);
      if(j>=0)c.slots[j]=null;
      chip=c.words.find(x=>x.w===ex.ans[k]&&!c.slots.includes(x.id));
    }
    if(chip){c.slots[k]=chip.id;fx.slot=k;}
  }else if(ex.t==='order'){
    let i=0;while(i<c.built.length&&c.built[i].text===ex.lines[i])i++;
    while(c.built.length>i)c.bank.push(c.built.pop());
    const bi=c.bank.findIndex(b=>b.text===ex.lines[i]);
    if(bi>=0){const b=c.bank.splice(bi,1)[0];c.built.push(b);fx.line=b.id;}
  }else{
    const a=ex.acc[0];
    c.hintTxt=a.slice(0,Math.max(2,Math.ceil(a.length*0.35)))+'…';
  }
  render();
}
function check(){
  const c=L.cur,ex=c.ex;if(c.checked||!ready(c))return;
  let ok;
  if(ex.t==='mc'||ex.t==='out')ok=c.opts[c.sel].ok;
  else if(ex.t==='fill')ok=c.slots.every((id,k)=>c.words.find(w=>w.id===id).w===ex.ans[k]);
  else if(ex.t==='order')ok=c.built.map(b=>b.text).join('\n')===ex.lines.join('\n');
  else if(ex.t==='bug')ok=c.sel===ex.bad;
  else ok=ex.acc.some(a=>strip(a)===strip(c.val));
  c.checked=true;c.ok=ok;fx.res=ok?'pop':'shake';
  const firstTry=!L.retried.has(ex);
  recordAnswer(ex,ok,firstTry,c);
  if(L.placement){
    L.done++;L.pl.push(ok);
  }else if(ok){
    L.done++;
    {const g=(L.retried.has(ex)||L.hinted.has(ex))?5:10;L.earn=(L.earn||0)+g;fx.xpPop='+'+g;}
    if(firstTry&&!L.hinted.has(ex)){
      L.first++;
      const dt=(performance.now()-c.t0)/1000;
      if(dt<8&&ex.t!=='type'&&ex.t!=='order'){L.fast++;fx.fast=true;}
    }
    if(firstTry){
      if(S.miss[ex.id]>0){S.miss[ex.id]--;if(!S.miss[ex.id])delete S.miss[ex.id];}
      if(ex.t==='bug')S.stats.bugs++;
      if(ex.t==='type')S.stats.typed++;
    }
  }else{
    L.hearts--;fx.hit=L.hearts;
    S.miss[ex.id]=Math.min(5,(S.miss[ex.id]||0)+1);
    if(L.hearts>0){L.retried.add(ex);L.queue.push(ex);}
  }
  if(!L.placement){
    if(ok){S.stats.run++;S.stats.runBest=Math.max(S.stats.runBest,S.stats.run);}else S.stats.run=0;
  }
  save();
  snd(ok?'ok':'bad');
  render();
  checkAch();
}
function next(){
  const c=L.cur;if(!c.checked)return;
  L.queue.shift();
  if(!L.placement&&L.hearts<=0&&!c.ok){screen='fail';fx.view=true;render();window.scrollTo(0,0);return;}
  if(!L.queue.length){finish();return;}
  prep();render();window.scrollTo(0,0);
}
function finishPlacement(){
  let known=0;
  for(const ok of L.pl){if(ok)known++;else break;}
  ALL.filter(l=>l.ui<known&&!S.done[l.uid]).forEach(l=>{S.done[l.uid]={a:0,skip:1,t:Date.now()};});
  S.stats.placement=1;save();
  res={placement:true,known,total:L.pl.length,right:L.pl.filter(Boolean).length,next:UNITS[known]?UNITS[known].title:null};
  screen='result';fx.view=true;fx.confetti=known>0;snd('done');
  render();window.scrollTo(0,0);
}
function finish(){
  if(L.placement){finishPlacement();return;}
  const acc=Math.round(L.first/L.total*100);
  const mult=(S.level==='hard'?1.5:1)*(isWeekend()?2:1);
  const gain=Math.round((L.first*10+(L.total-L.first)*5+5+L.fast*2)*mult);
  const notes=[];
  if(L.fast)notes.push('Бонус за швидкі відповіді: +'+L.fast*2);
  if(S.level==='hard')notes.push('Складний режим: досвід ×1,5');
  if(isWeekend())notes.push('Вихідні: досвід ×2');
  const lv0=lvlInfo(S.xp).n;
  S.xp+=gain;
  const li=lvlInfo(S.xp);
  if(li.n>lv0)notes.push('Новий рівень: '+li.n+' («'+li.title+'»)');
  const dxp=S.day.d===today()?S.day.xp:0;
  const goalHit=dxp<S.goal&&dxp+gain>=S.goal;
  S.day={d:today(),xp:dxp+gain};
  {const H=S.hist[today()]||(S.hist[today()]={xp:0,ok:0,bad:0,sec:0});H.xp+=gain;}
  if(goalHit){S.stats.goals++;notes.push('Ціль дня виконано');}
  const st=bumpStreak();
  if(st.froze)notes.push('Заморожування врятувало серію');
  if(st.earned)notes.push('Нове заморожування серії за тиждень занять');
  if(L.review){
    S.stats.reviews++;
    const seen={};L.allEx.forEach(e=>{seen[e.id.split(':')[0]]=1;});
    Object.keys(seen).forEach(uid=>{if(S.done[uid])S.done[uid].t=Date.now();});
  }else{
    const prev=S.done[L.info.uid];
    S.done[L.info.uid]={a:Math.max(prev&&!prev.skip?prev.a:0,acc),t:Date.now()};
    S.stats.lessons++;
    if(acc===100)S.stats.perfect++;
  }
  save();
  res={info:L.info,acc,gain,hearts:L.hearts,max:L.max,review:!!L.review,notes};
  screen='result';fx.view=true;fx.confetti=true;
  snd('done');
  render();window.scrollTo(0,0);
  if(li.n>lv0)toast('Новий рівень',li.n+' · '+li.title,'ach');
  checkAch();
}

async function api(path,opt,authed){
  const h=Object.assign({apikey:CFG.key,'Content-Type':'application/json'},(opt&&opt.headers)||{});
  if(authed){
    if(AUTH&&AUTH.expires_at&&AUTH.expires_at-60<Date.now()/1000)await refreshAuth();
    if(!AUTH)throw new Error('no session');
    h.Authorization='Bearer '+AUTH.access_token;
  }
  const r=await fetch(CFG.url+path,Object.assign({},opt,{headers:h}));
  let j=null;try{j=await r.json();}catch(e){}
  if(!r.ok){const er=new Error('http');er.status=r.status;er.body=j;throw er;}
  return j;
}
function takeSession(j){

function mergeProgress(a,b){ // a = local, b = cloud (both normalised)
  const o=norm(JSON.parse(JSON.stringify(b)));
  for(const k in a.done){const x=a.done[k],y=o.done[k];
    if(!y)o.done[k]=x;
    else if(y.skip&&!x.skip)o.done[k]=x;
    else if(!y.skip&&!x.skip)o.done[k]={a:Math.max(x.a||0,y.a||0),t:Math.max(x.t||0,y.t||0)};}
  for(const k in a.miss)if(!(k in o.miss))o.miss[k]=a.miss[k];
  o.xp=Math.max(a.xp,b.xp);
  if(a.last>b.last||(a.last===b.last&&a.streak>b.streak)){o.last=a.last;o.streak=a.streak;o.freeze=a.freeze;}
  if(a.day&&b.day){if(a.day.d>b.day.d||(a.day.d===b.day.d&&a.day.xp>b.day.xp))o.day=a.day;}
  for(const k in a.ach)if(!o.ach[k])o.ach[k]=a.ach[k];
  for(const k in a.srs)if(!o.srs[k]||(a.srs[k].d||0)>(o.srs[k].d||0))o.srs[k]=a.srs[k];
  for(const k in a.hist){const x=a.hist[k],y=o.hist[k]||(o.hist[k]={xp:0,ok:0,bad:0,sec:0});['xp','ok','bad','sec'].forEach(f=>{y[f]=Math.max(y[f]||0,x[f]||0);});}
  for(const k in a.us){const x=a.us[k],y=o.us[k]||(o.us[k]={ok:0,bad:0});y.ok=Math.max(y.ok,x.ok);y.bad=Math.max(y.bad,x.bad);}
  for(const k in a.story)o.story[k]=1;
  for(const k in a.stats)o.stats[k]=Math.max(a.stats[k]||0,o.stats[k]||0);
  return o;
}

/* ---- voice ---- */
function speak(k){
  if(!('speechSynthesis' in window)){toast('Немає озвучення','Цей браузер його не підтримує');return;}
  const ss=window.speechSynthesis;
  if(ss.speaking){ss.cancel();return;}
  const u=new SpeechSynthesisUtterance(k.h+'. '+k.p.replace(/`/g,'')+(k.code?' Приклад коду показано на екрані.':''));
  const v=ss.getVoices().find(x=>/^uk/i.test(x.lang));
  if(v){u.voice=v;u.lang=v.lang;}else{u.lang='uk-UA';if(ss.getVoices().length)toast('Українського голосу немає','Прочитаю стандартним');}
  u.rate=.95;ss.speak(u);
}

const SAMPLES=[
 ['Привіт','public class Main {\n    public static void main(String[] args) {\n        System.out.println("Привіт, Java!");\n    }\n}\n',''],
 ['Цикл','public class Main {\n    public static void main(String[] args) {\n        for (int i = 1; i <= 5; i++) {\n            System.out.println(i * i);\n        }\n    }\n}\n',''],

const RUNNER=((window.BARISTA_CONFIG||{}).runner)||'https://ce.judge0.com';
const b64=s=>btoa(unescape(encodeURIComponent(s)));
const unb64=s=>{try{return s?decodeURIComponent(escape(atob(s))):'';}catch(e){return '';}};
async function javaLang(){
  if(IDE.lang)return IDE.lang;
  try{
    const r=await fetch(RUNNER+'/languages');const j=await r.json();
    const ids=j.filter(x=>/^Java \(OpenJDK/i.test(x.name)).map(x=>x.id);
    IDE.lang=ids.length?Math.max.apply(null,ids):62;
  }catch(e){IDE.lang=62;}
  return IDE.lang;
}
async function runCode(){
  if(IDE.busy)return;
  IDE.busy=true;IDE.out='Запускаю…';IDE.kind='';
  const ca=document.getElementById('ide-code'),si=document.getElementById('ide-in');
  if(ca)IDE.code=ca.value;if(si)IDE.stdin=si.value;
  render();
  try{
    const lang=await javaLang();
    const ctrl=new AbortController();const to=setTimeout(()=>ctrl.abort(),25000);
    const r=await fetch(RUNNER+'/submissions?base64_encoded=true&wait=true',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({source_code:b64(IDE.code),language_id:lang,stdin:b64(IDE.stdin)}),signal:ctrl.signal});
    clearTimeout(to);
    if(!r.ok)throw new Error('http '+r.status);
    const j=await r.json();
    const so=unb64(j.stdout),se=unb64(j.stderr),co=unb64(j.compile_output);
    if(co){IDE.kind='err';IDE.out='Помилка компіляції:\n'+co;}
    else if(se){IDE.kind='err';IDE.out=(so?so+'\n':'')+'Помилка виконання:\n'+se;}
    else{IDE.kind='ok';IDE.out=so||'(програма нічого не вивела)';}
  }catch(e){
    IDE.kind='err';IDE.out='Не вдалося зв’язатися із сервером запуску коду. Перевір інтернет і спробуй ще раз.';
  }
  IDE.busy=false;
  if(screen==='ide'){fx.view=false;render();}
}

/* ---- stats ---- */
function statsView(){
  const us=Object.values(S.us),okN=us.reduce((n,u)=>n+u.ok,0),badN=us.reduce((n,u)=>n+u.bad,0);
  const acc=okN+badN?Math.round(okN/(okN+badN)*100):0;
  const secs=Object.values(S.hist).reduce((n,d)=>n+(d.sec||0),0),mins=Math.round(secs/60);
  const doneN=ALL.filter(l=>S.done[l.uid]&&!S.done[l.uid].skip).length;
  let h='<div class="view hastabs'+(fx.view?' enter':'')+'">'+topbar();
  h+='<h1 class="pg-t">Прогрес</h1><div class="tiles">'
    +'<div class="tile"><b>'+S.xp+'</b><span>Досвід</span></div><div class="tile"><b>'+doneN+'</b><span>Уроків</span></div>'
    +'<div class="tile"><b>'+(okN+badN?acc+'%':'0%')+'</b><span>Точність</span></div><div class="tile"><b>'+mins+'</b><span>Хвилин</span></div></div>';
  // week chart
  const names=['нд','пн','вт','ср','чт','пт','сб'];
  const days=[];for(let i=6;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);const k=dayStr(d);days.push({k,n:names[d.getDay()],xp:(S.hist[k]&&S.hist[k].xp)||0});}
  const mx=Math.max(30,S.goal,...days.map(d=>d.xp));
  let svg='<svg class="chart" viewBox="0 0 320 150" role="img" aria-label="Досвід за останні 7 днів">';
  const gy=116-(S.goal/mx)*96;
  svg+='<line x1="8" x2="312" y1="'+gy+'" y2="'+gy+'" class="goal-l"/>';
  days.forEach((d,i)=>{const bh=Math.round(d.xp/mx*96),x=14+i*43;
    svg+='<rect x="'+x+'" y="'+(116-Math.max(bh,d.xp?3:0))+'" width="30" height="'+Math.max(bh,d.xp?3:0)+'" rx="6" class="bar-r'+(d.k===today()?' now':'')+'"/>'
      +(d.xp?'<text x="'+(x+15)+'" y="'+(110-bh)+'" text-anchor="middle" class="bar-v">'+d.xp+'</text>':'')
      +'<text x="'+(x+15)+'" y="138" text-anchor="middle" class="bar-n">'+d.n+'</text>';});
  svg+='</svg>';
  h+='<section class="card"><h2>Досвід за тиждень</h2>'+svg+'<p class="desc">Пунктир це твоя денна ціль: '+S.goal+' XP.</p></section>';
  // accuracy by unit
  const rows=Object.keys(S.us).map(k=>+k).filter(k=>UNITS[k]).sort((a,b)=>a-b);
  h+='<section class="card"><h2>Точність за розділами</h2>';
  if(!rows.length)h+='<p class="desc">Пройди кілька уроків, і тут з’явиться статистика.</p>';
  rows.forEach(k=>{const u=S.us[k],n=u.ok+u.bad,p=Math.round(u.ok/n*100);
    h+='<div class="urow"><span class="un">'+(k+1)+'. '+esc(UNITS[k].title)+'</span><div class="track"><div class="fill'+(p<70?' low':'')+'" style="width:'+p+'%"></div></div><span class="up">'+p+'%</span></div>';});
  const wk=weakUnits();
  if(wk.length)h+='<p class="desc">Найслабше: '+wk.slice(0,2).map(x=>esc(UNITS[x.ui].title)).join(', ')+'.</p><button class="btn" style="margin-top:12px" data-act="weak">Потренувати слабкі місця</button>';
  else if(rows.length)h+='<p class="desc">Слабких місць не видно. Так тримати.</p>';
  h+='</section>';
  // wardrobe
  const lv=lvlInfo(S.xp).n;
  h+='<section class="card"><h2>Гардероб лисички</h2><div class="ward-m">'+mascot('happy',120)+'</div><p class="desc">Нові речі відкриваються з рівнями. Зараз у тебе рівень '+lv+'.</p>';
  Object.keys(FIT).forEach(slot=>{
    h+='<p class="ward-s">'+FITSLOT[slot]+'</p><div class="ward-r">';
    FIT[slot].forEach(it=>{const un=fitUnlocked(it),on=fitNow(slot)===it.id;
      h+='<button class="uchip'+(on?' on':'')+'" data-act="fit" data-slot="'+slot+'" data-v="'+it.id+'"'+(un?'':' disabled')+'>'+esc(it.t)+(un?'':' · рівень '+it.lv)+'</button>';});
    h+='</div>';
  });
  h+='</section>';
  // achievements
  const got=ACH.filter(a=>S.ach[a.id]).length;
  h+='<h2 class="pg-s">Досягнення · '+got+' / '+ACH.length+'</h2><div class="alist">';
  ACH.forEach((a,i)=>{const on=!!S.ach[a.id];
    h+='<div class="ach'+(on?' on':'')+'" style="--i:'+i+'"><div class="ach-i">'+(on?IC.star:IC.lock)+'</div><div class="ach-t"><h3>'+esc(a.t)+'</h3><p>'+esc(a.d)+'</p></div></div>';});
  h+='</div></div>'+tabs('stats');
  return h;
}
